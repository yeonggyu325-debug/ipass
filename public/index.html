<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>I-PASS 협력사 이행수준평가</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#f4f6f8;color:#1f2937}
header{height:64px;background:#fff;border-bottom:1px solid #dfe3e8;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.brand{font-weight:800}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 64px)}
aside{background:#fff;border-right:1px solid #dfe3e8;padding:18px 12px}.nav{padding:11px 12px;border-radius:8px;margin:3px 0;cursor:pointer}.nav.active,.nav:hover{background:#eef4fb;color:#1f5aa6;font-weight:700}
main{padding:24px}.page{display:none}.page.active{display:block}.sub{color:#6b7280;font-size:14px;margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}.kpi,.card,.info,.item{background:#fff;border:1px solid #dfe3e8;border-radius:10px}
.kpi{padding:16px}.kpi .label{font-size:13px;color:#6b7280}.kpi .value{font-size:28px;font-weight:800;margin-top:8px}
.card{overflow:hidden}.card-title{padding:14px 16px;border-bottom:1px solid #dfe3e8;font-weight:700}
table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #edf0f2;text-align:left;font-size:14px}th{background:#fafbfc;font-size:12px;color:#4b5563}tbody tr{cursor:pointer}tbody tr:hover{background:#f7fbff}
.tag{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}.green{background:#ecfdf3;color:#15803d}.orange{background:#fff7ed;color:#b45309}.blue{background:#eaf2ff;color:#1d4ed8}.gray{background:#f3f4f6;color:#4b5563}
.btn{border:1px solid #dfe3e8;background:#fff;padding:9px 12px;border-radius:7px;cursor:pointer}.info{padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.field label{display:block;font-size:12px;color:#6b7280;margin-bottom:5px}.field input{width:100%;height:40px;border:1px solid #dfe3e8;border-radius:7px;padding:0 10px;background:#f9fafb}
.item{margin-bottom:12px;overflow:hidden}.item-head{padding:15px 16px;display:flex;justify-content:space-between;cursor:pointer}.item-body{display:none;border-top:1px solid #dfe3e8;padding:16px}.item.open .item-body{display:block}
.guide{background:#f7fafc;border-left:4px solid #1f5aa6;padding:12px;margin-bottom:12px}.detail{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box{border:1px solid #dfe3e8;border-radius:8px;padding:12px}
.error{color:#b91c1c;padding:20px}.loading{padding:24px;color:#6b7280}.api{font-size:12px;color:#6b7280}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.grid,.detail{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="brand">I-PASS 협력사 이행수준평가</div><div class="api" id="apiState">API 확인 중</div></header>
<div class="layout">
<aside>
<div class="nav active" data-page="dashboard">대시보드</div>
<div class="nav" data-page="targets">평가대상 관리</div>
<div class="nav">평가회차 관리</div><div class="nav">평가표 관리</div><div class="nav">협력사 관리</div>
</aside>
<main>
<section class="page active" id="dashboard">
<h1 id="dashboardTitle">평가 대시보드</h1><div class="sub" id="cycleText">평가회차 불러오는 중...</div>
<div class="kpis">
<div class="kpi"><div class="label">평가대상 업체</div><div class="value" id="targetCount">-</div></div>
<div class="kpi"><div class="label">제출완료</div><div class="value" id="submittedCount">-</div></div>
<div class="kpi"><div class="label">평가중</div><div class="value" id="evaluatingCount">-</div></div>
<div class="kpi"><div class="label">평가완료</div><div class="value" id="completedCount">-</div></div>
<div class="kpi"><div class="label">미확인 알림</div><div class="value" id="unreadCount">-</div></div>
</div>
<div class="card"><div class="card-title">협력사 진행현황</div><div id="companyTable" class="loading">불러오는 중...</div></div>
</section>

<section class="page" id="targets">
<h1>평가대상 관리</h1><div class="sub">평가회차별 협력사 선정 현황</div>
<div class="card"><div id="targetTable" class="loading">불러오는 중...</div></div>
</section>

<section class="page" id="evaluation">
<button class="btn" onclick="showPage('dashboard')">← 대시보드</button>
<h1 id="evaluationTitle">평가 상세</h1>
<div class="info"><div class="grid">
<div class="field"><label>회사명</label><input id="companyName" readonly></div>
<div class="field"><label>업종</label><input id="industryName" readonly></div>
<div class="field"><label>사업자등록번호</label><input id="businessNumber" readonly></div>
<div class="field"><label>대표자명</label><input id="representativeName" readonly></div>
<div class="field"><label>상시근로자 수</label><input id="workerCount" readonly></div>
<div class="field"><label>진행상태</label><input id="targetStatus" readonly></div>
</div></div>
<div id="evaluationItems"></div>
</section>
</main>
</div>
<script>
const state={cycles:[],cycleId:null};
document.querySelectorAll('.nav[data-page]').forEach(n=>n.onclick=()=>showPage(n.dataset.page));
function showPage(name){
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
 document.getElementById(name).classList.add('active');
 document.querySelectorAll('.nav[data-page]').forEach(n=>n.classList.toggle('active',n.dataset.page===name));
 if(name==='targets') loadTargets();
}
async function api(path){
 const r=await fetch(path,{headers:{Accept:'application/json'}});
 const t=await r.text();
 if(!r.ok) throw new Error('HTTP '+r.status+(t?' · '+t.slice(0,160):''));
 if(!t) throw new Error('API 응답이 비어 있습니다.');
 return JSON.parse(t);
}
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}
function tag(s){const m={pending:['대기','gray'],drafting:['작성중','gray'],submitted:['제출완료','green'],evaluating:['평가중','orange'],finalized:['평가완료','blue']};const a=m[s]||[s||'-','gray'];return `<span class="tag ${a[1]}">${esc(a[0])}</span>`}
async function boot(){
 try{
  const h=await api('/api/health');document.getElementById('apiState').textContent=h.success?'API 연결됨':'API 확인 필요';
  const c=await api('/api/cycles');state.cycles=c.cycles||[];const cycle=state.cycles[0];state.cycleId=cycle?.id||null;
  if(cycle){document.getElementById('dashboardTitle').textContent=cycle.cycle_name+' 대시보드';document.getElementById('cycleText').textContent=(cycle.start_at||'-')+' ~ '+(cycle.end_at||'-')}
  const d=(await api('/api/dashboard')).dashboard||{};
  targetCount.textContent=d.target_company_count??0;submittedCount.textContent=d.submitted_count??0;evaluatingCount.textContent=d.evaluating_count??0;completedCount.textContent=d.completed_count??0;unreadCount.textContent=d.unread_notification_count??0;
  await loadCompanies();
 }catch(e){companyTable.innerHTML='<div class="error">'+esc(e.message)+'</div>';apiState.textContent='API 오류'}
}
async function loadCompanies(){
 const data=await api('/api/targets');let list=data.targets||[];if(state.cycleId) list=list.filter(x=>x.cycle_id===state.cycleId);list=list.filter(x=>Number(x.is_selected)===1);
 if(!list.length){companyTable.innerHTML='<div class="loading">평가대상이 없습니다.</div>';return}
 companyTable.innerHTML=`<table><thead><tr><th>협력사</th><th>업종</th><th>상시근로자</th><th>상태</th></tr></thead><tbody>${list.map(t=>`<tr onclick="openEvaluation('${String(t.id).replaceAll("'","\\'")}')"><td><b>${esc(t.company_name)}</b></td><td>${esc(t.industry_name||'-')}</td><td>${t.worker_count??'-'}</td><td>${tag(t.status)}</td></tr>`).join('')}</tbody></table>`;
}
async function loadTargets(){
 try{
  const data=await api('/api/targets');let list=data.targets||[];if(state.cycleId) list=list.filter(x=>x.cycle_id===state.cycleId);
  targetTable.innerHTML=`<table><thead><tr><th>협력사</th><th>업종</th><th>선정여부</th><th>제외사유</th><th>상태</th></tr></thead><tbody>${list.map(t=>`<tr><td>${esc(t.company_name)}</td><td>${esc(t.industry_name||'-')}</td><td>${Number(t.is_selected)===1?'평가대상':'제외'}</td><td>${esc(t.exclusion_reason||'-')}</td><td>${tag(t.status)}</td></tr>`).join('')}</tbody></table>`;
 }catch(e){targetTable.innerHTML='<div class="error">'+esc(e.message)+'</div>'}
}
async function openEvaluation(id){
 showPage('evaluation');evaluationItems.innerHTML='<div class="loading">평가항목 불러오는 중...</div>';
 try{
  const data=await api('/api/evaluations/'+encodeURIComponent(id));const e=data.evaluation||{},t=e.target||{},items=e.items||[];
  evaluationTitle.textContent=(t.company_name||'협력사')+' 평가';companyName.value=t.company_name||'';industryName.value=t.industry_name||'';businessNumber.value=t.business_number||'';representativeName.value=t.representative_name||'';workerCount.value=t.worker_count??'';targetStatus.value=t.status||'';
  evaluationItems.innerHTML=items.length?items.map((i,n)=>`<div class="item ${n===0?'open':''}"><div class="item-head" onclick="this.parentElement.classList.toggle('open')"><div><b>${esc(i.item_code||'')} ${esc(i.item_name||'')}</b> <span class="tag blue">배점 ${i.max_score??0}점</span> ${Number(i.applicable)===0?'<span class="tag gray">N/A</span>':''}</div><div>⌄</div></div><div class="item-body"><div class="guide"><b>제출 가이드</b><br>${esc(i.guide_text||'등록된 가이드 없음')}</div><div class="detail"><div class="box"><b>협력사 설명</b><p>${esc(i.description||'등록된 설명 없음')}</p></div><div class="box"><b>관리자 평가</b><p>${i.earned_score??0} / ${i.max_score_snapshot??i.max_score??0}점</p><p>${esc(i.evaluation_comment||'보완사항 없음')}</p></div></div></div></div>`).join(''):'<div class="loading">등록된 평가항목이 없습니다.</div>';
 }catch(e){evaluationItems.innerHTML='<div class="error">'+esc(e.message)+'</div>'}
}
boot();
</script>
</body>
</html>
