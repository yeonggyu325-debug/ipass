<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>I-PASS 로그인</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#eef3f8;color:#1f2937}
.hidden{display:none!important}
.login-page{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:min(420px,100%);background:#fff;border:1px solid #dfe3e8;border-radius:16px;padding:30px;box-shadow:0 12px 36px rgba(15,23,42,.08)}
.logo{width:48px;height:48px;border-radius:12px;background:#1f5aa6;color:#fff;display:grid;place-items:center;font-size:22px;font-weight:900;margin-bottom:18px}
h1{margin:0 0 7px;font-size:24px}.muted{color:#6b7280;font-size:14px}.field{margin-top:16px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field input{width:100%;height:44px;border:1px solid #d0d5dd;border-radius:8px;padding:0 12px;font:inherit}
.btn{width:100%;height:44px;border:0;border-radius:8px;background:#1f5aa6;color:#fff;font-weight:800;margin-top:20px;cursor:pointer;font:inherit}
.link{border:0;background:none;color:#1f5aa6;margin-top:14px;cursor:pointer;padding:0;font:inherit}
.msg{font-size:13px;margin-top:14px;min-height:18px}.msg.error{color:#b42318}.msg.ok{color:#15803d}
.version{margin-top:18px;font-size:11px;color:#98a2b3;text-align:center}
.app{padding:30px}.box{max-width:800px;margin:auto;background:#fff;border:1px solid #dfe3e8;border-radius:12px;padding:24px}
.logout{border:1px solid #d0d5dd;background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}
</style>
</head>
<body>
<section id="loginPage" class="login-page">
  <div class="login-card">
    <div class="logo">I</div>
    <h1>I-PASS 로그인</h1>
    <div class="muted">협력사 이행수준평가 시스템</div>
    <form id="loginForm">
      <div class="field"><label for="email">이메일</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="btn" type="submit">로그인</button>
    </form>
    <button class="link" id="resetBtn">비밀번호를 잊으셨나요?</button>
    <div id="message" class="msg"></div>
    <div class="version">Firebase Auth 연결 확인용 · v4</div>
  </div>
</section>

<section id="app" class="app hidden">
  <div class="box">
    <h1>로그인 성공</h1>
    <p id="who"></p>
    <p id="serverResult" class="muted">I-PASS 서버 사용자 확인 중...</p>
    <button class="logout" id="logoutBtn">로그아웃</button>
  </div>
</section>

<script>
const FIREBASE_API_KEY = "AIzaSyC0s7buQaayKr84QA_wFNyF6rcs6w1-IoU";
let idToken = null;

function authMessage(code){
  const map={
    EMAIL_NOT_FOUND:"등록되지 않은 이메일입니다.",
    INVALID_PASSWORD:"비밀번호가 올바르지 않습니다.",
    INVALID_LOGIN_CREDENTIALS:"이메일 또는 비밀번호가 올바르지 않습니다.",
    USER_DISABLED:"사용 중지된 계정입니다.",
    TOO_MANY_ATTEMPTS_TRY_LATER:"로그인 시도가 너무 많습니다. 잠시 후 다시 시도하세요.",
    OPERATION_NOT_ALLOWED:"Firebase의 이메일/비밀번호 로그인이 아직 활성화되지 않았습니다.",
    INVALID_EMAIL:"이메일 형식이 올바르지 않습니다."
  };
  return map[code] || code;
}

async function firebase(endpoint, body){
  const r=await fetch("https://identitytoolkit.googleapis.com/v1/"+endpoint+"?key="+encodeURIComponent(FIREBASE_API_KEY),{
    method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)
  });
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(authMessage(data?.error?.message || "AUTH_ERROR"));
  return data;
}

async function checkServer(){
  const out=document.getElementById("serverResult");
  try{
    const r=await fetch("/api/me",{headers:{Authorization:"Bearer "+idToken,Accept:"application/json"}});
    const text=await r.text();
    if(!r.ok){out.textContent="Firebase 로그인은 성공했지만 I-PASS 서버 연결 실패: HTTP "+r.status+" "+text;return;}
    const data=JSON.parse(text);
    out.textContent="I-PASS 서버 연결 성공 · 역할: "+(data.user?.role || "-");
  }catch(e){out.textContent="Firebase 로그인은 성공했지만 I-PASS 서버 확인 중 오류: "+e.message;}
}

document.getElementById("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const msg=document.getElementById("message");
  msg.className="msg";msg.textContent="로그인 확인 중...";
  try{
    const email=document.getElementById("email").value.trim();
    const password=document.getElementById("password").value;
    const data=await firebase("accounts:signInWithPassword",{email,password,returnSecureToken:true});
    idToken=data.idToken;
    msg.textContent="";
    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("who").textContent=data.email+" 계정으로 Firebase 로그인 성공";
    await checkServer();
  }catch(err){msg.className="msg error";msg.textContent=err.message;}
});

document.getElementById("resetBtn").addEventListener("click",async()=>{
  const msg=document.getElementById("message");
  const email=document.getElementById("email").value.trim();
  if(!email){msg.className="msg error";msg.textContent="먼저 이메일을 입력하세요.";return;}
  try{
    await firebase("accounts:sendOobCode",{requestType:"PASSWORD_RESET",email});
    msg.className="msg ok";msg.textContent="비밀번호 재설정 메일을 보냈습니다.";
  }catch(err){msg.className="msg error";msg.textContent=err.message;}
});

document.getElementById("logoutBtn").onclick=()=>{
  idToken=null;
  document.getElementById("app").classList.add("hidden");
  document.getElementById("loginPage").classList.remove("hidden");
  document.getElementById("password").value="";
};
</script>
</body>
</html>
