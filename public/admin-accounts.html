<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>협력사 관리센터 | Hniruja EHS</title>
<style>
:root{--ink:#24343f;--text:#566771;--muted:#8b98a0;--line:#e3e8ec;--page:#f5f7f9;--blue:#236f9f;--blue-soft:#eef6fa;--red:#b94d47;--red-soft:#fff1f0;--green:#24745a;--green-soft:#edf7f2;--amber:#a66a14;--amber-soft:#fff6e8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Segoe UI",sans-serif;letter-spacing:-.025em}button,input{font:inherit}button{cursor:pointer}
.admin-shell{width:min(1320px,calc(100% - 48px));max-width:1320px;margin:0 auto;padding:24px 0 56px}.admin-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:24px}.admin-head h1{margin:0;font-size:28px;line-height:1.25;font-weight:820;letter-spacing:-.04em}.admin-head p{margin:8px 0 0;color:var(--muted);font-size:12px;line-height:1.55}.admin-tabs{display:flex;align-items:center;gap:8px}.admin-tab{height:40px;padding:0 15px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#60717b;font-size:11.5px;font-weight:760;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;line-height:1;white-space:nowrap}.admin-tab.active{background:var(--blue-soft);border-color:#dceaf2;color:var(--blue)}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:24px}.metric{min-height:88px;padding:18px 20px;border-radius:12px;background:#fff;box-shadow:0 4px 16px rgba(30,48,62,.04);display:flex;flex-direction:column;justify-content:center}.metric span{font-size:11px;line-height:1.3;color:#85929a}.metric b{display:block;margin-top:7px;font-size:24px;line-height:1;font-weight:820}
.partner-add{display:none;margin-bottom:24px;padding:18px 20px;border-radius:13px;background:#fff;box-shadow:0 4px 16px rgba(30,48,62,.035)}.partner-add.show{display:block}.add-form{display:grid;grid-template-columns:1.2fr 1fr .7fr auto;gap:10px;align-items:center}.control,.search{height:40px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);padding:0 12px;font-size:11.5px;outline:none}.control:focus,.search:focus{border-color:#9bbdd2;box-shadow:0 0 0 3px rgba(35,111,159,.07)}
.panel{overflow:hidden;border-radius:13px;background:#fff;box-shadow:0 5px 18px rgba(30,48,62,.045)}.panel-head{min-height:64px;padding:12px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}.panel-title{display:flex;align-items:center;gap:10px}.panel-title strong{font-size:12.5px;font-weight:800}.panel-title small{font-size:10.5px;color:var(--muted);font-weight:600}.panel-tools{display:flex;align-items:center;gap:8px}.search{width:280px}.filter-group{display:flex;align-items:center;gap:6px}.filter-btn,.btn{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#5e6d76;font-size:10.5px;font-weight:740;display:inline-flex;align-items:center;justify-content:center;line-height:1;white-space:nowrap}.filter-btn.active{background:var(--blue-soft);border-color:#dceaf2;color:var(--blue)}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:var(--red);border-color:#ead7d5}.btn.muted{color:#6f7c84}.refresh{height:40px;border-radius:9px}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{height:64px;padding:12px 14px;border-bottom:1px solid #edf0f2;text-align:center;vertical-align:middle;font-size:11.5px;line-height:1.35}th{height:44px;background:#f7f9fa;color:#657782;font-size:10.5px;font-weight:780;white-space:nowrap}tbody tr:hover{background:#fbfcfd}.left{text-align:left}.company-name{font-weight:780;color:#354751}.subtext{display:block;margin-top:4px;color:#909ba2;font-size:10px}.email{word-break:break-all}.status{display:inline-flex;min-height:26px;padding:0 9px;border-radius:999px;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;line-height:1.2}.status.approved{background:var(--green-soft);color:var(--green)}.status.pending{background:var(--amber-soft);color:var(--amber)}.status.rejected,.status.suspended{background:var(--red-soft);color:var(--red)}.actions{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}.actions .btn{height:32px}.loading,.empty,.error{padding:48px 20px;text-align:center;color:#8d989f;font-size:11.5px}.error{color:var(--red)}
.account-table{min-width:1120px}.account-table col.c-company{width:16%}.account-table col.c-name{width:9%}.account-table col.c-position{width:15%}.account-table col.c-phone{width:13%}.account-table col.c-email{width:19%}.account-table col.c-date{width:9%}.account-table col.c-status{width:9%}.account-table col.c-action{width:10%}
.partner-table{min-width:1120px}.partner-table col.c-partner{width:29%}.partner-table col.c-industry{width:16%}.partner-table col.c-account{width:9%}.partner-table col.c-target{width:14%}.partner-table col.c-signup{width:14%}.partner-table col.c-logo{width:18%}.company-cell{display:flex;align-items:center;justify-content:flex-start;gap:12px;min-width:0;text-align:left}.logo-thumb{width:40px;height:40px;border-radius:9px;border:1px solid var(--line);background:#f7f9fa;display:grid;place-items:center;overflow:hidden;color:#9aa5ac;font-size:9px;font-weight:760;flex:0 0 auto}.logo-thumb img{width:100%;height:100%;object-fit:contain;background:#fff}.company-copy{min-width:0}.company-copy b{display:block;font-size:11.8px;line-height:1.3;font-weight:780;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.company-copy small{display:block;margin-top:4px;color:#909ba2;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.toggle-wrap{display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}.toggle{position:relative;width:44px;height:24px;border:0;border-radius:999px;background:#cbd3d8;flex:0 0 auto}.toggle:after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.18s}.toggle.on{background:#3d8b69}.toggle.on:after{transform:translateX(20px)}.toggle-wrap span{min-width:34px;text-align:left;font-size:10.5px;font-weight:720}.logo-actions{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}.logo-file{display:none}.paste-active{outline:2px solid rgba(35,111,159,.22);outline-offset:2px}
@media(max-width:1120px){.admin-shell{width:calc(100% - 32px);padding-top:20px;padding-bottom:48px}.admin-head{gap:20px;margin-bottom:20px}.summary{margin-bottom:20px}.partner-add{margin-bottom:20px}}
@media(max-width:900px){.admin-head{flex-direction:column;align-items:flex-start}.admin-tabs{width:100%;flex-wrap:wrap}.admin-tab{flex:1}.summary{grid-template-columns:1fr 1fr}.add-form{grid-template-columns:1fr 1fr}.panel-head{flex-direction:column;align-items:stretch}.panel-tools{width:100%;flex-wrap:wrap}.search{width:auto;flex:1;min-width:220px}}
@media(max-width:760px){.admin-shell{width:calc(100% - 32px);padding-top:18px;padding-bottom:40px}.admin-head{margin-bottom:18px}.summary,.partner-add{margin-bottom:18px}.summary{grid-template-columns:1fr 1fr}.add-form{grid-template-columns:1fr}.filter-group{width:100%;overflow:auto}.panel-tools{gap:6px}}
@media(max-width:560px){.summary{grid-template-columns:1fr}.admin-tab{flex:1 1 100%}.search{width:100%;min-width:0}.refresh{flex:1}}
</style>
<script src="/shared/auth.js?v=4"></script><script src="/shared/api.js?v=6"></script>
</head>
<body>
<main class="admin-shell">
  <section class="admin-head">
    <div><h1>협력사 관리센터</h1><p id="pageCopy">회원가입 승인, 계정 상태, 협력사 마스터를 동일한 기준과 화면에서 관리합니다.</p></div>
    <nav class="admin-tabs" aria-label="협력사 관리 업무">
      <a class="admin-tab" id="approvalTab" href="/admin/approvals">협력사 승인</a>
      <a class="admin-tab" id="accountTab" href="/admin/accounts">협력사 계정관리</a>
      <a class="admin-tab" id="partnerTab" href="/admin/partners">협력사 관리</a>
    </nav>
  </section>
  <section class="summary" id="summary"></section>
  <section class="partner-add" id="partnerAdd"><form id="addForm" class="add-form"><input id="companyName" class="control" required placeholder="협력사명"><input id="industryName" class="control" placeholder="업종"><input id="industryCode" class="control" placeholder="업종코드"><button class="btn primary" style="height:40px;border-radius:9px">협력사 추가</button></form></section>
  <section class="panel">
    <div class="panel-head"><div class="panel-title"><strong id="panelTitle">목록</strong><small id="panelHint"></small></div><div class="panel-tools"><div class="filter-group" id="filterGroup"></div><input id="searchInput" class="search" type="search" placeholder="검색"><button id="refreshBtn" class="btn refresh">새로고침</button></div></div>
    <div id="tableBox" class="loading">정보를 불러오는 중...</div>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const path=location.pathname;const mode=path==='/admin/partners'?'partners':path==='/admin/accounts'?'accounts':'approvals';let rows=[],filter='all',pasteCompanyId=null;
function metric(label,value){return `<div class="metric"><span>${esc(label)}</span><b>${esc(value)}</b></div>`}
function setup(){const config={approvals:{copy:'가입 신청 정보를 검토하고 승인 또는 반려합니다.',title:'승인 대기 계정',hint:'승인 전 회사·담당자 정보를 확인해 주세요.'},accounts:{copy:'협력사 계정을 활성·비활성 처리하거나 삭제합니다.',title:'협력사 계정',hint:'비활성 계정은 로그인할 수 없습니다.'},partners:{copy:'협력사 마스터, 협의체 대상, 회원가입 허용 및 회사 로고를 관리합니다.',title:'협력사 마스터',hint:'PNG · JPG · WEBP / 최대 2MB / 파일 선택 또는 클립보드 붙여넣기'}}[mode];$('pageCopy').textContent=config.copy;$('panelTitle').textContent=config.title;$('panelHint').textContent=config.hint;for(const [id,key] of [['approvalTab','approvals'],['accountTab','accounts'],['partnerTab','partners']]){const el=$(id),on=mode===key;el.classList.toggle('active',on);if(on)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')}$('partnerAdd').classList.toggle('show',mode==='partners');$('searchInput').placeholder=mode==='partners'?'회사명·업종 검색':'회사명·이름·이메일 검색';renderFilters()}
function renderFilters(){const options=mode==='partners'?[['all','전체'],['target','협의체 대상'],['signup','가입 허용']]:mode==='accounts'?[['all','전체'],['approved','활성'],['suspended','사용 불가'],['pending','승인 대기'],['rejected','반려']]:[['all','승인 대기']];$('filterGroup').innerHTML=options.map(([key,label])=>`<button class="filter-btn ${filter===key?'active':''}" type="button" data-filter="${key}">${label}</button>`).join('');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderFilters();render()})}
function renderSummary(){if(mode==='partners'){$('summary').innerHTML=[metric('등록 협력사',rows.length),metric('협의체 대상',rows.filter(r=>r.is_target).length),metric('가입 허용',rows.filter(r=>r.signup_enabled).length),metric('등록 계정',rows.reduce((s,r)=>s+Number(r.account_count||0),0))].join('');return}const counts={pending:0,approved:0,rejected:0,suspended:0};rows.forEach(r=>{if(counts[r.approval_status]!==undefined)counts[r.approval_status]++});$('summary').innerHTML=[metric('승인 대기',counts.pending),metric('활성 계정',counts.approved),metric('반려',counts.rejected),metric('사용 불가',counts.suspended)].join('')}
function statusHtml(s){const label={pending:'승인 대기',approved:'활성',rejected:'승인 반려',suspended:'사용할 수 없는 아이디'}[s]||s||'-';return `<span class="status ${esc(s||'pending')}">${esc(label)}</span>`}
function actionButtons(r){const id=esc(r.id),name=esc(r.name||r.email||'선택한 계정');let html='';if(r.approval_status==='pending'||r.approval_status==='rejected'||r.approval_status==='suspended')html+=`<button class="btn primary" data-action="approve" data-id="${id}" data-name="${name}">${r.approval_status==='suspended'?'활성화':'승인'}</button>`;if(r.approval_status==='pending')html+=`<button class="btn danger" data-action="reject" data-id="${id}" data-name="${name}">반려</button>`;if(r.approval_status==='approved')html+=`<button class="btn muted" data-action="suspend" data-id="${id}" data-name="${name}">비활성</button>`;if(mode==='accounts')html+=`<button class="btn danger" data-action="delete" data-id="${id}" data-name="${name}">삭제</button>`;return html}
function accountList(){const q=$('searchInput').value.trim().toLowerCase();let list=mode==='approvals'?rows.filter(r=>r.approval_status==='pending'):rows.slice();if(mode==='accounts'&&filter!=='all')list=list.filter(r=>r.approval_status===filter);if(q)list=list.filter(r=>[r.company_name,r.name,r.position,r.email,r.phone].some(v=>String(v||'').toLowerCase().includes(q)));return list}
function renderAccounts(){const list=accountList();$('tableBox').className='';$('tableBox').innerHTML=list.length?`<div class="table-wrap"><table class="account-table"><colgroup><col class="c-company"><col class="c-name"><col class="c-position"><col class="c-phone"><col class="c-email"><col class="c-date"><col class="c-status"><col class="c-action"></colgroup><thead><tr><th>회사명</th><th>이름</th><th>직책</th><th>연락처</th><th>이메일</th><th>가입일</th><th>상태</th><th>처리</th></tr></thead><tbody>${list.map(r=>`<tr><td class="left"><span class="company-name">${esc(r.company_name||'-')}</span></td><td><b>${esc(r.name||'-')}</b></td><td>${esc(r.position||'-')}</td><td>${esc(r.phone||'-')}</td><td class="email">${esc(r.email||'-')}</td><td>${esc(String(r.created_at||'-').slice(0,10))}</td><td>${statusHtml(r.approval_status)}</td><td><div class="actions">${actionButtons(r)}</div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">표시할 계정이 없습니다.</div>';document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>accountAction(b.dataset.id,b.dataset.action,b.dataset.name))}
function toggleHtml(r,key,on,off){return `<div class="toggle-wrap"><button class="toggle ${r[key]?'on':''}" role="switch" aria-label="${key==='is_target'?'협의체 대상':'회원가입 허용'}" aria-checked="${r[key]?'true':'false'}" data-setting="${key}" data-id="${esc(r.id)}"></button><span>${r[key]?on:off}</span></div>`}
function logoHtml(r){return `<div class="logo-actions" data-logo-actions="${esc(r.id)}"><label class="btn">${r.has_logo?'변경':'등록'}<input class="logo-file" type="file" accept="image/png,image/jpeg,image/webp" data-logo="${esc(r.id)}"></label><button class="btn" type="button" data-logo-paste="${esc(r.id)}">붙여넣기</button>${r.has_logo?`<button class="btn danger" type="button" data-logo-delete="${esc(r.id)}">삭제</button>`:''}</div>`}
function partnerList(){const q=$('searchInput').value.trim().toLowerCase();return rows.filter(r=>{if(filter==='target'&&!r.is_target)return false;if(filter==='signup'&&!r.signup_enabled)return false;return !q||[r.company_name,r.industry_name,r.industry_code].some(v=>String(v||'').toLowerCase().includes(q))})}
function renderPartners(){const list=partnerList();$('tableBox').className='';$('tableBox').innerHTML=list.length?`<div class="table-wrap"><table class="partner-table"><colgroup><col class="c-partner"><col class="c-industry"><col class="c-account"><col class="c-target"><col class="c-signup"><col class="c-logo"></colgroup><thead><tr><th>협력사</th><th>업종</th><th>계정</th><th>협의체</th><th>회원가입</th><th>회사 로고</th></tr></thead><tbody>${list.map(r=>`<tr><td><div class="company-cell"><div class="logo-thumb">${r.logo_url?`<img src="${esc(r.logo_url)}" alt="${esc(r.company_name||'협력사')} 로고">`:'LOGO'}</div><div class="company-copy"><b>${esc(r.company_name||'-')}</b><small>${esc(r.industry_code||'업종코드 없음')}</small></div></div></td><td>${esc(r.industry_name||'-')}</td><td>${Number(r.account_count||0)}개</td><td>${toggleHtml(r,'is_target','대상','비대상')}</td><td>${toggleHtml(r,'signup_enabled','허용','차단')}</td><td>${logoHtml(r)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">조건에 맞는 협력사가 없습니다.</div>';document.querySelectorAll('[data-setting]').forEach(b=>b.onclick=()=>toggleSetting(b.dataset.id,b.dataset.setting));document.querySelectorAll('[data-logo]').forEach(i=>i.onchange=()=>uploadLogo(i.dataset.logo,i.files?.[0]));document.querySelectorAll('[data-logo-paste]').forEach(b=>b.onclick=()=>pasteLogo(b.dataset.logoPaste));document.querySelectorAll('[data-logo-delete]').forEach(b=>b.onclick=()=>deleteLogo(b.dataset.logoDelete));markPasteTarget()}
function render(){renderSummary();mode==='partners'?renderPartners():renderAccounts()}
async function load(){$('tableBox').className='loading';$('tableBox').textContent='정보를 불러오는 중...';try{const api=mode==='partners'?'/api/admin/partners':'/api/admin/registrations';const d=await window.EHSApi.request(api,{ehsNoCache:true});rows=mode==='partners'?(d.partners||[]):(d.registrations||[]);$('tableBox').className='';render()}catch(e){$('tableBox').className='error';$('tableBox').textContent=window.EHSApi.describe(e)}}
async function accountAction(id,action,name){if(action==='delete'){if(!confirm(`${name} 계정을 삭제하시겠습니까? 포털에서 더 이상 사용할 수 없습니다.`))return;try{await window.EHSApi.request(`/api/admin/registrations/${encodeURIComponent(id)}`,{method:'DELETE'});await load()}catch(e){alert(window.EHSApi.describe(e))}return}const label={approve:'승인/활성화',reject:'반려',suspend:'비활성'}[action];if(!confirm(`${name} 계정을 ${label} 처리하시겠습니까?`))return;let reason='';if(action==='reject'){reason=prompt('반려 사유를 입력하세요.','')||'';if(!reason.trim())return}try{await window.EHSApi.request(`/api/admin/registrations/${encodeURIComponent(id)}`,{method:'PATCH',body:JSON.stringify({action,reason:reason.trim()})});await load()}catch(e){alert(window.EHSApi.describe(e))}}
async function toggleSetting(id,key){const r=rows.find(x=>x.id===id);if(!r)return;try{await window.EHSApi.request(`/api/admin/partners/${encodeURIComponent(id)}`,{method:'PATCH',body:JSON.stringify({[key]:!r[key]})});r[key]=!r[key];render()}catch(e){alert(window.EHSApi.describe(e))}}
function markPasteTarget(){document.querySelectorAll('[data-logo-actions]').forEach(el=>el.classList.toggle('paste-active',el.dataset.logoActions===pasteCompanyId))}
async function uploadLogo(id,file){if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(String(file.type||'').toLowerCase())){alert('PNG, JPG, WEBP 이미지만 가능합니다.');return}if(file.size>2*1024*1024){alert('로고는 2MB 이하만 가능합니다.');return}const form=new FormData();form.append('logo',file,file.name||'clipboard-logo.png');try{await window.EHSApi.request(`/api/admin/partners/${encodeURIComponent(id)}/logo`,{method:'PUT',body:form,timeoutMs:60000});pasteCompanyId=null;await load()}catch(e){alert(window.EHSApi.describe(e))}}
async function pasteLogo(id){pasteCompanyId=id;markPasteTarget();if(navigator.clipboard?.read){try{const items=await navigator.clipboard.read();for(const item of items){const type=item.types.find(t=>['image/png','image/jpeg','image/webp'].includes(t));if(type){const blob=await item.getType(type);await uploadLogo(id,new File([blob],`clipboard-logo.${type==='image/png'?'png':type==='image/webp'?'webp':'jpg'}`,{type}));return}}alert('클립보드에 이미지가 없습니다.')}catch(_){alert('브라우저가 직접 읽기를 차단했습니다. 붙여넣기 버튼을 누른 뒤 Ctrl+V를 눌러 주세요.')}}else alert('붙여넣기 버튼을 누른 뒤 Ctrl+V를 눌러 주세요.')}
document.addEventListener('paste',e=>{if(mode!=='partners'||!pasteCompanyId)return;const item=[...(e.clipboardData?.items||[])].find(x=>String(x.type||'').startsWith('image/'));const file=item?.getAsFile?.();if(file){e.preventDefault();uploadLogo(pasteCompanyId,file)}});
async function deleteLogo(id){if(!confirm('등록된 회사 로고를 삭제하시겠습니까?'))return;try{await window.EHSApi.request(`/api/admin/partners/${encodeURIComponent(id)}/logo`,{method:'DELETE'});pasteCompanyId=null;await load()}catch(e){alert(window.EHSApi.describe(e))}}
$('addForm').onsubmit=async e=>{e.preventDefault();if(mode!=='partners')return;try{await window.EHSApi.request('/api/admin/partners',{method:'POST',body:JSON.stringify({company_name:$('companyName').value.trim(),industry_name:$('industryName').value.trim(),industry_code:$('industryCode').value.trim()})});e.currentTarget.reset();await load()}catch(err){alert(window.EHSApi.describe(err))}};
(async()=>{setup();try{const user=await window.EHSAuth.requireUser();if(user.role!=='admin'){location.replace('/home');return}window.__EHS_PAGE_USER=user;document.dispatchEvent(new CustomEvent('ehs:user-ready',{detail:user}));$('searchInput').addEventListener('input',render);$('refreshBtn').onclick=load;await load()}catch(e){}})();
</script>
</body>
