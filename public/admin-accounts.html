<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>관리자 계정 관리 | Hniruja EHS</title><style>
:root{--ink:#24343f;--text:#566771;--muted:#8b98a0;--line:#e3e8ec;--page:#f5f7f9;--blue:#236f9f;--blue-soft:#eef6fa;--red:#b94d47;--red-soft:#fff1f0;--green:#24745a;--green-soft:#edf7f2}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Segoe UI",sans-serif;letter-spacing:-.025em}button,input{font:inherit}.admin-shell{margin:0 auto}.admin-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:24px}.admin-head h1{margin:0;font-size:28px}.admin-head p{margin:8px 0 0;color:var(--muted);font-size:12px}.admin-tabs{display:flex;gap:8px}.admin-tab{height:40px;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#60717b;font-size:11px;font-weight:760;text-decoration:none;display:inline-flex;align-items:center}.admin-tab.active{background:var(--blue-soft);color:var(--blue)}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:24px}.metric{min-height:88px;padding:18px 20px;border-radius:12px;background:#fff;box-shadow:0 4px 16px rgba(30,48,62,.04)}.metric span{font-size:11px;color:#85929a}.metric b{display:block;margin-top:7px;font-size:24px}.panel{background:#fff;border-radius:13px;box-shadow:0 5px 18px rgba(30,48,62,.045);overflow:hidden}.panel-head{min-height:64px;padding:12px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}.panel-tools{display:flex;gap:8px}.search{width:260px;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:9px}.refresh{height:40px;padding:0 13px;border:1px solid var(--line);border-radius:9px;background:#fff}.table-wrap{overflow:auto}table{width:100%;min-width:1080px;border-collapse:collapse}th,td{padding:14px 16px;border-bottom:1px solid #edf0f2;text-align:left;font-size:11.5px}th{background:#f7f9fa;font-size:10.5px;color:#657782;white-space:nowrap}.status{display:inline-flex;min-height:24px;align-items:center;padding:0 8px;border-radius:999px;font-size:9.5px;font-weight:800}.status.approved{background:var(--green-soft);color:var(--green)}.status.pending{background:#fff6e8;color:#a66a14}.status.rejected,.status.suspended{background:var(--red-soft);color:var(--red)}.actions{display:flex;gap:6px;justify-content:flex-end;white-space:nowrap}.btn{height:32px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:10px;font-weight:760}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:var(--red);border-color:#ead7d5}.empty,.loading,.error{padding:46px 20px;text-align:center;color:#8d989f;font-size:11px}.error{color:var(--red)}@media(max-width:900px){.admin-head{flex-direction:column;align-items:flex-start}.summary{grid-template-columns:1fr 1fr}.panel-head{flex-direction:column;align-items:stretch}.panel-tools{width:100%}.search{width:100%;flex:1}}
</style><script src="/shared/auth.js?v=4"></script><script src="/shared/api.js?v=6"></script></head><body><main class="admin-shell"><section class="admin-head"><div><h1 id="pageTitle">회원가입 승인</h1><p id="pageCopy">가입 신청을 검토하고 승인 또는 반려합니다.</p></div><nav class="admin-tabs"><a class="admin-tab" id="approvalTab" href="/admin/approvals">회원가입 승인</a><a class="admin-tab" id="accountTab" href="/admin/accounts">협력사 계정</a><a class="admin-tab" href="/admin-partners.html">협력사 관리</a></nav></section><section class="summary" id="summary"><div class="metric"><span>승인 대기</span><b>-</b></div><div class="metric"><span>활성</span><b>-</b></div><div class="metric"><span>반려</span><b>-</b></div><div class="metric"><span>비활성</span><b>-</b></div></section><section class="panel"><div class="panel-head"><strong id="panelTitle">승인 대기 회원</strong><div class="panel-tools"><input class="search" id="searchInput" type="search" placeholder="회사명·이름·이메일 검색"><button class="refresh" id="refreshBtn">새로고침</button></div></div><div id="tableBox" class="loading">계정 정보를 불러오는 중...</div></section></main><script>
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const mode=location.pathname.endsWith('/accounts')?'accounts':'approvals';let rows=[];function labelStatus(s){const labels={pending:'승인 대기',approved:'활성',rejected:'반려',suspended:'비활성'};return `<span class="status ${esc(s||'pending')}">${esc(labels[s]||s||'-')}</span>`}function setup(){const approval=mode==='approvals';$('pageTitle').textContent=approval?'회원가입 승인':'협력사 계정';$('pageCopy').textContent=approval?'가입 신청을 검토하고 승인 또는 반려합니다.':'계정을 활성·비활성 처리하거나 삭제할 수 있습니다.';$('panelTitle').textContent=approval?'승인 대기 회원':'전체 협력사 계정';$('approvalTab').classList.toggle('active',approval);$('accountTab').classList.toggle('active',!approval)}function renderSummary(){const states=['pending','approved','rejected','suspended'];document.querySelectorAll('#summary b').forEach((el,i)=>el.textContent=rows.filter(r=>r.approval_status===states[i]).length)}function actionButtons(r){const id=esc(r.id),name=esc(r.name||r.email||'선택한 계정');let h='';if(r.approval_status==='pending'||r.approval_status==='rejected'||r.approval_status==='suspended')h+=`<button class="btn primary" data-action="approve" data-id="${id}" data-name="${name}">${r.approval_status==='suspended'?'활성':'승인'}</button>`;if(r.approval_status==='pending')h+=`<button class="btn danger" data-action="reject" data-id="${id}" data-name="${name}">반려</button>`;if(r.approval_status==='approved')h+=`<button class="btn danger" data-action="suspend" data-id="${id}" data-name="${name}">비활성</button>`;h+=`<button class="btn danger" data-action="delete" data-id="${id}" data-name="${name}">삭제</button>`;return h}function render(){renderSummary();const q=$('searchInput').value.trim().toLowerCase();let list=mode==='approvals'?rows.filter(r=>r.approval_status==='pending'):rows.slice();if(q)list=list.filter(r=>[r.company_name,r.name,r.position,r.job_title,r.email,r.phone].some(v=>String(v||'').toLowerCase().includes(q)));$('tableBox').innerHTML=list.length?`<div class="table-wrap"><table><thead><tr><th>회사명</th><th>이름</th><th>직급</th><th>직책</th><th>연락처</th><th>이메일</th><th>가입일</th>${mode==='accounts'?'<th>상태</th>':''}<th style="text-align:right">처리</th></tr></thead><tbody>${list.map(r=>`<tr><td>${esc(r.company_name||'-')}</td><td><b>${esc(r.name||'-')}</b></td><td>${esc(r.position||'-')}</td><td>${esc(r.job_title||'-')}</td><td>${esc(r.phone||'-')}</td><td>${esc(r.email||'-')}</td><td>${esc(String(r.created_at||'-').slice(0,10))}</td>${mode==='accounts'?`<td>${labelStatus(r.approval_status)}</td>`:''}<td><div class="actions">${actionButtons(r)}</div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">표시할 계정이 없습니다.</div>';document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>accountAction(b.dataset.id,b.dataset.action,b.dataset.name))}async function load(){$('tableBox').className='loading';$('tableBox').textContent='계정 정보를 불러오는 중...';try{const d=await window.EHSApi.request('/api/admin/registrations',{ehsNoCache:true});rows=d.registrations||[];$('tableBox').className='';render()}catch(e){$('tableBox').className='error';$('tableBox').textContent=window.EHSApi.describe(e)}}async function accountAction(id,action,name){if(action==='delete'){if(!confirm(`${name} 계정을 삭제하시겠습니까? 삭제 후 되돌릴 수 없습니다.`))return;try{await window.EHSApi.request(`/api/admin/registrations/${encodeURIComponent(id)}`,{method:'DELETE'});await load()}catch(e){alert(window.EHSApi.describe(e))}return}const title={approve:'활성/승인',reject:'반려',suspend:'비활성'}[action];if(!confirm(`${name} 계정을 ${title} 처리하시겠습니까?`))return;let reason='';if(action==='reject'){reason=prompt('반려 사유를 입력하세요.','')||'';if(!reason.trim())return}try{await window.EHSApi.request(`/api/admin/registrations/${encodeURIComponent(id)}`,{method:'PATCH',body:JSON.stringify({action,reason:reason.trim()})});await load()}catch(e){alert(window.EHSApi.describe(e))}}(async()=>{setup();try{const user=await window.EHSAuth.requireUser();if(user.role!=='admin'){location.replace('/home');return}window.__EHS_PAGE_USER=user;document.dispatchEvent(new CustomEvent('ehs:user-ready',{detail:user}));$('searchInput').addEventListener('input',render);$('refreshBtn').onclick=load;await load()}catch(e){}})();
</script></body></html>
