<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>관리자 계정 관리 | Hniruja EHS</title>
<style>
:root{--ink:#24343f;--text:#566771;--muted:#8b98a0;--line:#e3e8ec;--page:#f5f7f9;--blue:#236f9f;--blue-soft:#eef6fa;--red:#b94d47;--red-soft:#fff1f0;--green:#24745a;--green-soft:#edf7f2}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Segoe UI",sans-serif;letter-spacing:-.025em}button,input{font:inherit}.hidden{display:none!important}
.admin-shell{width:min(1320px,calc(100% - 40px));margin:0 auto;padding:30px 0 64px}.admin-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px}.admin-head h1{margin:0;font-size:26px;letter-spacing:-.045em}.admin-head p{margin:7px 0 0;color:var(--muted);font-size:11px}.admin-tabs{display:flex;gap:6px}.admin-tab{height:36px;padding:0 13px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#60717b;font-size:11px;font-weight:760;text-decoration:none;display:inline-flex;align-items:center}.admin-tab.active{border-color:#d4e5ef;background:var(--blue-soft);color:var(--blue)}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}.metric{padding:15px 16px;border:0;border-radius:11px;background:#fff;box-shadow:0 4px 16px rgba(30,48,62,.04)}.metric span{display:block;color:#85929a;font-size:10px;font-weight:720}.metric b{display:block;margin-top:6px;font-size:22px}.panel{background:#fff;border:0;border-radius:13px;box-shadow:0 5px 18px rgba(30,48,62,.045);overflow:hidden}.panel-head{min-height:58px;padding:0 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-head strong{font-size:14px}.panel-tools{display:flex;align-items:center;gap:8px}.search{width:220px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;outline:none;color:#40525d;font-size:11px}.search:focus{border-color:#9bbdd2;box-shadow:0 0 0 3px rgba(35,111,159,.07)}.refresh{height:34px;padding:0 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#62727c;font-size:10.5px;font-weight:720}.refresh:hover{background:#f7f9fa}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:880px}th,td{padding:13px 14px;border-bottom:1px solid #edf0f2;text-align:left}th{background:#f7f9fa;color:#657782;font-size:10.5px;font-weight:800}td{color:#4e606b;font-size:11px}tbody tr:last-child td{border-bottom:0}.status{display:inline-flex;align-items:center;min-height:23px;padding:0 7px;border-radius:6px;font-size:9px;font-weight:820}.status.pending{background:#fff6e8;color:#a66a14}.status.approved{background:var(--green-soft);color:var(--green)}.status.rejected,.status.suspended{background:var(--red-soft);color:var(--red)}.actions{display:flex;gap:6px;white-space:nowrap}.btn{height:31px;padding:0 9px;border:1px solid var(--line);border-radius:7px;background:#fff;color:#5c6c76;font-size:9.5px;font-weight:760}.btn.primary{border-color:var(--blue);background:var(--blue);color:#fff}.btn.danger{border-color:#ead7d5;background:#fff;color:var(--red)}.empty,.loading,.error{padding:42px 18px;text-align:center;color:#8d989f;font-size:11px}.error{color:var(--red)}
@media(max-width:800px){.admin-shell{width:calc(100% - 24px);padding-top:22px}.admin-head{align-items:flex-start;flex-direction:column}.admin-tabs{width:100%}.admin-tab{flex:1;justify-content:center}.summary{grid-template-columns:1fr 1fr}.panel-head{align-items:stretch;flex-direction:column;padding:14px}.panel-tools{width:100%}.search{width:100%}}
</style>
<script src="/shared/auth.js?v=4"></script>
<script src="/shared/api.js?v=5"></script>
</head>
<body>
<main class="admin-shell">
  <section class="admin-head">
    <div><h1 id="pageTitle">회원가입 승인</h1><p id="pageCopy">가입 신청을 검토하고 승인 또는 반려합니다.</p></div>
    <nav class="admin-tabs" aria-label="관리자 계정 메뉴"><a class="admin-tab" id="approvalTab" href="/admin/approvals">회원가입 승인</a><a class="admin-tab" id="accountTab" href="/admin/accounts">협력사 계정 관리</a></nav>
  </section>
  <section class="summary" id="summary"><div class="metric"><span>승인 대기</span><b>-</b></div><div class="metric"><span>승인 완료</span><b>-</b></div><div class="metric"><span>반려</span><b>-</b></div><div class="metric"><span>사용중지</span><b>-</b></div></section>
  <section class="panel"><div class="panel-head"><strong id="panelTitle">승인 대기 회원</strong><div class="panel-tools"><input class="search" id="searchInput" type="search" placeholder="회사명·이름·이메일 검색"><button class="refresh" id="refreshBtn" type="button">새로고침</button></div></div><div id="tableBox" class="loading">계정 정보를 불러오는 중...</div></section>
</main>
<script>
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const mode=location.pathname.endsWith('/accounts')?'accounts':'approvals';let rows=[];
function labelStatus(s){const labels={pending:'승인 대기',approved:'승인 완료',rejected:'반려',suspended:'사용중지'};return `<span class="status ${esc(s||'pending')}">${esc(labels[s]||s||'-')}</span>`}
function setup(){const approval=mode==='approvals';document.title=(approval?'회원가입 승인':'협력사 계정 관리')+' | Hniruja EHS';$('pageTitle').textContent=approval?'회원가입 승인':'협력사 계정 관리';$('pageCopy').textContent=approval?'가입 신청을 검토하고 승인 또는 반려합니다.':'등록된 협력사 담당자 계정의 상태를 관리합니다.';$('panelTitle').textContent=approval?'승인 대기 회원':'전체 협력사 계정';$('approvalTab').classList.toggle('active',approval);$('accountTab').classList.toggle('active',!approval)}
function renderSummary(){const states=['pending','approved','rejected','suspended'];document.querySelectorAll('#summary b').forEach((el,i)=>el.textContent=rows.filter(r=>r.approval_status===states[i]).length)}
function actionButtons(row){const id=esc(row.id),name=esc(row.name||row.email||'선택한 회원');let html='';if(row.approval_status!=='approved')html+=`<button class="btn primary" type="button" data-action="approve" data-id="${id}" data-name="${name}">승인</button>`;if(row.approval_status==='pending')html+=`<button class="btn danger" type="button" data-action="reject" data-id="${id}" data-name="${name}">반려</button>`;if(row.approval_status==='approved')html+=`<button class="btn danger" type="button" data-action="suspend" data-id="${id}" data-name="${name}">사용중지</button>`;return html||'-'}
function render(){renderSummary();const q=$('searchInput').value.trim().toLowerCase();let list=mode==='approvals'?rows.filter(r=>r.approval_status==='pending'):rows.slice();if(q)list=list.filter(r=>[r.company_name,r.name,r.position,r.email,r.phone].some(v=>String(v||'').toLowerCase().includes(q)));$('tableBox').innerHTML=list.length?`<div class="table-wrap"><table><thead><tr><th>회사명</th><th>이름</th><th>직급</th><th>연락처</th><th>이메일</th><th>가입일</th>${mode==='accounts'?'<th>상태</th>':''}<th>처리</th></tr></thead><tbody>${list.map(r=>`<tr><td>${esc(r.company_name||'-')}</td><td><b>${esc(r.name||'-')}</b></td><td>${esc(r.position||'-')}</td><td>${esc(r.phone||'-')}</td><td>${esc(r.email||'-')}</td><td>${esc(String(r.created_at||'-').slice(0,10))}</td>${mode==='accounts'?`<td>${labelStatus(r.approval_status)}</td>`:''}<td><div class="actions">${actionButtons(r)}</div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">'+(mode==='approvals'?'승인 대기 회원이 없습니다.':'조건에 맞는 계정이 없습니다.')+'</div>';document.querySelectorAll('[data-action]').forEach(btn=>btn.onclick=()=>accountAction(btn.dataset.id,btn.dataset.action,btn.dataset.name))}
async function load(){ $('tableBox').className='loading';$('tableBox').textContent='계정 정보를 불러오는 중...';try{const d=await window.EHSApi.request('/api/admin/registrations',{ehsNoCache:true});rows=d.registrations||[];$('tableBox').className='';render()}catch(e){$('tableBox').className='error';$('tableBox').textContent=window.EHSApi?.describe?window.EHSApi.describe(e):e.message}}
async function accountAction(id,action,name){const title={approve:'승인',reject:'반려',suspend:'사용중지'}[action];if(!confirm(`${name} 계정을 ${title}하시겠습니까?`))return;let reason='';if(action==='reject'){reason=prompt('반려 사유를 입력하세요.','')||'';if(!reason.trim())return}try{await window.EHSApi.request(`/api/admin/registrations/${encodeURIComponent(id)}`,{method:'PATCH',body:JSON.stringify({action,reason:reason.trim()})});await load()}catch(e){alert(window.EHSApi?.describe?window.EHSApi.describe(e):e.message)}}
(async()=>{setup();try{const user=await window.EHSAuth.requireUser();if(user.role!=='admin'){location.replace('/home');return}window.__EHS_PAGE_USER=user;document.dispatchEvent(new CustomEvent('ehs:user-ready',{detail:user}));$('searchInput').addEventListener('input',render);$('refreshBtn').onclick=load;await load()}catch(e){if(e?.status!==401){$('tableBox').className='error';$('tableBox').textContent=e.message||'관리자 화면을 열 수 없습니다.'}}})();
</script>
</body>
</html>
