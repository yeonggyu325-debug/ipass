<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>시스템 상태 | Hniruja EHS</title>
<style>
:root{--ink:#24343f;--text:#586a75;--muted:#8a98a1;--line:#e2e8ec;--page:#f5f7f9;--blue:#236f9f;--blue-bg:#eef6fa;--green:#26735a;--green-bg:#edf7f2;--amber:#99671d;--amber-bg:#fff6e7;--red:#b94e48;--red-bg:#fff0ef}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Segoe UI",sans-serif;letter-spacing:-.025em}button{font:inherit}.hidden{display:none!important}
.shell{width:min(1320px,calc(100% - 40px));margin:0 auto;padding:28px 0 64px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:16px}.eyebrow{color:#58809a;font-size:9px;font-weight:850;letter-spacing:.1em}.page-head h1{margin:7px 0 0;font-size:26px;letter-spacing:-.045em}.page-head p{margin:7px 0 0;color:var(--muted);font-size:11px}.actions{display:flex;gap:7px}.btn{height:36px;padding:0 12px;border:1px solid #d7e0e5;border-radius:8px;background:#fff;color:#5d6e78;font-size:10.5px;font-weight:760;cursor:pointer}.btn:hover{background:#f8fafb}.btn.primary{border-color:var(--blue);background:var(--blue);color:#fff}.btn:disabled{opacity:.5;cursor:default}
.summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:12px}.metric{min-height:105px;padding:15px 16px;border:1px solid var(--line);border-radius:11px;background:#fff}.metric span{display:block;color:#7c8b95;font-size:10px;font-weight:720}.metric b{display:block;margin-top:9px;font-size:24px;letter-spacing:-.045em}.metric small{display:block;margin-top:7px;color:#98a2a9;font-size:8.5px}.metric.good b{color:var(--green)}.metric.warn b{color:var(--amber)}.metric.bad b{color:var(--red)}
.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(360px,.9fr);gap:12px;align-items:start}.panel{overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#fff}.panel+.panel{margin-top:12px}.panel-head{min-height:54px;padding:0 16px;border-bottom:1px solid #e9edef;display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-head strong{font-size:13px}.panel-head span{color:#8b979f;font-size:9px}.panel-body{padding:14px 16px}.health-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.health{min-height:72px;padding:12px;border-radius:9px;background:#f6f8f9}.health span{display:block;color:#7d8b94;font-size:9px;font-weight:720}.health b{display:block;margin-top:7px;color:#43545f;font-size:12px}.health.ok{background:var(--green-bg)}.health.ok b{color:var(--green)}.health.fail{background:var(--red-bg)}.health.fail b{color:var(--red)}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{padding:11px 13px;border-bottom:1px solid #edf0f2;text-align:left}th{background:#f7f9fa;color:#657781;font-size:9.5px;font-weight:800}td{color:#50616c;font-size:10px}tbody tr:last-child td{border-bottom:0}.status{display:inline-flex;align-items:center;min-height:22px;padding:0 7px;border-radius:6px;font-size:8.5px;font-weight:850}.status.ok{background:var(--green-bg);color:var(--green)}.status.warn{background:var(--amber-bg);color:var(--amber)}.status.fail{background:var(--red-bg);color:var(--red)}.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:9px}.list{display:flex;flex-direction:column}.row{display:grid;grid-template-columns:72px minmax(0,1fr) 70px;gap:10px;align-items:center;min-height:45px;padding:8px 0;border-bottom:1px solid #edf0f2}.row:last-child{border-bottom:0}.row strong{font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row small{display:block;margin-top:3px;color:#929ca3;font-size:8.5px}.row .duration{text-align:right;color:#566a76;font-size:9.5px;font-weight:760}.empty,.loading,.error{padding:34px 16px;text-align:center;color:#8d989f;font-size:10.5px}.error{color:var(--red)}.issue{margin-top:9px;padding:10px 11px;border:1px solid #f0d8d5;border-radius:8px;background:var(--red-bg);color:#9c4b46;font-size:9.5px;line-height:1.55}
@media(max-width:1000px){.summary{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.health-grid{grid-template-columns:1fr 1fr}}
@media(max-width:650px){.shell{width:calc(100% - 22px);padding-top:20px}.page-head{align-items:flex-start;flex-direction:column}.summary{grid-template-columns:1fr 1fr}.metric{min-height:92px}.health-grid{grid-template-columns:1fr}.actions{width:100%}.btn{flex:1}}
</style>
<script src="/shared/auth.js?v=5"></script>
<script src="/shared/api.js?v=7"></script>
</head>
<body>
<main class="shell">
  <header class="page-head"><div><div class="eyebrow">SYSTEM OPERATIONS</div><h1>시스템 상태</h1><p>배포·데이터베이스·저장공간·최근 오류를 한 화면에서 확인합니다.</p></div><div class="actions"><button class="btn" id="errorsBtn" type="button">최근 오류만</button><button class="btn primary" id="refreshBtn" type="button">새로고침</button></div></header>
  <section class="summary" id="summary"><div class="metric"><span>서비스 상태</span><b>-</b></div><div class="metric"><span>DB 스키마</span><b>-</b></div><div class="metric"><span>최근 24시간 500</span><b>-</b></div><div class="metric"><span>판정 대기 항목</span><b>-</b></div><div class="metric"><span>R2 사용량</span><b>-</b></div></section>
  <div class="grid">
    <div>
      <section class="panel"><div class="panel-head"><strong>인프라 진단</strong><span id="generatedAt"></span></div><div class="panel-body" id="health"><div class="loading">시스템 상태를 확인하는 중...</div></div></section>
      <section class="panel"><div class="panel-head"><strong>데이터베이스 및 인덱스</strong><span>필수 구조 자동 검증</span></div><div id="database"><div class="loading">데이터베이스 정보를 확인하는 중...</div></div></section>
    </div>
    <div>
      <section class="panel"><div class="panel-head"><strong>최근 요청</strong><span>최신 20건</span></div><div class="panel-body" id="requests"><div class="loading">최근 요청을 불러오는 중...</div></div></section>
      <section class="panel"><div class="panel-head"><strong>느린 경로</strong><span>최근 24시간</span></div><div class="panel-body" id="slow"><div class="loading">성능 정보를 계산하는 중...</div></div></section>
    </div>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function bytes(value){const n=Number(value||0);if(n>=1073741824)return(n/1073741824).toFixed(2)+' GB';if(n>=1048576)return(n/1048576).toFixed(1)+' MB';if(n>=1024)return Math.round(n/1024)+' KB';return n+' B'}
function metric(index,value,tone='',note=''){const card=$('summary').children[index];card.className='metric '+tone;card.querySelector('b').textContent=value;card.querySelector('small')?.remove();if(note){const small=document.createElement('small');small.textContent=note;card.appendChild(small)}}
function healthCard(label,ok,detail){return`<div class="health ${ok?'ok':'fail'}"><span>${esc(label)}</span><b>${ok?'정상':'확인 필요'}</b>${detail?`<small>${esc(detail)}</small>`:''}</div>`}
function renderDatabase(db){const missing=db.indexes?.missing||[];$('database').innerHTML=`<div class="table-wrap"><table><thead><tr><th>구분</th><th>값</th><th>상태</th></tr></thead><tbody><tr><td>스키마 버전</td><td class="code">${esc(db.schema_version)}</td><td><span class="status ${db.schema_version==='0013'?'ok':'fail'}">${db.schema_version==='0013'?'최신':'업데이트 필요'}</span></td></tr><tr><td>고속 인덱스</td><td>${Number(db.indexes?.installed?.length||0)} / ${Number(db.indexes?.required?.length||0)}</td><td><span class="status ${db.fast_path_ready?'ok':'warn'}">${db.fast_path_ready?'정상':'일부 누락'}</span></td></tr><tr><td>승인 계정</td><td>${Number(db.rows?.approved_accounts||0).toLocaleString('ko-KR')}</td><td><span class="status ok">운영 중</span></td></tr><tr><td>평가 대상 / 항목</td><td>${Number(db.rows?.targets||0).toLocaleString('ko-KR')} / ${Number(db.rows?.target_items||0).toLocaleString('ko-KR')}</td><td><span class="status ok">확인</span></td></tr><tr><td>활성 파일</td><td>${Number(db.rows?.active_files||0).toLocaleString('ko-KR')} · ${bytes(db.active_file_bytes)}</td><td><span class="status ok">확인</span></td></tr></tbody></table></div>${missing.length?`<div class="issue">누락 인덱스: ${esc(missing.join(', '))}</div>`:''}`}
function renderRequests(rows){$('requests').innerHTML=rows.length?`<div class="list">${rows.map(r=>`<div class="row"><span class="status ${Number(r.status)>=500?'fail':Number(r.status)>=400?'warn':'ok'}">${esc(r.method)} ${Number(r.status)}</span><div><strong>${esc(r.path)}</strong><small>${esc(String(r.created_at||'').replace('T',' ').slice(0,19))}</small></div><span class="duration">${Number(r.duration_ms||0)} ms</span></div>`).join('')}</div>`:'<div class="empty">최근 요청 기록이 없습니다.</div>'}
function renderSlow(rows){$('slow').innerHTML=rows.length?`<div class="list">${rows.map(r=>`<div class="row"><span class="status ${Number(r.max_ms)>=1000?'fail':Number(r.max_ms)>=500?'warn':'ok'}">${Number(r.requests||0)}회</span><div><strong>${esc(r.path)}</strong><small>평균 ${Number(r.avg_ms||0)} ms</small></div><span class="duration">최대 ${Number(r.max_ms||0)} ms</span></div>`).join('')}</div>`:'<div class="empty">집계할 요청이 없습니다.</div>'}
async function load(){const button=$('refreshBtn');button.disabled=true;try{const [data,storage]=await Promise.all([window.EHSApi.request('/api/admin/system/summary',{ehsNoCache:true}),window.EHSApi.request('/api/admin/storage-status',{ehsNoCache:true})]);const d=data.diagnostics||{},db=data.database||{},req=data.requests||{},global=storage.storage?.global||{};metric(0,d.missing_tables?.length?'확인 필요':'정상',d.missing_tables?.length?'bad':'good',d.missing_tables?.length?`${d.missing_tables.length}개 테이블 누락`:'핵심 서비스 정상');metric(1,db.schema_version||'-',db.schema_version==='0013'?'good':'bad','현재 운영 D1');metric(2,String(req.errors_24h||0),Number(req.errors_24h)>0?'bad':'good','최근 24시간');metric(3,String(db.rows?.undetermined_items||0),Number(db.rows?.undetermined_items)>0?'warn':'good','N/A 판정 대기');metric(4,bytes(global.used_bytes),Number(global.percent)>=90?'bad':Number(global.percent)>=75?'warn':'good',`${Number(global.percent||0).toFixed(1)}% 사용`);$('generatedAt').textContent=new Date(data.generated_at).toLocaleString('ko-KR');$('health').innerHTML=`<div class="health-grid">${healthCard('Cloudflare D1',d.checks?.d1)}${healthCard('Cloudflare R2',d.checks?.r2)}${healthCard('정적 자산',d.checks?.assets)}${healthCard('성능 계측',d.checks?.analytics)}</div>${d.missing_tables?.length?`<div class="issue">누락 테이블: ${esc(d.missing_tables.join(', '))}</div>`:''}`;renderDatabase(db);renderRequests(req.recent||[]);renderSlow(req.slow_routes||[])}catch(error){const message=window.EHSApi?.describe?window.EHSApi.describe(error):error.message;['health','database','requests','slow'].forEach(id=>$(id).innerHTML=`<div class="error">${esc(message)}</div>`)}finally{button.disabled=false}}
$('refreshBtn').onclick=load;$('errorsBtn').onclick=async()=>{const box=$('requests');box.innerHTML='<div class="loading">오류 요청을 불러오는 중...</div>';try{const data=await window.EHSApi.request('/api/admin/system/requests?errors=1&limit=50',{ehsNoCache:true});renderRequests(data.requests||[])}catch(error){box.innerHTML=`<div class="error">${esc(error.message)}</div>`}};
(async()=>{try{const user=await window.EHSAuth.requireUser({role:'admin'});window.__EHS_PAGE_USER=user;document.dispatchEvent(new CustomEvent('ehs:user-ready',{detail:user}));await load()}catch(error){if(error?.status!==401)document.body.innerHTML=`<main class="shell"><div class="error">${esc(error.message||'관리자 권한이 필요합니다.')}</div></main>`}})();
</script>
</body>
</html>
