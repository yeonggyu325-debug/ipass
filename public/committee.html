.edit{padding:15px 16px}.fields{display:grid;grid-template-columns:150px minmax(0,1fr);gap:9px;margin-bottom:14px}.field{min-width:0}.field label{display:block;margin-bottom:5px;font-size:9px;color:#7e8b94;font-weight:720}.field input,.field textarea{width:100%;border:1px solid #dce2e6;border-radius:7px;background:#fff;color:#4e5b65;outline:none;min-width:0}.field input{height:36px;padding:0 8px}.field textarea{height:58px;padding:8px;resize:vertical}.edit-section{margin-top:14px}.edit-section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}.edit-section-head strong{font-size:11px}.edit-tools{display:flex;align-items:center;gap:5px;flex:0 0 auto}.count{height:25px;padding:0 7px;border-radius:999px;background:#f1f4f6;color:#74818b;display:flex;align-items:center;font-size:9px;font-weight:750;white-space:nowrap}.mini{width:29px;height:29px;border:1px solid #e0e5e8;border-radius:7px;background:#fff;color:#6e7c86;display:grid;place-items:center;position:relative;flex:0 0 auto}.edit-search{margin-bottom:7px}.targets{border:1px solid var(--line);border-radius:9px;overflow:hidden;max-height:330px;overflow-y:auto}.target{display:grid;grid-template-columns:minmax(105px,.9fr) 72px minmax(160px,1.5fr);gap:7px;align-items:start;padding:8px;border-bottom:1px solid #eef1f3;min-width:0}.target:last-child{border-bottom:0}.target.hide{display:none}.target-main{display:flex;align-items:center;gap:6px;min-height:31px;min-width:0}.target-main input{width:14px;height:14px;accent-color:var(--blue);flex:0 0 auto}.target-main span{font-size:9.8px;font-weight:680;color:#4c5963;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.target select{height:31px;border:1px solid #e0e5e8;border-radius:6px;background:#fff;padding:0 6px;font-size:9.5px;color:#56636d;min-width:0}.attendee-editor{display:flex;flex-direction:column;gap:5px;min-width:0}.attendee-edit-row{display:grid;grid-template-columns:68px minmax(82px,1fr) 28px;gap:5px;min-width:0}.attendee-edit-row input{height:31px;border:1px solid #e0e5e8;border-radius:6px;padding:0 6px;font-size:9.5px;min-width:0;width:100%}.remove-person{width:28px;height:31px;border:1px solid #ead7d5;border-radius:6px;background:#fff;color:#b25b55;display:grid;place-items:center;font-size:14px}.row-add{width:31px;height:31px;border:1px solid #dce3e7;border-radius:7px;background:#fff;color:#477999;display:grid;place-items:center;margin-top:5px}.row-add svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}.target.disabled .attendee-editor,.target.disabled .row-add{opacity:.42;pointer-events:none}.actions{display:flex;align-items:center;gap:6px;padding-top:12px;margin-top:12px;border-top:1px solid #eef1f3;min-width:0}.actions .grow{flex:1}.save-state{font-size:9.5px;color:#4d8068}.dirty{font-size:9.5px;color:#9a6b25}.loading,.error{padding:32px;text-align:center;color:#87939b;font-size:11px}.error{color:var(--red)}

<body>
<header class="header"><div class="header-in"><button class="brand" id="homeBrand" type="button"><img src="/hniruja-logo.png" alt="Hniruja"><span>협력사 EHS 포털</span><small>안전보건협의체</small></button><div class="head-actions"><span class="user" id="userLabel"></span><button class="icon" id="homeBtn" type="button" data-tip="포털 홈" aria-label="포털 홈"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M9.5 20v-6h5v6"/></svg></button></div></div></header>
<main class="shell">
  <section class="top"><div class="top-left"><h1>안전보건협의체</h1><div class="latest" id="latest"></div></div><div class="top-right"><select id="year" class="year"></select><button class="icon" id="refreshBtn" type="button" data-tip="새로고침" aria-label="새로고침"><svg viewBox="0 0 24 24"><path d="M20 6v5h-5"/><path d="M19 11a7 7 0 1 0 1 5"/></svg></button></div></section>
  <section id="annualAttendance" class="annual-card hidden"><div class="annual-head"><strong>연간 참석 현황</strong></div><div id="annualBody"><div class="annual-loading">불러오는 중...</div></div></section>
  <section class="workspace"><div class="board"><div class="board-head"><strong>협의체 진행 현황</strong></div><div id="months" class="months"></div></div><aside id="detail" class="detail"><div class="detail-empty">월을 선택하세요.</div></aside></section>
</main>
<script>
let currentUser=null,annualData=null,activeMonth=null,activeTab='partner',filterState='all',searchText='',editDirty=false;
const detailCache=new Map();
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
const I={search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>',edit:'<svg viewBox="0 0 24 24"><path d="M4 20h4l11-11-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>',trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"/></svg>',save:'<svg viewBox="0 0 24 24"><path d="M5 4h12l2 2v14H5z"/><path d="M8 4v6h8V4M8 20v-6h8v6"/></svg>',check:'<svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>',checkCircle:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>',x:'<svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></svg>',plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',download:'<svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>',arrow:'<svg viewBox="0 0 24 24"><path d="M5 12h13M13 7l5 5-5 5"/></svg>'};
const icon=n=>I[n]||'';
function goHome(){if(editDirty&&!confirm('저장하지 않은 변경사항이 있습니다. 이동할까요?'))return;location.href='/home'}
$('homeBtn').onclick=goHome;$('homeBrand').onclick=goHome;window.addEventListener('beforeunload',e=>{if(editDirty){e.preventDefault();e.returnValue=''}});
const api=(path,opt={})=>window.EHSApi.request(path,opt);
function buildYears(){const now=new Date().getFullYear();for(let y=now+1;y>=now-4;y--){const o=document.createElement('option');o.value=y;o.textContent=`${y}년`;if(y===now)o.selected=true;$('year').append(o)}$('year').onchange=()=>{if(editDirty&&!confirm('저장하지 않은 변경사항이 있습니다. 연도를 변경할까요?'))return;loadYear(true)}}
function monthOf(m){return Number(m?.meeting_month||String(m?.meeting_date||'').slice(5,7)||0)}function meetingByMonth(n){return (annualData?.meetings||[]).find(m=>monthOf(m)===n)||null}function pct(a,b){return b?Math.round(Number(a||0)/Number(b)*100):0}function dateText(v){return String(v||'').replaceAll('-','.')}
function latestMeeting(){return [...(annualData?.meetings||[])].sort((a,b)=>monthOf(b)-monthOf(a)||String(b.meeting_date||'').localeCompare(String(a.meeting_date||'')))[0]||null}
function renderLatest(){if(currentUser.role!=='admin'){$('latest').innerHTML='';return}const m=latestMeeting();$('latest').innerHTML=m?`<span>대상 협력사 <b>${Number(m.partner_target_count||0)}개사</b></span><span>운영부서 <b>${Number(m.department_target_count||0)}개</b></span>`:'<span>대상 협력사 <b>0개사</b></span><span>운영부서 <b>0개</b></span>'}
function parseArrayMaybe(v){const s=String(v??'').trim();if(!s)return[];if(s.startsWith('[')){try{const a=JSON.parse(s);return Array.isArray(a)?a.map(x=>String(x??'').trim()).filter(Boolean):[s]}catch{}}return[s]}
function attendeesFromRow(r){const names=parseArrayMaybe(r?.attendee_name),positions=parseArrayMaybe(r?.attendee_position),out=[];for(let i=0;i<Math.max(names.length,positions.length);i++){const name=names[i]||'',position=positions[i]||'';if(name||position)out.push({name,position})}return out}

m.status==='finalized'?icon('save'):icon('checkCircle')}</button></div></div>`;bindTargets('partnerRows','partner');bindTargets('departmentRows','department');updateCount('partner');updateCount('department');$('meetingDate').onchange=markDirty;$('meetingNote').oninput=markDirty;$('partnerSearch').oninput=e=>filterTargets('partnerRows',e.target.value);$('departmentSearch').oninput=e=>filterTargets('departmentRows',e.target.value);$('allPresentPartner').onclick=()=>{$('partnerRows').querySelectorAll('.target').forEach(t=>{if(t.querySelector('.check').checked)t.querySelector('.status-sel').value='present'});markDirty()};$('allPresentDepartment').onclick=()=>{$('departmentRows').querySelectorAll('.target').forEach(t=>{if(t.querySelector('.check').checked)t.querySelector('.status-sel').value='present'});markDirty()};$('cancelBtn').onclick=()=>{if(editDirty&&!confirm('수정사항을 취소할까요?'))return;editDirty=false;renderAdminDetail(m)};$('deleteBtn').onclick=()=>deleteMeeting(m);if($('draftBtn'))$('draftBtn').onclick=()=>saveMeeting(m,false);$('saveBtn').onclick=()=>saveMeeting(m,true);if(focusCompanyId){const t=$('partnerRows').querySelector(`[data-id="${CSS.escape(focusCompanyId)}"]`);if(t){const c=t.querySelector('.check');if(!c.checked){c.checked=true;c.dispatchEvent(new Event('change'))}t.querySelector('.status-sel').value='present';if(addBlank)addAttendeeInput(t);t.scrollIntoView({block:'center'})}}}
function collect(id,key){return [...$(id).querySelectorAll('.target')].filter(t=>t.querySelector('.check').checked).map(t=>{const status=t.querySelector('.status-sel').value,attendees=[...t.querySelectorAll('.attendee-edit-row')].map(r=>({position:r.querySelector('.position').value.trim(),name:r.querySelector('.name').value.trim()})).filter(x=>x.position||x.name),packed=packAttendees(attendees);return{[key]:t.dataset.id,attendance_status:status,...packed,attendees}})}
function validate(rows,label,finalize){if(finalize&&label==='협력사'&&!rows.length)return'협력사를 1개 이상 선택하세요.';for(const r of rows){if(finalize&&r.attendance_status==='pending')return`${label} 참석여부를 모두 지정하세요.`;if(r.attendance_status==='present'){if(!r.attendees.length)return`참석 ${label}의 참석자를 입력하세요.`;if(r.attendees.some(a=>!a.position||!a.name))return`참석 ${label}의 직급과 성명을 모두 입력하세요.`}}return null}
function updateLocal(d){const i=annualData.meetings.findIndex(x=>x.id===d.id),p=d.partners||[];const x={...d,partner_target_count:p.length,partner_present_count:p.filter(r=>r.attendance_status==='present').length,partner_absent_count:p.filter(r=>r.attendance_status==='absent').length,partner_pending_count:p.filter(r=>r.attendance_status==='pending').length,department_target_count:(d.departments||[]).length};if(i>=0)annualData.meetings[i]={...annualData.meetings[i],...x};else annualData.meetings.push(x)}
async function saveMeeting(m,finalize){const p=collect('partnerRows','company_id'),d=collect('departmentRows','department_id'),keep=m.status==='finalized',doFinalize=keep||finalize,msg=validate(p,'협력사',doFinalize)||validate(d,'부서',doFinalize);if(msg){alert(msg);return}$('saveState').textContent='저장 중...';const started=performance.now();try{const body={meeting_date:$('meetingDate').value,note:$('meetingNote').value.trim(),partners:p.map(({attendees,...x})=>x),departments:d.map(({attendees,...x})=>x),finalize:doFinalize,expected_updated_at:m.updated_at};if(keep)body.reopen=true;else if(!finalize)body.status='draft';const res=await api(`/api/admin/committee/${encodeURIComponent(m.id)}`,{method:'PATCH',body:JSON.stringify(body)});editDirty=false;detailCache.set(m.id,res.meeting);updateLocal(res.meeting);renderLatest();renderCards();renderAnnualAttendance();renderAdminDetail(res.meeting);const el=$('detail').querySelector('.detail-body');if(el){const s=document.createElement('div');s.className='save-state';s.style.marginTop='8px';s.textContent=`✓ 저장 ${Math.round(performance.now()-started)}ms`;el.append(s)}}catch(e){alert(e.message);renderEdit(m)}}
async function deleteMeeting(m){if(!confirm(`${monthOf(m)}월 협의체를 삭제할까요?`))return;try{await api(`/api/admin/committee/${encodeURIComponent(m.id)}`,{method:'DELETE'});editDirty=false;annualData.meetings=annualData.meetings.filter(x=>x.id!==m.id);detailCache.delete(m.id);activeMonth=null;renderLatest();renderCards();renderAnnualAttendance();$('detail').innerHTML='<div class="detail-empty">월을 선택하세요.</div>'}catch(e){alert(e.message)}}
(async()=>{try{currentUser=await window.EHSAuth.requireUser();buildYears();$('userLabel').textContent=currentUser.name||currentUser.email||'';await loadYear()}catch(e){if(e?.status===401)return;const msg=window.EHSApi.describe(e);$('months').innerHTML=`<div class="error" style="grid-column:1/-1">${esc(msg)}</div>`;$('detail').innerHTML=`<div class="error">${esc(msg)}</div>`}})();
</script>
</body>
