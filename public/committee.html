<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>안전보건협의체 | Hniruja EHS</title>
  <style>
    html,body{width:100%;height:100%;margin:0;background:#f5f7f9}
    #portal{width:100%;height:100%;border:0;display:block}
    #error{position:fixed;inset:0;display:none;place-items:center;padding:24px;background:#f5f7f9;color:#26323b;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}
    #error div{max-width:360px;padding:28px;background:#fff;border:1px solid #e5e9ec;border-radius:12px}
    #error button{margin-top:16px;height:38px;padding:0 14px;border:0;border-radius:8px;background:#2878d4;color:#fff;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <iframe id="portal" src="index.html" title="Hniruja EHS 포털"></iframe>
  <div id="error"><div><strong>협의체 화면을 열지 못했습니다.</strong><p>포털 로그인 상태를 확인한 뒤 다시 시도해 주세요.</p><button type="button" onclick="location.replace('index.html')">포털로 돌아가기</button></div></div>
  <script>
    const frame=document.getElementById('portal');
    const error=document.getElementById('error');
    let tries=0;
    function isLoggedIn(win){
      try{
        const app=win.document.getElementById('app');
        return !!app && !app.classList.contains('hidden');
      }catch(_){return false;}
    }
    function isLoginScreenVisible(win){
      try{
        const portal=win.document.getElementById('publicPortal');
        return !!portal && !portal.classList.contains('hidden');
      }catch(_){return false;}
    }
    function openCommittee(){
      const win=frame.contentWindow;
      if(!win){scheduleRetry();return;}
      if(isLoggedIn(win) && typeof win.navigatePage==='function'){
        win.navigatePage('committee');
        return;
      }
      if(isLoginScreenVisible(win) && tries>10){
        frame.style.display='none';
        error.style.display='grid';
        return;
      }
      scheduleRetry();
    }
    function scheduleRetry(){
      if(++tries<100){setTimeout(openCommittee,100);return;}
      frame.style.display='none';
      error.style.display='grid';
    }
    frame.addEventListener('load',()=>setTimeout(openCommittee,80));
  </script>
</body>
</html>
