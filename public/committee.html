<body>
<header class="header"><div class="header-inner"><button class="brand" id="brandHome" type="button"><img src="/hniruja-logo.png" alt="Hniruja"><span>협력사 EHS 포털</span><span class="brand-divider"></span><span class="brand-sub">안전보건협의체</span></button><div class="header-actions"><span class="user-label" id="userLabel"></span><button class="icon-btn" id="homeBtn" type="button" data-tip="포털 홈" aria-label="포털 홈"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M9.5 20v-6h5v6"/></svg></button></div></div></header>
<main class="shell"><div class="breadcrumb">홈 · EHS 업무 · 안전보건협의체</div><section class="hero"><div><h1 id="pageTitle">연간 안전보건협의체 관리</h1><p id="subtitle">연간 운영 상태와 월별 참석자를 한 화면에서 관리합니다.</p></div><div class="hero-actions"><select id="year" class="year-select" aria-label="연도"></select><button class="icon-btn" id="refreshBtn" type="button" data-tip="새로고침" aria-label="새로고침"><svg viewBox="0 0 24 24"><path d="M20 6v5h-5"/><path d="M19 11a7 7 0 1 0 1 5"/></svg></button></div></section><div id="summary" class="summary"></div><section class="progress-card"><div class="progress-head"><strong id="progressTitle">연간 운영 흐름</strong><span id="progressMeta"></span></div><div id="monthRail" class="month-rail"></div></section><section class="workspace"><div class="board"><div class="board-head"><div class="board-title"><strong id="boardTitle">월별 협의체</strong><span id="boardMeta">월을 선택하면 상세 참석자를 확인할 수 있습니다.</span></div><div class="legend"><span class="l-final"><i></i>확정</span><span class="l-draft"><i></i>작성중</span><span><i></i>미등록</span></div></div><div id="months" class="months"></div></div><aside id="detail" class="detail-panel"><div class="detail-empty"><div class="empty-symbol">12</div><strong>월을 선택하세요</strong><span>월별 참석 현황과 담당자 정보를<br>오른쪽에서 빠르게 확인할 수 있습니다.</span></div></aside></section></main>
<script>
const API_ORIGIN=location.hostname==='ipass.i-pass-eval.workers.dev'?'':'https://ipass.i-pass-eval.workers.dev';
const FIREBASE_API_KEY='AIzaSyC0s7buQaayKr84QA_wFNyF6rcs6w1-IoU';
const KEY='ipass.session.v10';
let session=null,currentUser=null,annualData=null,activeMonth=null,activeTab='partner',detailFilter='all',detailQuery='',editMode=false,editDirty=false;
const detailCache=new Map();
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
const ICON={search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>',edit:'<svg viewBox="0 0 24 24"><path d="M4 20h4l11-11-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>',trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"/><path d="M10 11v5M14 11v5"/></svg>',save:'<svg viewBox="0 0 24 24"><path d="M5 4h12l2 2v14H5z"/><path d="M8 4v6h8V4M8 20v-6h8v6"/></svg>',check:'<svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>',checkCircle:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>',x:'<svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></svg>',users:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-4 2-6 6-6s6 2 6 6"/><path d="M16 5a3 3 0 0 1 0 6M16 14c3 0 5 2 5 6"/></svg>',calendar:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg>',plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',remove:'<svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>',arrow:'<svg viewBox="0 0 24 24"><path d="M5 12h13M13 7l5 5-5 5"/></svg>'};
function icon(name){return ICON[name]||''}
function goHome(){if(editDirty&&!confirm('저장하지 않은 변경사항이 있습니다. 포털로 이동할까요?'))return;try{if(document.referrer){const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return}}}catch{}location.replace('/index.html')}
$('homeBtn').onclick=goHome;$('brandHome').onclick=goHome;window.addEventListener('beforeunload',e=>{if(editDirty){e.preventDefault();e.returnValue=''}});
async function refreshToken(){const body=new URLSearchParams({grant_type:'refresh_token',refresh_token:session.refreshToken});const r=await fetch(`https://securetoken.googleapis.com/v1/token?key=${encodeURIComponent(FIREBASE_API_KEY)}`,{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body});const d=await r.json();if(!r.ok)throw Object.assign(new Error('로그인 세션이 만료되었습니다.'),{status:401});session.idToken=d.id_token;session.refreshToken=d.refresh_token||session.refreshToken;session.expiresAt=Date.now()+Number(d.expires_in||3600)*1000;sessionStorage.setItem(KEY,JSON.stringify(session));return session.idToken}
async function api(path,opt={},retry=true){if(!session)throw Object.assign(new Error('로그인이 필요합니다.'),{status:401});const t=Date.now()>Number(session.expiresAt||0)-60000?await refreshToken():session.idToken;let r;try{r=await fetch(API_ORIGIN+path,{...opt,headers:{Accept:'application/json',Authorization:`Bearer ${t}`,...(opt.body?{'content-type':'application/json'}:{}),...(opt.headers||{})}})}catch{throw new Error('i-PaSS API에 연결하지 못했습니다.')}if(r.status===401&&retry){await refreshToken();return api(path,opt,false)}const d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||`HTTP ${r.status}`),{status:r.status,data:d});return d}
function buildYears(){const s=$('year'),now=new Date().getFullYear();for(let y=now+1;y>=now-4;y--){const o=document.createElement('option');o.value=String(y);o.textContent=`${y}년`;if(y===now)o.selected=true;s.append(o)}s.onchange=()=>{if(editDirty&&!confirm('저장하지 않은 변경사항이 있습니다. 연도를 변경할까요?'))return;loadYear(true)}}
function monthOf(m){return Number(m?.meeting_month||String(m?.meeting_date||'').slice(5,7)||0)}function meetingByMonth(month){return (annualData?.meetings||[]).find(m=>monthOf(m)===month)||null}
function statusBadge(status){if(status==='finalized')return '<span class="status finalized">확정</span>';if(status==='draft')return '<span class="status draft">작성중</span>';if(status==='present')return '<span class="status present">참석</span>';if(status==='absent')return '<span class="status absent">불참</span>';return '<span class="status empty">미등록</span>'}
function initials(name){const s=String(name||'').trim();return s?s.slice(-1):'·'}function dateShort(v){return String(v||'').replaceAll('-','.').slice(5)}function isCurrentMonth(month){const d=new Date();return Number($('year').value)===d.getFullYear()&&month===d.getMonth()+1}function clampRate(n){return Math.max(0,Math.min(100,Math.round(Number(n)||0)))}
function metric(label,value,meta,ico){return `<div class="metric"><div class="metric-top"><span class="metric-label">${esc(label)}</span><span class="metric-icon">${icon(ico)}</span></div><div class="metric-value">${value}</div><div class="metric-meta">${esc(meta)}</div></div>`}
function renderSummary(){const meetings=annualData?.meetings||[];if(currentUser.role==='partner'){const s=annualData?.summary||{};$('summary').innerHTML=metric('협의체 점수',`${Number(s.score??10)} / 10`,'불참 1회당 -3점','checkCircle')+metric('대상 회차',`${Number(s.finalized_meeting_count||0)}회`,'확정된 나의 대상 회차','calendar')+metric('참석',`${Number(s.present_count||0)}회`,'연간 참석 누계','users')+metric('불참',`${Number(s.absence_count||0)}회`,Number(s.absence_count||0)?`-${Number(s.absence_count||0)*3}점 반영`:'감점 없음','x');return}const finalized=meetings.filter(m=>m.status==='finalized'),present=finalized.reduce((n,m)=>n+Number(m.partner_present_count||0),0),absent=finalized.reduce((n,m)=>n+Number(m.partner_absent_count||0),0);$('summary').innerHTML=metric('운영 등록',`${meetings.length} / 12`,'월별 협의체 등록','calendar')+metric('확정 회차',`${finalized.length}회`,'회의 확정 완료','checkCircle')+metric('협력사 참석',`${present}건`,'확정 회차 참석 누계','users')+metric('협력사 불참',`${absent}건`,'i-PaSS 감점 대상','x')}
function renderRail(){const year=$('year').value;$('progressTitle').textContent=`${year}년 운영 흐름`;$('progressMeta').textContent=currentUser.role==='admin'?'각 월을 눌러 바로 이동할 수 있습니다.':'나의 확정 참석결과 기준입니다.';$('monthRail').innerHTML=Array.from({length:12},(_,i)=>i+1).map(month=>{const m=meetingByMonth(month),st=currentUser.role==='partner'?(m?.attendance_status||''):m?.status||'';return `<button type="button" class="rail-button ${activeMonth===month?'active':''} ${isCurrentMonth(month)?'current':''}" data-month="${month}" aria-label="${month}월 열기"><div class="rail-track ${st}"></div><div class="rail-label">${month}월</div></button>`}).join('');$('monthRail').querySelectorAll('.rail-button').forEach(b=>b.onclick=()=>openMonth(Number(b.dataset.month)))}
function previewFor(m){if(!m)return '';if(currentUser.role==='partner'){if(m.attendance_status==='present')return `<div class="attendee-line"><div class="avatar-stack"><span class="avatar">${esc(initials(m.attendee_name))}</span></div><span class="preview-text">${esc(`${m.attendee_position||''} ${m.attendee_name||''}`.trim()||'참석자')}</span></div>`;return '<span class="preview-text">불참으로 확정되었습니다.</span>'}const d=detailCache.get(m.id);if(!d)return '<span class="preview-text">참석자 명단 확인</span>';const people=(d.partners||[]).filter(x=>x.attendance_status==='present').slice(0,3),total=(d.partners||[]).filter(x=>x.attendance_status==='present').length;if(!people.length)return '<span class="preview-text">참석자로 기록된 협력사 없음</span>';return `<div class="attendee-line"><div class="avatar-stack">${people.map(x=>`<span class="avatar">${esc(initials(x.attendee_name||x.company_name))}</span>`).join('')}</div><span class="preview-text">${esc(people.map(x=>x.attendee_name||x.company_name).join(' · '))}${total>3?` 외 ${total-3}명`:''}</span></div>`}
async function prefetchMeeting(m){if(currentUser?.role!=='admin'||!m||detailCache.has(m.id))return;try{const d=await api(`/api/admin/committee/${encodeURIComponent(m.id)}`);detailCache.set(m.id,d.meeting);renderMonths()}catch{}}
function adminCard(m,month,active){const target=Number(m.partner_target_count||0),present=Number(m.partner_present_count||0),absent=Number(m.partner_absent_count||0),pending=Number(m.partner_pending_count||0),rate=target?clampRate(present/target*100):0,current=isCurrentMonth(month),classes=[active?'active':'',m.status==='finalized'?'is-finalized':'is-draft',absent>0?'has-absence':'',current?'is-current':''].filter(Boolean).join(' '),ringClass=absent>0?'alert':m.status==='draft'?'draft':'',progressClass=m.status==='draft'?'draft':'';return `<button class="month-card ${classes}" type="button" data-month="${month}"><div class="card-inner"><div class="month-head"><div class="month-title-wrap"><span class="month-num">${month}월</span>${current?'<span class="current-chip">이번 달</span>':''}</div>${statusBadge(m.status)}</div><div class="month-date-row"><span class="month-date">${esc(dateShort(m.meeting_date))}</span>${absent>0?`<span class="month-alert"><i></i>불참 ${absent}</span>`:pending>0?`<span class="month-alert" style="color:#9a6921"><i style="background:#d5a153"></i>미정 ${pending}</span>`:''}</div><div class="card-performance"><div class="rate-ring ${ringClass}" style="--rate:${rate}"><div class="rate-copy"><b>${rate}%</b><span>참석률</span></div></div><div class="stat-lines"><div class="stat-line"><span>대상 협력사</span><b>${target}개사</b></div><div class="stat-line"><span>참석</span><b>${present}개사</b></div><div class="stat-line"><span>불참</span><b class="${absent?'bad':''}">${absent}개사</b></div></div></div><div class="progress-mini ${progressClass}"><span style="width:${rate}%"></span></div><div class="progress-caption"><span>참석 ${present}</span><span>${pending?`미정 ${pending}`:m.status==='finalized'?'확정 완료':'작성 중'}</span></div><div class="attendee-preview">${previewFor(m)}<span class="card-arrow">${icon('arrow')}</span></div></div></button>`}
function partnerCard(m,month,active){const current=isCurrentMonth(month),present=m.attendance_status==='present',classes=[active?'active':'',present?'is-finalized':'has-absence',current?'is-current':''].filter(Boolean).join(' ');return `<button class="month-card ${classes}" type="button" data-month="${month}"><div class="card-inner"><div class="month-head"><div class="month-title-wrap"><span class="month-num">${month}월</span>${current?'<span class="current-chip">이번 달</span>':''}</div>${statusBadge(m.attendance_status)}</div><div class="month-date-row"><span class="month-date">${esc(dateShort(m.meeting_date))}</span></div><div class="partner-card-result ${present?'present':'absent'}"><div class="partner-result-title"><strong>${present?'참석 완료':'불참'}</strong><span>${present?'협의체 참석':'i-PaSS 감점 반영'}</span></div><div class="partner-person">${present?esc(`${m.attendee_position||''} ${m.attendee_name||''}`.trim()||'참석자 정보 확인'):'불참으로 확정되었습니다.'}</div></div><div class="partner-score-note">${present?'정상 참석 처리되었습니다.':'불참 1회당 협의체 점수 3점 감점'} </div><div class="attendee-preview">${previewFor(m)}<span class="card-arrow">${icon('arrow')}</span></div></div></button>`}
function emptyCard(month,active,isAdmin){const current=isCurrentMonth(month);return `<button class="month-card empty ${active?'active':''} ${current?'is-current':''}" type="button" data-month="${month}"><div class="card-inner"><div class="month-head"><div class="month-title-wrap"><span class="month-num">${month}월</span>${current?'<span class="current-chip">이번 달</span>':''}</div>${statusBadge('empty')}</div><div class="empty-card-center"><span class="empty-plus">${icon('plus')}</span><div class="empty-copy">${isAdmin?'아직 등록된 협의체가 없습니다.':'확정된 대상 회차가 없습니다.'}</div>${isAdmin?'<div class="create-link">이 달 협의체 등록</div>':''}</div><div class="attendee-preview"><span class="preview-text">${isAdmin?'새 회차 생성':'대상 회차 없음'}</span><span class="card-arrow">${icon('arrow')}</span></div></div></button>`}
function bindMonthCards(){document.querySelectorAll('.month-card').forEach(b=>{const month=Number(b.dataset.month),m=meetingByMonth(month);b.onclick=()=>openMonth(month);if(m&&currentUser.role==='admin'){b.onmouseenter=()=>prefetchMeeting(m);b.onfocus=()=>prefetchMeeting(m)}})}
function renderMonths(){const isAdmin=currentUser.role==='admin';$('boardTitle').textContent=`${$('year').value}년 월별 협의체`;$('boardMeta').textContent=isAdmin?'참석률·불참·미정 상태를 카드에서 바로 확인하고 월을 선택해 상세 관리하세요.':'월별 확정 참석 결과를 카드에서 바로 확인하세요.';$('months').innerHTML=Array.from({length:12},(_,i)=>i+1).map(month=>{const m=meetingByMonth(month),active=activeMonth===month;if(!m)return emptyCard(month,active,isAdmin);return isAdmin?adminCard(m,month,active):partnerCard(m,month,active)}).join('');bindMonthCards()}
async function loadYear(force=false){activeMonth=null;activeTab='partner';detailFilter='all';detailQuery='';editMode=false;editDirty=false;if(force)detailCache.clear();$('detail').innerHTML='<div class="detail-empty"><div class="empty-symbol">12</div><strong>불러오는 중...</strong><span>연간 협의체 현황을 확인하고 있습니다.</span></div>';$('months').innerHTML='<div class="loading" style="grid-column:1/-1">연간 협의체 현황을 불러오는 중...</div>';try{annualData=await api(`/api/committee?year=${encodeURIComponent($('year').value)}`);renderSummary();renderRail();renderMonths();const now=new Date(),preferred=meetingByMonth(now.getMonth()+1)||[...(annualData.meetings||[])].sort((a,b)=>monthOf(b)-monthOf(a))[0];if(preferred)await openMonth(monthOf(preferred));else $('detail').innerHTML='<div class="detail-empty"><div class="empty-symbol">+</div><strong>아직 등록된 협의체가 없습니다</strong><span>왼쪽에서 원하는 월을 선택해<br>첫 회차를 등록할 수 있습니다.</span></div>'}catch(e){$('months').innerHTML=`<div class="error" style="grid-column:1/-1">${esc(e.message)}</div>`;$('detail').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
$('refreshBtn').onclick=()=>{if(editDirty&&!confirm('저장하지 않은 변경사항이 있습니다. 새로고침할까요?'))return;loadYear(true)};
async function openMonth(month){if(editDirty&&month!==activeMonth&&!confirm('저장하지 않은 변경사항이 있습니다. 다른 월로 이동할까요?'))return;activeMonth=month;activeTab='partner';detailFilter='all';detailQuery='';editMode=false;editDirty=false;renderRail();renderMonths();const m=meetingByMonth(month);if(!m){if(currentUser.role==='admin')renderCreate(month);else renderPartnerDetail(month,null);return}if(currentUser.role==='partner'){renderPartnerDetail(month,m);return}await loadAdminDetail(m)}
function renderPartnerDetail(month,m){if(!m){$('detail').innerHTML=`<div class="detail-empty"><div class="empty-symbol">${month}</div><strong>${month}월 대상 회차 없음</strong><span>확정된 협의체 대상에 포함되지 않았습니다.</span></div>`;return}$('detail').innerHTML=`<div class="detail-head"><div class="detail-head-top"><div class="detail-heading"><strong>${month}월 참석 결과</strong><span>${esc(m.meeting_date||'')}</span></div>${statusBadge(m.attendance_status)}</div></div><div class="detail-body"><div class="meta-strip"><div class="meta-item"><span>참석 상태</span><b>${m.attendance_status==='present'?'참석':'불참'}</b></div><div class="meta-item"><span>직급</span><b>${esc(m.attendee_position||'-')}</b></div><div class="meta-item"><span>성명</span><b>${esc(m.attendee_name||'-')}</b></div></div>${m.note?`<div class="note-box">${esc(m.note)}</div>`:''}</div>`}
function renderCreate(month){const year=Number($('year').value),now=new Date(),day=(year===now.getFullYear()&&month===now.getMonth()+1)?String(now.getDate()).padStart(2,'0'):'01',mm=String(month).padStart(2,'0');$('detail').innerHTML=`<div class="detail-head"><div class="detail-head-top"><div class="detail-heading"><strong>${month}월 협의체 등록</strong><span>새 월별 회차를 생성합니다.</span></div>${statusBadge('empty')}</div></div><div class="edit-shell"><div class="edit-notice">월별 협의체는 1개만 생성됩니다. 생성 후 대상 협력사와 사내 부서를 선택할 수 있습니다.</div><div class="fields"><div class="field"><label>개최일</label><input id="createDate" type="date" value="${year}-${mm}-${day}"></div><div class="field"><label>비고</label><textarea id="createNote" placeholder="필요한 메모만 입력하세요."></textarea></div></div><div class="edit-actions"><span class="grow"></span><button class="btn primary" id="createBtn" type="button">${icon('plus')} ${month}월 협의체 생성</button></div></div>`;$('createBtn').onclick=()=>createMeeting(month)}
async function createMeeting(month){const btn=$('createBtn'),year=Number($('year').value);btn.disabled=true;btn.textContent='생성 중...';try{const d=await api('/api/admin/committee',{method:'POST',body:JSON.stringify({year,month,meeting_date:$('createDate').value,note:$('createNote').value.trim()})});annualData.meetings=[...(annualData.meetings||[]),{...d.meeting,partner_target_count:0,partner_present_count:0,partner_absent_count:0,partner_pending_count:0,department_target_count:0}];detailCache.set(d.meeting.id,d.meeting);renderSummary();renderRail();renderMonths();renderAdminDetail(d.meeting,false)}catch(e){alert(e.message);btn.disabled=false;btn.innerHTML=`${icon('plus')} ${month}월 협의체 생성`}}
async function loadAdminDetail(m){$('detail').innerHTML='<div class="loading">참석자 명단을 불러오는 중...</div>';try{let d=detailCache.get(m.id);if(!d){d=(await api(`/api/admin/committee/${encodeURIComponent(m.id)}`)).meeting;detailCache.set(m.id,d);renderMonths()}renderAdminDetail(d,false)}catch(e){$('detail').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
function filteredRows(m){let rows=activeTab==='partner'?(m.partners||[]):(m.departments||[]);if(detailFilter!=='all')rows=rows.filter(r=>r.attendance_status===detailFilter);const q=detailQuery.trim().toLowerCase();if(q)rows=rows.filter(r=>`${activeTab==='partner'?r.company_name:r.department_name} ${r.attendee_position||''} ${r.attendee_name||''}`.toLowerCase().includes(q));return rows}
function peopleRows(rows,type){if(!rows.length)return '<div class="list-empty">조건에 맞는 대상이 없습니다.</div>';return rows.map(r=>{const org=type==='partner'?r.company_name:r.department_name,person=`${r.attendee_position||''} ${r.attendee_name||''}`.trim();return `<div class="person-row"><div class="person-org"><strong>${esc(org||'-')}</strong><span>${r.attendance_status==='present'?(person?esc(person):'참석자 정보 없음'):r.attendance_status==='absent'?'불참':'상태 미정'}</span></div><span class="state-text ${esc(r.attendance_status||'pending')}">${r.attendance_status==='present'?'참석':r.attendance_status==='absent'?'불참':'미정'}</span><span class="person-name">${r.attendance_status==='present'?esc(r.attendee_name||'-'):'-'}</span></div>`}).join('')}
function renderViewList(m){$('peopleArea').innerHTML=peopleRows(filteredRows(m),activeTab);document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===activeTab));document.querySelectorAll('.filter-chip').forEach(f=>f.classList.toggle('active',f.dataset.filter===detailFilter))}
function bindViewTools(m){document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{activeTab=t.dataset.tab;detailFilter='all';detailQuery='';$('detailSearch').value='';renderViewList(m)});document.querySelectorAll('.filter-chip').forEach(f=>f.onclick=()=>{detailFilter=f.dataset.filter;renderViewList(m)});$('detailSearch').oninput=e=>{detailQuery=e.target.value;renderViewList(m)}}
function renderAdminDetail(m,editing=false){editMode=editing;editDirty=false;if(editing){renderEdit(m);return}const month=monthOf(m),p=m.partners||[],present=p.filter(x=>x.attendance_status==='present').length,absent=p.filter(x=>x.attendance_status==='absent').length;$('detail').innerHTML=`<div class="detail-head"><div class="detail-head-top"><div class="detail-heading"><strong>${month}월 안전보건협의체</strong><span>${esc(m.meeting_date||'')} · 대상 협력사 ${p.length}개사</span></div><div class="detail-head-actions">${statusBadge(m.status)}<button class="icon-btn" id="editBtn" type="button" data-tip="수정" aria-label="수정">${icon('edit')}</button></div></div></div><div class="detail-body"><div class="meta-strip"><div class="meta-item"><span>대상</span><b>${p.length}개사</b></div><div class="meta-item"><span>참석</span><b>${present}개사</b></div><div class="meta-item"><span>불참</span><b>${absent}개사</b></div></div><div class="tabs"><button class="tab active" data-tab="partner" type="button">협력사 ${p.length}</button><button class="tab" data-tab="department" type="button">사내부서 ${(m.departments||[]).length}</button></div><div class="list-tools"><div class="search-box">${icon('search')}<input id="detailSearch" type="search" placeholder="회사명·직급·성명 검색"></div><div class="filters"><button class="filter-chip active" data-filter="all">전체</button><button class="filter-chip" data-filter="present">참석</button><button class="filter-chip" data-filter="absent">불참</button><button class="filter-chip" data-filter="pending">미정</button></div></div><div id="peopleArea" class="people-list"></div>${m.note?`<div class="note-box">${esc(m.note)}</div>`:''}<div class="detail-footer"><span class="grow"></span>${m.status!=='finalized'?`<button class="icon-btn danger" id="deleteViewBtn" type="button" data-tip="회차 삭제" aria-label="회차 삭제">${icon('trash')}</button>`:''}</div></div>`;activeTab='partner';detailFilter='all';detailQuery='';renderViewList(m);bindViewTools(m);$('editBtn').onclick=()=>renderAdminDetail(m,true);if($('deleteViewBtn'))$('deleteViewBtn').onclick=()=>deleteMeeting(m)}
function statusOptions(v){return [['pending','미정'],['present','참석'],['absent','불참']].map(([x,t])=>`<option value="${x}" ${x===v?'selected':''}>${t}</option>`).join('')}
function editRows(options,selected,type){const key=type==='partner'?'company_id':'department_id',nameKey=type==='partner'?'company_name':'department_name',map=new Map((selected||[]).map(r=>[r[key],r]));return (options||[]).map(o=>{const r=map.get(o.id),checked=!!r;return `<div class="target-row" data-id="${esc(o.id)}" data-search="${esc(String(o[nameKey]||'').toLowerCase())}"><label class="target-check"><input class="check" type="checkbox" ${checked?'checked':''}><span>${esc(o[nameKey])}</span></label><select class="att-status" ${checked?'':'disabled'}>${statusOptions(r?.attendance_status||'pending')}</select><input class="position person-field" type="text" placeholder="직급" value="${esc(r?.attendee_position||'')}" ${checked?'':'disabled'}><input class="name person-field" type="text" placeholder="성명" value="${esc(r?.attendee_name||'')}" ${checked?'':'disabled'}></div>`}).join('')}
function markDirty(){editDirty=true;document.querySelector('.dirty-dot')?.classList.add('show');const t=$('dirtyText');if(t)t.textContent='수정됨'}
function updateSelectedCount(id,countId){const n=[...$(id).querySelectorAll('.check')].filter(c=>c.checked).length;$(countId).textContent=`선택 ${n}`}
function filterEditRows(id,q){const v=String(q||'').trim().toLowerCase();$(id).querySelectorAll('.target-row').forEach(r=>r.classList.toggle('filtered-out',v&&!`${r.dataset.search} ${r.querySelector('.position').value} ${r.querySelector('.name').value}`.toLowerCase().includes(v)))}
function bindEditRows(id,countId,searchId){$(id).querySelectorAll('.target-row').forEach(row=>{const c=row.querySelector('.check'),s=row.querySelector('.att-status'),inputs=[...row.querySelectorAll('.person-field')];const sync=()=>{s.disabled=!c.checked;inputs.forEach(i=>i.disabled=!c.checked);if(!c.checked){s.value='pending';inputs.forEach(i=>i.value='')}updateSelectedCount(id,countId);markDirty()};c.onchange=sync;s.onchange=markDirty;inputs.forEach(i=>i.oninput=markDirty)});$(searchId).oninput=e=>filterEditRows(id,e.target.value);updateSelectedCount(id,countId)}
function renderEdit(m){const month=monthOf(m),wasFinalized=m.status==='finalized';$('detail').innerHTML=`<div class="detail-head"><div class="detail-head-top"><div class="detail-heading"><strong>${month}월 협의체 수정</strong><span>${wasFinalized?'확정 상태를 유지한 채 변경사항을 저장할 수 있습니다.':'작성 중인 회차를 수정합니다.'}</span></div>${statusBadge(m.status)}</div></div><div class="edit-shell">${wasFinalized?'<div class="edit-notice">확정된 회차입니다. 화면에서 수정한 뒤 저장하면 변경내용이 한 번에 반영되고 확정 상태는 유지됩니다.</div>':''}<div class="fields"><div class="field"><label>개최일</label><input id="meetingDate" type="date" value="${esc(m.meeting_date||'')}"></div><div class="field"><label>비고</label><textarea id="meetingNote" placeholder="필요한 메모만 입력하세요.">${esc(m.note||'')}</textarea></div></div><div class="edit-section"><div class="edit-section-head"><strong>대상 협력사</strong><div class="section-tools"><span class="count-badge" id="partnerCount">선택 0</span><button class="mini-icon" type="button" data-all="partner" data-tip="선택 대상 모두 참석">${icon('check')}</button><button class="mini-icon" type="button" data-clear="partner" data-tip="전체 선택 해제">${icon('remove')}</button></div></div><div class="search-box edit-search">${icon('search')}<input id="partnerSearch" type="search" placeholder="협력사 검색"></div><div class="target-list" id="partnerRows">${editRows(annualData.options?.companies,m.partners,'partner')}</div></div><div class="edit-section"><div class="edit-section-head"><strong>사내 부서</strong><div class="section-tools"><span class="count-badge" id="departmentCount">선택 0</span><button class="mini-icon" type="button" data-all="department" data-tip="선택 대상 모두 참석">${icon('check')}</button><button class="mini-icon" type="button" data-clear="department" data-tip="전체 선택 해제">${icon('remove')}</button></div></div><div class="search-box edit-search">${icon('search')}<input id="departmentSearch" type="search" placeholder="부서 검색"></div><div class="target-list" id="departmentRows">${editRows(annualData.options?.departments,m.departments,'department')}</div></div><div class="edit-actions"><button class="icon-btn danger" id="deleteBtn" type="button" data-tip="회차 삭제" aria-label="회차 삭제">${icon('trash')}</button><span class="dirty-dot"></span><span class="action-label" id="dirtyText">변경 없음</span><span class="save-state" id="saveState"></span><span class="grow"></span><button class="icon-btn" id="cancelEdit" type="button" data-tip="취소" aria-label="취소">${icon('x')}</button>${wasFinalized?'':`<button class="icon-btn" id="saveBtn" type="button" data-tip="임시저장" aria-label="임시저장">${icon('save')}</button>`}<button class="icon-btn primary" id="finalizeBtn" type="button" data-tip="${wasFinalized?'변경 저장':'회의 확정'}" aria-label="${wasFinalized?'변경 저장':'회의 확정'}">${wasFinalized?icon('save'):icon('checkCircle')}</button></div></div>`;bindEditRows('partnerRows','partnerCount','partnerSearch');bindEditRows('departmentRows','departmentCount','departmentSearch');$('meetingDate').onchange=markDirty;$('meetingNote').oninput=markDirty;document.querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>setAll(b.dataset.all));document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>clearAll(b.dataset.clear));$('cancelEdit').onclick=()=>{if(editDirty&&!confirm('수정한 내용을 저장하지 않고 취소할까요?'))return;editDirty=false;renderAdminDetail(m,false)};if($('saveBtn'))$('saveBtn').onclick=()=>saveMeeting(m,false);$('finalizeBtn').onclick=()=>saveMeeting(m,true);$('deleteBtn').onclick=()=>deleteMeeting(m)}
function listId(type){return type==='partner'?'partnerRows':'departmentRows'}function countId(type){return type==='partner'?'partnerCount':'departmentCount'}function setAll(type){$(listId(type)).querySelectorAll('.target-row:not(.filtered-out)').forEach(r=>{const c=r.querySelector('.check');if(c.checked)r.querySelector('.att-status').value='present'});markDirty()}function clearAll(type){$(listId(type)).querySelectorAll('.target-row:not(.filtered-out)').forEach(r=>{const c=r.querySelector('.check');c.checked=false;c.dispatchEvent(new Event('change'))});updateSelectedCount(listId(type),countId(type))}
function collectRows(id,key){return [...$(id).querySelectorAll('.target-row')].filter(r=>r.querySelector('.check').checked).map(r=>({[key]:r.dataset.id,attendance_status:r.querySelector('.att-status').value,attendee_position:r.querySelector('.position').value.trim(),attendee_name:r.querySelector('.name').value.trim()}))}
function validate(rows,label,finalize){if(!finalize)return null;if(label==='협력사'&&!rows.length)return '대상 협력사를 1개 이상 선택하세요.';for(const r of rows){if(r.attendance_status==='pending')return `${label}의 참석 또는 불참을 모두 지정하세요.`;if(r.attendance_status==='present'&&(!r.attendee_position||!r.attendee_name))return `참석 ${label}의 직급과 성명을 모두 입력하세요.`}return null}
function updateLocal(d){const i=annualData.meetings.findIndex(x=>x.id===d.id),p=d.partners||[],summary={...d,partner_target_count:p.length,partner_present_count:p.filter(x=>x.attendance_status==='present').length,partner_absent_count:p.filter(x=>x.attendance_status==='absent').length,partner_pending_count:p.filter(x=>x.attendance_status==='pending').length,department_target_count:(d.departments||[]).length};if(i>=0)annualData.meetings[i]={...annualData.meetings[i],...summary};else annualData.meetings.push(summary)}
async function saveMeeting(m,finalize){const partners=collectRows('partnerRows','company_id'),departments=collectRows('departmentRows','department_id'),keepFinalized=m.status==='finalized',shouldFinalize=keepFinalized||finalize,msg=validate(partners,'협력사',shouldFinalize)||validate(departments,'부서',shouldFinalize);if(msg){alert(msg);return}const buttons=[...$('detail').querySelectorAll('.edit-actions button')];buttons.forEach(b=>b.disabled=true);$('saveState').textContent='저장 중...';const started=performance.now();try{const body={meeting_date:$('meetingDate').value,note:$('meetingNote').value.trim(),partners,departments,finalize:shouldFinalize,expected_updated_at:m.updated_at};if(keepFinalized)body.reopen=true;else if(!finalize)body.status='draft';const d=await api(`/api/admin/committee/${encodeURIComponent(m.id)}`,{method:'PATCH',body:JSON.stringify(body)});editDirty=false;detailCache.set(m.id,d.meeting);updateLocal(d.meeting);renderSummary();renderRail();renderMonths();renderAdminDetail(d.meeting,false);const elapsed=Math.round(performance.now()-started),footer=$('detail').querySelector('.detail-footer');if(footer){const s=document.createElement('span');s.className='save-state';s.textContent=`✓ 저장됨 · ${elapsed}ms`;footer.prepend(s)}}catch(e){alert(e.message);renderAdminDetail(m,true)}}
async function deleteMeeting(m){if(!confirm(`${monthOf(m)}월 협의체를 삭제할까요?`))return;try{await api(`/api/admin/committee/${encodeURIComponent(m.id)}`,{method:'DELETE'});editDirty=false;annualData.meetings=annualData.meetings.filter(x=>x.id!==m.id);detailCache.delete(m.id);activeMonth=null;renderSummary();renderRail();renderMonths();$('detail').innerHTML='<div class="detail-empty"><div class="empty-symbol">12</div><strong>월을 선택하세요</strong><span>월별 참석 현황과 담당자 정보를 확인할 수 있습니다.</span></div>'}catch(e){alert(e.message)}}
(async()=>{try{session=JSON.parse(sessionStorage.getItem(KEY)||'null');if(!session){location.replace('/index.html');return}buildYears();const me=await api('/api/me');if(me.auth_state!=='approved')throw Object.assign(new Error('포털 로그인 및 계정 승인이 필요합니다.'),{status:403});currentUser=me.user;$('userLabel').textContent=currentUser.name||currentUser.email||'';$('pageTitle').textContent=currentUser.role==='admin'?'연간 안전보건협의체 관리':'연간 안전보건협의체 참석 현황';$('subtitle').textContent=currentUser.role==='admin'?'연간 운영 상태를 먼저 보고, 월을 선택해 참석자를 조회·수정합니다.':'월별 참석 결과와 연간 협의체 점수를 한 화면에서 확인합니다.';await loadYear()}catch(e){$('months').innerHTML=`<div class="error" style="grid-column:1/-1">${esc(e.message)}</div>`;$('detail').innerHTML=`<div class="error">${esc(e.message)}<br><br><button class="btn" onclick="goHome()">포털로 돌아가기</button></div>`}})();
</script>
