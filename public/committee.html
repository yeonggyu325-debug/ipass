function bindTargets(id,type){$(id).querySelectorAll('.target').forEach(t=>{const c=t.querySelector('.check'),s=t.querySelector('.status-sel');c.onchange=()=>{t.classList.toggle('disabled',!c.checked);s.disabled=!c.checked;if(!c.checked)s.value='pending';updateCount(type);markDirty()};s.onchange=()=>{if(s.value==='present'&&!t.querySelector('.attendee-edit-row'))addAttendeeInput(t);markDirty()};t.querySelectorAll('.attendee-edit-row').forEach(bindPersonRow);t.querySelector('.row-add')?.addEventListener('click',()=>addAttendeeInput(t))})}
function filterTargets(id,q){const v=String(q||'').trim().toLowerCase();$(id).querySelectorAll('.target').forEach(t=>t.classList.toggle('hide',v&&!t.dataset.search.includes(v)))}
function renderEdit(m,focusCompanyId=null,addBlank=false){editDirty=false;$('detail').innerHTML=`<div class="detail-head"><div class="detail-title"><strong>${monthOf(m)}월 협의체 수정</strong><span>${esc(dateText(m.meeting_date))}</span></div></div><div class="edit"><div class="fields"><div class="field"><label>실시일</label><input id="meetingDate" type="date" value="${esc(m.meeting_date||'')}"></div><div class="field"><label>비고</label><textarea id="meetingNote">${esc(m.note||'')}</textarea></div></div><div class="edit-section"><div class="edit-section-head"><strong>협력사</strong><div class="edit-tools"><span class="count" id="partnerCount"></span><button class="mini" id="allPresentPartner" data-tip="선택 전체 참석">${icon('check')}</button></div></div><div class="search edit-search">${icon('search')}<input id="partnerSearch" placeholder="협력사 검색"></div><div class="targets" id="partnerRows">${targetRows(annualData.options?.companies,m.partners,'partner')}</div></div><div class="edit-section"><div class="edit-section-head"><strong>사내부서</strong><div class="edit-tools"><span class="count" id="departmentCount"></span><button class="mini" id="allPresentDepartment" data-tip="선택 전체 참석">${icon('check')}</button></div></div><div class="search edit-search">${icon('search')}<input id="departmentSearch" placeholder="부서 검색"></div><div class="targets" id="departmentRows">${targetRows(annualData.options?.departments,m.departments,'department')}</div></div><div class="actions"><button class="icon danger" id="deleteBtn" data-tip="삭제" aria-label="삭제">${icon('trash')}</button><span class="dirty" id="dirtyState"></span><span class="save-state" id="saveState"></span><span class="grow"></span><button class="icon" id="cancelBtn" data-tip="취소" aria-label="취소">${icon('x')}</button>${m.status==='finalized'?'':`<button class="icon" id="draftBtn" data-tip="임시저장" aria-label="임시저장">${icon('save')}</button>`}<button class="icon primary" id="saveBtn" data-tip="${m.status==='finalized'?'저장':'확정'}" aria-label="저장">${m.status==='finalized'?icon('save'):icon('checkCircle')}</button></div></div>`;bindTargets('partnerRows','partner');bindTargets('departmentRows','department');updateCount('partner');updateCount('department');$('meetingDate').onchange=markDirty;$('meetingNote').oninput=markDirty;$('partnerSearch').oninput=e=>filterTargets('partnerRows',e.target.value);$('departmentSearch').oninput=e=>filterTargets('departmentRows',e.target.value);$('allPresentPartner').onclick=()=>{$('partnerRows').querySelectorAll('.target').forEach(t=>{if(t.querySelector('.check').checked)t.querySelector('.status-sel').value='present'});markDirty()};$('allPresentDepartment').onclick=()=>{$('departmentRows').querySelectorAll('.target').forEach(t=>{if(t.querySelector('.check').checked)t.querySelector('.status-sel').value='present'});markDirty()};$('cancelBtn').onclick=()=>{if(editDirty&&!confirm('수정사항을 취소할까요?'))return;editDirty=false;renderAdminDetail(m)};$('deleteBtn').onclick=()=>deleteMeeting(m);if($('draftBtn'))$('draftBtn').onclick=()=>saveMeeting(m,false);$('saveBtn').onclick=()=>saveMeeting(m,true);if(focusCompanyId){const t=$('partnerRows').querySelector(`[data-id="${CSS.escape(focusCompanyId)}"]`);if(t){const c=t.querySelector('.check');if(!c.checked){c.checked=true;c.dispatchEvent(new Event('change'))}t.querySelector('.status-sel').value='present';if(addBlank)addAttendeeInput(t);t.scrollIntoView({block:'center'})}}}
function collect(id,key){return [...$(id).querySelectorAll('.target')].filter(t=>t.querySelector('.check').checked).map(t=>{const status=t.querySelector('.status-sel').value,attendees=[...t.querySelectorAll('.attendee-edit-row')].map(r=>({position:r.querySelector('.position').value.trim(),name:r.querySelector('.name').value.trim()})).filter(x=>x.position||x.name),packed=packAttendees(attendees);return{[key]:t.dataset.id,attendance_status:status,...packed,attendees}})}
function validate(rows,label,finalize){if(finalize&&label==='협력사'&&!rows.length)return'협력사를 1개 이상 선택하세요.';for(const r of rows){if(finalize&&r.attendance_status==='pending')return`${label} 참석여부를 모두 지정하세요.`;if(r.attendance_status==='present'){if(!r.attendees.length)return`참석 ${label}의 참석자를 입력하세요.`;if(r.attendees.some(a=>!a.position||!a.name))return`참석 ${label}의 직급과 성명을 모두 입력하세요.`}}return null}
function updateLocal(d){const i=annualData.meetings.findIndex(x=>x.id===d.id),p=d.partners||[];const x={...d,partner_target_count:p.length,partner_present_count:p.filter(r=>r.attendance_status==='present').length,partner_absent_count:p.filter(r=>r.attendance_status==='absent').length,partner_pending_count:p.filter(r=>r.attendance_status==='pending').length,department_target_count:(d.departments||[]).length};if(i>=0)annualData.meetings[i]={...annualData.meetings[i],...x};else annualData.meetings.push(x)}
async function saveMeeting(m,finalize){const p=collect('partnerRows','company_id'),d=collect('departmentRows','department_id'),keep=m.status==='finalized',doFinalize=keep||finalize,msg=validate(p,'협력사',doFinalize)||validate(d,'부서',doFinalize);if(msg){alert(msg);return}$('saveState').textContent='저장 중...';const started=performance.now();try{const body={meeting_date:$('meetingDate').value,note:$('meetingNote').value.trim(),partners:p.map(({attendees,...x})=>x),departments:d.map(({attendees,...x})=>x),finalize:doFinalize,expected_updated_at:m.updated_at};if(keep)body.reopen=true;else if(!finalize)body.status='draft';const res=await api(`/api/admin/committee/${encodeURIComponent(m.id)}`,{method:'PATCH',body:JSON.stringify(body)});editDirty=false;detailCache.set(m.id,res.meeting);updateLocal(res.meeting);renderLatest();renderNav();renderCards();renderAnnualAttendance();renderAdminDetail(res.meeting);const el=$('detail').querySelector('.detail-body');if(el){const s=document.createElement('div');s.className='save-state';s.style.marginTop='8px';s.textContent=`✓ 저장 ${Math.round(performance.now()-started)}ms`;el.append(s)}}catch(e){alert(e.message);renderEdit(m)}}
async function deleteMeeting(m){if(!confirm(`${monthOf(m)}월 협의체를 삭제할까요?`))return;try{await api(`/api/admin/committee/${encodeURIComponent(m.id)}`,{method:'DELETE'});editDirty=false;annualData.meetings=annualData.meetings.filter(x=>x.id!==m.id);detailCache.delete(m.id);activeMonth=null;renderLatest();renderNav();renderCards();renderAnnualAttendance();$('detail').innerHTML='<div class="detail-empty">월을 선택하세요.</div>'}catch(e){alert(e.message)}}
(async()=>{try{session=JSON.parse(sessionStorage.getItem(KEY)||'null');if(!session){location.replace('/index.html');return}buildYears();const me=await api('/api/me');if(me.auth_state!=='approved')throw Object.assign(new Error('로그인 또는 계정 승인이 필요합니다.'),{status:403});currentUser=me.user;$('userLabel').textContent=currentUser.name||currentUser.email||'';await loadYear()}catch(e){$('months').innerHTML=`<div class="error" style="grid-column:1/-1">${esc(e.message)}</div>`;$('detail').innerHTML=`<div class="error">${esc(e.message)}</div>`}})();
</script>
</body>
</html>
