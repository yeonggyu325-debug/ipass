<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>안전보건협의체 | Hniruja EHS</title>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
<style>
:root{
  --primary:#2878d4;--primary-strong:#1f69bd;--primary-soft:#f0f6fc;
  --ink:#202b35;--text:#46545f;--muted:#84909a;--muted-2:#a1aab1;
  --line:#e6eaed;--line-soft:#eef1f3;--page:#f6f8fa;--surface:#fff;
  --green:#27805c;--green-bg:#edf8f3;--red:#bf5049;--red-bg:#fff1ef;
  --amber:#9a6921;--amber-bg:#fff7e7;--gray-bg:#f2f4f6;
  --shadow:0 12px 36px rgba(30,46,59,.055);
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",sans-serif;background:var(--page);color:var(--ink);letter-spacing:-.02em}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}

/* header */
.header{height:68px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;backdrop-filter:blur(12px)}
.header-inner{width:min(1320px,calc(100% - 48px));height:100%;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:12px;border:0;background:none;padding:0;color:var(--ink);font-weight:760}.brand img{height:27px;width:auto}.brand-divider{width:1px;height:18px;background:var(--line)}.brand-sub{font-size:11px;color:#87939c;font-weight:650}
.header-actions{display:flex;align-items:center;gap:9px}.user-label{font-size:11px;color:var(--muted);max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{height:38px;padding:0 13px;border:1px solid #dce2e6;border-radius:8px;background:#fff;color:#53616b;font-size:11.5px;font-weight:700;transition:.14s ease}.btn:hover{background:#f8fafb;border-color:#cfd8de}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary-strong)}.btn.danger{color:#b94c46;border-color:#efd3d0;background:#fff}.btn.ghost{border-color:transparent;background:transparent}.btn:disabled{opacity:.48;cursor:not-allowed}

/* frame */
.shell{width:min(1320px,calc(100% - 48px));margin:0 auto;padding:32px 0 56px}.breadcrumb{color:#9aa4ac;font-size:10.5px;margin-bottom:14px}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:22px}.hero h1{margin:0;font-size:27px;line-height:1.2;letter-spacing:-.045em}.hero p{margin:8px 0 0;color:var(--muted);font-size:12px;line-height:1.55}.hero-actions{display:flex;align-items:center;gap:8px}.year-select{height:40px;min-width:110px;border:1px solid #dce2e6;border-radius:8px;background:#fff;padding:0 11px;color:#46545f;font-size:12px;font-weight:700;outline:none}

/* summary */
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}.metric{background:#fff;border:1px solid var(--line);border-radius:11px;padding:17px 18px;min-height:104px}.metric-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.metric-label{font-size:10.5px;color:#7e8b95;font-weight:700}.metric-icon{width:27px;height:27px;border-radius:8px;background:#f4f7f9;display:grid;place-items:center;color:#6f8190;font-size:11px;font-weight:800}.metric-value{margin-top:10px;font-size:24px;font-weight:790;letter-spacing:-.045em}.metric-meta{margin-top:4px;font-size:9.5px;color:#9ca5ac}
.progress-card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:15px 18px;margin-bottom:14px}.progress-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.progress-head strong{font-size:12px}.progress-head span{font-size:10px;color:var(--muted)}.month-rail{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:7px}.rail-item{min-width:0}.rail-bar{height:6px;border-radius:999px;background:#e9edf0}.rail-bar.finalized{background:#4b9a79}.rail-bar.draft{background:#d5a153}.rail-bar.active{box-shadow:0 0 0 2px rgba(40,120,212,.13)}.rail-label{margin-top:6px;text-align:center;font-size:9px;color:#929ca4}

/* workspace */
.workspace{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(370px,.85fr);gap:14px;align-items:start}.board,.detail-panel{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.board{overflow:hidden}.board-head{min-height:58px;padding:0 17px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line-soft)}.board-title strong{display:block;font-size:13.5px}.board-title span{display:block;margin-top:4px;font-size:10px;color:#939da5}.legend{display:flex;align-items:center;gap:11px;flex-wrap:wrap}.legend span{display:flex;align-items:center;gap:5px;color:#87939c;font-size:9.5px}.legend i{width:7px;height:7px;border-radius:50%;background:#cfd5da}.legend .l-final i{background:#4b9a79}.legend .l-draft i{background:#d5a153}.months{padding:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.month-card{min-height:162px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:14px;text-align:left;display:flex;flex-direction:column;position:relative;transition:.16s ease}.month-card:hover{border-color:#cbd7e0;box-shadow:0 8px 22px rgba(31,52,68,.06);transform:translateY(-1px)}.month-card.active{border-color:#75a9da;box-shadow:0 0 0 2px rgba(40,120,212,.09)}.month-card.empty{background:#fbfcfd;border-style:dashed}.month-card.empty:hover{background:#f8fbfd}.month-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.month-num{font-size:20px;font-weight:790;letter-spacing:-.045em}.status{display:inline-flex;align-items:center;height:23px;padding:0 7px;border-radius:6px;font-size:9.5px;font-weight:780}.status.finalized,.status.present{background:var(--green-bg);color:var(--green)}.status.draft{background:var(--amber-bg);color:var(--amber)}.status.absent{background:var(--red-bg);color:var(--red)}.status.empty{background:var(--gray-bg);color:#879198}.month-date{margin-top:9px;font-size:10.5px;color:#89959e}.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:12px}.mini-stat{padding:7px 5px;border-radius:7px;background:#f7f9fa;text-align:center}.mini-stat b{display:block;font-size:12px;color:#45525c}.mini-stat span{display:block;margin-top:2px;font-size:8.5px;color:#9aa4ab}.attendee-preview{margin-top:auto;padding-top:11px;border-top:1px solid #f0f2f4;min-height:39px}.attendee-line{display:flex;align-items:center;gap:6px;min-width:0}.avatar-stack{display:flex;align-items:center}.avatar{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#edf3f8;color:#4d7595;border:2px solid #fff;font-size:8px;font-weight:800;margin-left:-5px}.avatar:first-child{margin-left:0}.preview-text{min-width:0;font-size:9.5px;color:#7b8790;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty-copy{margin:auto 0;color:#9fa8ae;font-size:10.5px;line-height:1.5}.create-link{margin-top:auto;color:#3979ad;font-size:10px;font-weight:750}.partner-result{margin-top:12px;display:flex;align-items:center;justify-content:space-between;color:#7d8992;font-size:10px}

/* right detail */
.detail-panel{position:sticky;top:82px;overflow:hidden;min-height:560px}.detail-empty{height:560px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:28px}.empty-symbol{width:50px;height:50px;border-radius:14px;background:#f3f6f8;color:#8b99a4;display:grid;place-items:center;font-size:18px;font-weight:800}.detail-empty strong{margin-top:14px;font-size:14px}.detail-empty span{margin-top:6px;color:#96a0a8;font-size:10.5px;line-height:1.6}.detail-head{padding:17px;border-bottom:1px solid var(--line-soft)}.detail-head-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.detail-heading strong{display:block;font-size:15px;letter-spacing:-.025em}.detail-heading span{display:block;margin-top:5px;font-size:10px;color:#929ca4}.detail-head-actions{display:flex;align-items:center;gap:6px}.detail-body{padding:16px}.meta-strip{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:15px}.meta-item{padding:10px 11px;border-right:1px solid var(--line-soft)}.meta-item:last-child{border-right:0}.meta-item span{display:block;color:#929ca4;font-size:8.5px}.meta-item b{display:block;margin-top:4px;color:#43515b;font-size:11px}.tabs{height:39px;display:flex;align-items:center;gap:2px;padding:3px;background:#f4f6f8;border-radius:8px;margin-bottom:11px}.tab{flex:1;height:33px;border:0;border-radius:6px;background:transparent;color:#7d8992;font-size:10.5px;font-weight:700}.tab.active{background:#fff;color:#315f83;box-shadow:0 1px 4px rgba(37,54,67,.07)}.people-list{border:1px solid var(--line);border-radius:9px;overflow:hidden}.person-row{min-height:49px;padding:8px 10px;display:grid;grid-template-columns:minmax(0,1fr) 54px 76px;gap:8px;align-items:center;border-bottom:1px solid var(--line-soft)}.person-row:last-child{border-bottom:0}.person-org{min-width:0}.person-org strong{display:block;font-size:10.8px;color:#46535d;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.person-org span{display:block;margin-top:3px;font-size:9px;color:#939da4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.state-text{font-size:9.5px;font-weight:780}.state-text.present{color:var(--green)}.state-text.absent{color:var(--red)}.state-text.pending{color:#9aa3aa}.person-name{text-align:right;font-size:10px;color:#6f7b84;white-space:nowrap}.list-empty{padding:28px;text-align:center;color:#9da6ad;font-size:10.5px}.note-box{margin-top:11px;padding:11px 12px;border-radius:8px;background:#f7f9fa;color:#74818b;font-size:10px;line-height:1.55}.detail-footer{display:flex;align-items:center;gap:7px;margin-top:14px}.detail-footer .grow{flex:1}.save-state{color:#4b8066;font-size:9.5px;font-weight:750}

/* edit mode */
.edit-shell{padding:16px}.edit-notice{padding:10px 11px;border:1px solid #dce8f2;border-radius:8px;background:#f6faff;color:#5a7388;font-size:9.8px;line-height:1.55;margin-bottom:13px}.fields{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;margin-bottom:16px}.field label{display:block;margin-bottom:6px;color:#78858f;font-size:9.5px;font-weight:720}.field input,.field textarea{width:100%;border:1px solid #dce2e6;border-radius:7px;background:#fff;color:#46545f;outline:none}.field input{height:38px;padding:0 9px}.field textarea{min-height:67px;padding:9px;resize:vertical}.field input:focus,.field textarea:focus,.target-row select:focus,.target-row input:focus{border-color:#80acd2;box-shadow:0 0 0 2px rgba(40,120,212,.08)}.edit-section{margin-top:17px}.edit-section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:8px}.edit-section-head strong{font-size:11.5px}.edit-section-head span{font-size:8.8px;color:#9aa4ab}.quick-actions{display:flex;gap:5px;margin-bottom:7px;justify-content:flex-end}.quick-actions .btn{height:31px;font-size:9.5px;padding:0 9px}.target-list{border:1px solid var(--line);border-radius:9px;overflow:hidden;max-height:310px;overflow-y:auto}.target-row{display:grid;grid-template-columns:minmax(125px,1fr) 74px 72px 76px;gap:6px;align-items:center;min-height:45px;padding:6px 8px;border-bottom:1px solid var(--line-soft)}.target-row:last-child{border-bottom:0}.target-check{display:flex;align-items:center;gap:6px;min-width:0;color:#4a5862;font-size:9.8px;font-weight:650}.target-check input{width:14px;height:14px;accent-color:var(--primary);flex:0 0 auto}.target-check span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.target-row select,.target-row input[type=text]{width:100%;height:31px;border:1px solid #e0e5e8;border-radius:6px;background:#fff;padding:0 6px;color:#53616b;font-size:9.5px;outline:none}.target-row select:disabled,.target-row input:disabled{opacity:.44;background:#f5f6f7}.edit-actions{display:flex;align-items:center;gap:6px;margin-top:14px}.edit-actions .grow{flex:1}

.loading,.error{padding:34px;text-align:center;color:#87939c;font-size:11px}.error{color:var(--red)}

@media(max-width:1080px){.workspace{grid-template-columns:1fr}.detail-panel{position:static;min-height:0}.detail-empty{height:300px}.months{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:820px){.header-inner,.shell{width:calc(100% - 28px)}.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.months{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{align-items:flex-start;flex-direction:column}.hero-actions{width:100%;justify-content:space-between}.user-label{display:none}.month-rail{gap:4px}.rail-label{font-size:8px}}
@media(max-width:560px){.header{height:62px}.header-inner,.shell{width:calc(100% - 22px)}.brand-sub,.brand-divider{display:none}.shell{padding-top:22px}.hero h1{font-size:23px}.summary{grid-template-columns:1fr 1fr;gap:7px}.metric{padding:14px;min-height:94px}.metric-value{font-size:20px}.progress-card{overflow-x:auto}.month-rail{min-width:600px}.months{grid-template-columns:repeat(2,minmax(0,1fr));padding:8px;gap:7px}.month-card{min-height:150px;padding:12px}.board-head{align-items:flex-start;flex-direction:column;padding:13px 14px}.legend{gap:8px}.detail-panel{border-radius:11px}.fields{grid-template-columns:1fr}.target-row{grid-template-columns:minmax(0,1fr) 72px}.target-row .person-field{grid-column:1/-1}.edit-actions{flex-wrap:wrap}.edit-actions .grow{display:none}.edit-actions .btn{flex:1}.person-row{grid-template-columns:minmax(0,1fr) 48px 66px}}
</style>
</head>
<body>
<header class="header"><div class="header-inner">
  <button class="brand" id="brandHome" type="button"><img src="/hniruja-logo.png" alt="Hniruja"><span>협력사 EHS 포털</span><span class="brand-divider"></span><span class="brand-sub">안전보건협의체</span></button>
  <div class="header-actions"><span class="user-label" id="userLabel"></span><button class="btn" id="homeBtn" type="button">포털 홈</button></div>
</div></header>

<main class="shell">
  <div class="breadcrumb">홈 · EHS 업무 · 안전보건협의체</div>
  <section class="hero">
    <div><h1 id="pageTitle">연간 안전보건협의체 관리</h1><p id="subtitle">연간 운영 상태와 월별 참석자를 한 화면에서 관리합니다.</p></div>
    <div class="hero-actions"><select id="year" class="year-select" aria-label="연도"></select><button class="btn" id="refreshBtn" type="button">새로고침</button></div>
  </section>

  <div id="summary" class="summary"></div>
  <section class="progress-card"><div class="progress-head"><strong id="progressTitle">연간 운영 흐름</strong><span id="progressMeta"></span></div><div id="monthRail" class="month-rail"></div></section>

  <section class="workspace">
    <div class="board">
      <div class="board-head"><div class="board-title"><strong id="boardTitle">월별 협의체</strong><span id="boardMeta">월을 선택하면 상세 참석자를 확인할 수 있습니다.</span></div><div class="legend"><span class="l-final"><i></i>확정</span><span class="l-draft"><i></i>작성중</span><span><i></i>미등록</span></div></div>
      <div id="months" class="months"></div>
    </div>
    <aside id="detail" class="detail-panel"><div class="detail-empty"><div class="empty-symbol">12</div><strong>월을 선택하세요</strong><span>월별 참석 현황과 담당자 정보를<br>오른쪽에서 빠르게 확인할 수 있습니다.</span></div></aside>
  </section>
</main>

<script>
const API_ORIGIN=location.hostname==='ipass.i-pass-eval.workers.dev'?'':'https://ipass.i-pass-eval.workers.dev';
const FIREBASE_API_KEY='AIzaSyC0s7buQaayKr84QA_wFNyF6rcs6w1-IoU';
const KEY='ipass.session.v10';
let session=null,currentUser=null,annualData=null,activeMonth=null,activeTab='partner',editMode=false;
const detailCache=new Map();
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');

function goHome(){try{if(document.referrer){const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return}}}catch{}location.replace('/index.html')}
$('homeBtn').onclick=goHome;$('brandHome').onclick=goHome;
async function refreshToken(){const body=new URLSearchParams({grant_type:'refresh_token',refresh_token:session.refreshToken});const r=await fetch(`https://securetoken.googleapis.com/v1/token?key=${encodeURIComponent(FIREBASE_API_KEY)}`,{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body});const d=await r.json();if(!r.ok)throw Object.assign(new Error('로그인 세션이 만료되었습니다.'),{status:401});session.idToken=d.id_token;session.refreshToken=d.refresh_token||session.refreshToken;session.expiresAt=Date.now()+Number(d.expires_in||3600)*1000;sessionStorage.setItem(KEY,JSON.stringify(session));return session.idToken}
async function api(path,opt={},retry=true){if(!session)throw Object.assign(new Error('로그인이 필요합니다.'),{status:401});const t=Date.now()>Number(session.expiresAt||0)-60000?await refreshToken():session.idToken;let r;try{r=await fetch(API_ORIGIN+path,{...opt,headers:{Accept:'application/json',Authorization:`Bearer ${t}`,...(opt.body?{'content-type':'application/json'}:{}),...(opt.headers||{})}})}catch{throw new Error('i-PaSS API에 연결하지 못했습니다.')}if(r.status===401&&retry){await refreshToken();return api(path,opt,false)}const d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||`HTTP ${r.status}`),{status:r.status,data:d});return d}

function buildYears(){const s=$('year'),now=new Date().getFullYear();for(let y=now+1;y>=now-4;y--){const o=document.createElement('option');o.value=String(y);o.textContent=`${y}년`;if(y===now)o.selected=true;s.append(o)}s.onchange=()=>loadYear(true)}
function monthOf(m){return Number(m?.meeting_month||String(m?.meeting_date||'').slice(5,7)||0)}
function meetingByMonth(month){return (annualData?.meetings||[]).find(m=>monthOf(m)===month)||null}
function statusBadge(status){if(status==='finalized')return '<span class="status finalized">확정</span>';if(status==='draft')return '<span class="status draft">작성중</span>';if(status==='present')return '<span class="status present">참석</span>';if(status==='absent')return '<span class="status absent">불참</span>';return '<span class="status empty">미등록</span>'}
function initials(name){const s=String(name||'').trim();return s?s.slice(-1):'·'}
function dateShort(v){return String(v||'').replaceAll('-','.').slice(5)}

function renderSummary(){const meetings=annualData?.meetings||[];if(currentUser.role==='partner'){const s=annualData?.summary||{};$('summary').innerHTML=`
  <div class="metric"><div class="metric-top"><span class="metric-label">협의체 점수</span><span class="metric-icon">S</span></div><div class="metric-value">${Number(s.score??10)} / 10</div><div class="metric-meta">불참 1회당 -3점</div></div>
  <div class="metric"><div class="metric-top"><span class="metric-label">대상 회차</span><span class="metric-icon">M</span></div><div class="metric-value">${Number(s.finalized_meeting_count||0)}회</div><div class="metric-meta">확정된 나의 대상 회차</div></div>
  <div class="metric"><div class="metric-top"><span class="metric-label">참석</span><span class="metric-icon">P</span></div><div class="metric-value">${Number(s.present_count||0)}회</div><div class="metric-meta">연간 참석 누계</div></div>
  <div class="metric"><div class="metric-top"><span class="metric-label">불참</span><span class="metric-icon">A</span></div><div class="metric-value">${Number(s.absence_count||0)}회</div><div class="metric-meta">${Number(s.absence_count||0)?`-${Number(s.absence_count||0)*3}점 반영`:'감점 없음'}</div></div>`;return}
const finalized=meetings.filter(m=>m.status==='finalized'),present=finalized.reduce((n,m)=>n+Number(m.partner_present_count||0),0),absent=finalized.reduce((n,m)=>n+Number(m.partner_absent_count||0),0);$('summary').innerHTML=`
  <div class="metric"><div class="metric-top"><span class="metric-label">운영 등록</span><span class="metric-icon">M</span></div><div class="metric-value">${meetings.length} / 12</div><div class="metric-meta">월별 협의체 등록</div></div>
  <div class="metric"><div class="metric-top"><span class="metric-label">확정 회차</span><span class="metric-icon">C</span></div><div class="metric-value">${finalized.length}회</div><div class="metric-meta">회의 확정 완료</div></div>
  <div class="metric"><div class="metric-top"><span class="metric-label">협력사 참석</span><span class="metric-icon">P</span></div><div class="metric-value">${present}건</div><div class="metric-meta">확정 회차 참석 누계</div></div>
  <div class="metric"><div class="metric-top"><span class="metric-label">협력사 불참</span><span class="metric-icon">A</span></div><div class="metric-value">${absent}건</div><div class="metric-meta">i-PaSS 감점 대상</div></div>`}

function renderRail(){const year=$('year').value;$('progressTitle').textContent=`${year}년 운영 흐름`;$('progressMeta').textContent=currentUser.role==='admin'?'확정 여부를 월 단위로 빠르게 확인합니다.':'나의 확정 참석결과 기준입니다.';$('monthRail').innerHTML=Array.from({length:12},(_,i)=>i+1).map(month=>{const m=meetingByMonth(month),st=currentUser.role==='partner'?(m?.attendance_status==='present'||m?.attendance_status==='absent'?'finalized':''):m?.status||'';return `<div class="rail-item"><div class="rail-bar ${st} ${activeMonth===month?'active':''}"></div><div class="rail-label">${month}월</div></div>`}).join('')}

function previewFor(m){if(!m)return '';if(currentUser.role==='partner'){if(m.attendance_status==='present')return `<div class="attendee-line"><div class="avatar-stack"><span class="avatar">${esc(initials(m.attendee_name))}</span></div><span class="preview-text">${esc(`${m.attendee_position||''} ${m.attendee_name||''}`.trim()||'참석자')}</span></div>`;return `<span class="preview-text">불참으로 확정되었습니다.</span>`}const d=detailCache.get(m.id);if(!d)return `<span class="preview-text">월을 열어 참석자 명단 확인</span>`;const people=(d.partners||[]).filter(x=>x.attendance_status==='present').slice(0,3);if(!people.length)return `<span class="preview-text">참석자로 기록된 협력사 없음</span>`;return `<div class="attendee-line"><div class="avatar-stack">${people.map(x=>`<span class="avatar">${esc(initials(x.attendee_name||x.company_name))}</span>`).join('')}</div><span class="preview-text">${esc(people.map(x=>x.attendee_name||x.company_name).join(' · '))}${(d.partners||[]).filter(x=>x.attendance_status==='present').length>3?' 외':''}</span></div>`}

function renderMonths(){const isAdmin=currentUser.role==='admin';$('boardTitle').textContent=`${$('year').value}년 월별 협의체`;$('boardMeta').textContent=isAdmin?'월을 선택해 조회하고, 필요할 때만 편집 모드로 전환하세요.':'월별 확정 참석 결과를 선택해 확인하세요.';$('months').innerHTML=Array.from({length:12},(_,i)=>i+1).map(month=>{const m=meetingByMonth(month),active=activeMonth===month?' active':'';if(!m)return `<button class="month-card empty${active}" type="button" data-month="${month}"><div class="month-head"><span class="month-num">${month}월</span>${statusBadge('empty')}</div><div class="empty-copy">${isAdmin?'아직 등록된 회차가 없습니다.':'확정된 대상 회차가 없습니다.'}</div>${isAdmin?'<div class="create-link">+ 이 달 협의체 등록</div>':''}</button>`;if(!isAdmin)return `<button class="month-card${active}" type="button" data-month="${month}"><div class="month-head"><span class="month-num">${month}월</span>${statusBadge(m.attendance_status)}</div><div class="month-date">${esc(dateShort(m.meeting_date))}</div><div class="partner-result"><span>${m.attendance_status==='present'?'참석 완료':'불참'}</span><span>${esc(m.attendee_position||'')}</span></div><div class="attendee-preview">${previewFor(m)}</div></button>`;return `<button class="month-card${active}" type="button" data-month="${month}"><div class="month-head"><span class="month-num">${month}월</span>${statusBadge(m.status)}</div><div class="month-date">${esc(dateShort(m.meeting_date))}</div><div class="mini-stats"><div class="mini-stat"><b>${Number(m.partner_target_count||0)}</b><span>대상</span></div><div class="mini-stat"><b>${Number(m.partner_present_count||0)}</b><span>참석</span></div><div class="mini-stat"><b>${Number(m.partner_absent_count||0)}</b><span>불참</span></div></div><div class="attendee-preview">${previewFor(m)}</div></button>`}).join('');$('months').querySelectorAll('.month-card').forEach(b=>b.onclick=()=>openMonth(Number(b.dataset.month)))}

async function loadYear(force=false){activeMonth=null;activeTab='partner';editMode=false;if(force)detailCache.clear();$('detail').innerHTML='<div class="detail-empty"><div class="empty-symbol">12</div><strong>불러오는 중...</strong><span>연간 협의체 현황을 확인하고 있습니다.</span></div>';$('months').innerHTML='<div class="loading" style="grid-column:1/-1">연간 협의체 현황을 불러오는 중...</div>';try{annualData=await api(`/api/committee?year=${encodeURIComponent($('year').value)}`);renderSummary();renderRail();renderMonths();const now=new Date(),preferred=meetingByMonth(now.getMonth()+1)||[...(annualData.meetings||[])].sort((a,b)=>monthOf(b)-monthOf(a))[0];if(preferred)await openMonth(monthOf(preferred));else $('detail').innerHTML='<div class="detail-empty"><div class="empty-symbol">+</div><strong>아직 등록된 협의체가 없습니다</strong><span>왼쪽에서 원하는 월을 선택해<br>첫 회차를 등록할 수 있습니다.</span></div>'}catch(e){$('months').innerHTML=`<div class="error" style="grid-column:1/-1">${esc(e.message)}</div>`;$('detail').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
$('refreshBtn').onclick=()=>loadYear(true);

async function openMonth(month){activeMonth=month;activeTab='partner';editMode=false;renderRail();renderMonths();const m=meetingByMonth(month);if(!m){if(currentUser.role==='admin')renderCreate(month);else renderPartnerDetail(month,null);return}if(currentUser.role==='partner'){renderPartnerDetail(month,m);return}await loadAdminDetail(m)}

function renderPartnerDetail(month,m){if(!m){$('detail').innerHTML=`<div class="detail-empty"><div class="empty-symbol">${month}</div><strong>${month}월 대상 회차 없음</strong><span>확정된 협의체 대상에 포함되지 않았습니다.</span></div>`;return}$('detail').innerHTML=`<div class="detail-head"><div class="detail-head-top"><div class="detail-heading"><strong>${month}월 참석 결과</strong><span>${esc(m.meeting_date||'')}</span></div>${statusBadge(m.attendance_status)}</div></div><div class="detail-body"><div class="meta-strip"><div class="meta-item"><span>참석 상태</span><b>${m.attendance_status==='present'?'참석':'불참'}</b></div><div class="meta-item"><span>직급</span><b>${esc(m.attendee_position||'-')}</b></div><div class="meta-item"><span>성명</span><b>${esc(m.attendee_name||'-')}</b></div></div>${m.note?`<div class="note-box">${esc(m.note)}</div>`:''}</div>`}

function renderCreate(month){const year=Number($('year').value),now=new Date(),day=(year===now.getFullYear()&&month===now.getMonth()+1)?String(now.getDate()).padStart(2,'0'):'01',mm=String(month).padStart(2,'0');$('detail').innerHTML=`<div class="detail-head"><div class="detail-head-top"><div class="detail-heading"><strong>${month}월 협의체 등록</strong><span>새 월별 회차를 생성합니다.</span></div>${statusBadge('empty')}</div></div><div class="edit-shell"><div class="edit-notice">월별 협의체는 1개만 생성됩니다. 생성 후 대상 협력사와 사내 부서를 선택할 수 있습니다.</div><div class="fields"><div class="field"><label>개최일</label><input id="createDate" type="date" value="${year}-${mm}-${day}"></div><div class="field"><label>비고</label><textarea id="createNote" placeholder="필요한 메모만 입력하세요."></textarea></div></div><div class="edit-actions"><span class="grow"></span><button class="btn primary" id="createBtn" type="button">${month}월 협의체 생성</button></div></div>`;$('createBtn').onclick=()=>createMeeting(month)}
async function createMeeting(month){const btn=$('createBtn'),year=Number($('year').value);btn.disabled=true;btn.textContent='생성 중...';try{const d=await api('/api/admin/committee',{method:'POST',body:JSON.stringify({year,month,meeting_date:$('createDate').value,note:$('createNote').value.trim()})});annualData.meetings=[...(annualData.meetings||[]),{...d.meeting,partner_target_count:0,partner_present_count:0,partner_absent_count:0,partner_pending_count:0,department_target_count:0}];detailCache.set(d.meeting.id,d.meeting);renderSummary();renderRail();renderMonths();renderAdminDetail(d.meeting,false)}catch(e){alert(e.message);btn.disabled=false;btn.textContent=`${month}월 협의체 생성`}}

async function loadAdminDetail(m){$('detail').innerHTML='<div class="loading">참석자 명단을 불러오는 중...</div>';try{let d=detailCache.get(m.id);if(!d){d=(await api(`/api/admin/committee/${encodeURIComponent(m.id)}`)).meeting;detailCache.set(m.id,d);renderMonths()}renderAdminDetail(d,false)}catch(e){$('detail').innerHTML=`<div class="error">${esc(e.message)}</div>`}}

function peopleRows(rows,type){if(!rows?.length)return '<div class="list-empty">등록된 대상이 없습니다.</div>';return rows.map(r=>{const org=type==='partner'?r.company_name:r.department_name,person=`${r.attendee_position||''} ${r.attendee_name||''}`.trim();return `<div class="person-row"><div class="person-org"><strong>${esc(org||'-')}</strong><span>${r.attendance_status==='present'?(person?esc(person):'참석자 정보 없음'):r.attendance_status==='absent'?'불참':'상태 미정'}</span></div><span class="state-text ${esc(r.attendance_status||'pending')}">${r.attendance_status==='present'?'참석':r.attendance_status==='absent'?'불참':'미정'}</span><span class="person-name">${r.attendance_status==='present'?esc(r.attendee_name||'-'):'-'}</span></div>`}).join('')}
function renderViewList(m){const rows=activeTab==='partner'?(m.partners||[]):(m.departments||[]);$('peopleArea').innerHTML=peopleRows(rows,activeTab);document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===activeTab))}
function switchTab(tab,m){activeTab=tab;renderViewList(m)}

function renderAdminDetail(m,editing=false){editMode=editing;const month=monthOf(m),locked=m.status==='finalized';if(editing){renderEdit(m);return}const p=m.partners||[],present=p.filter(x=>x.attendance_status==='present').length,absent=p.filter(x=>x.attendance_status==='absent').length;$('detail').innerHTML=`<div class="detail-head"><div class="detail-head-top"><div class="detail-heading"><strong>${month}월 안전보건협의체</strong><span>${esc(m.meeting_date||'')} · 대상 협력사 ${p.length}개사</span></div><div class="detail-head-actions">${statusBadge(m.status)}<button class="btn" id="editBtn" type="button">${locked?'재오픈':'편집'}</button></div></div></div><div class="detail-body"><div class="meta-strip"><div class="meta-item"><span>대상</span><b>${p.length}개사</b></div><div class="meta-item"><span>참석</span><b>${present}개사</b></div><div class="meta-item"><span>불참</span><b>${absent}개사</b></div></div><div class="tabs"><button class="tab ${activeTab==='partner'?'active':''}" data-tab="partner" type="button">협력사 ${p.length}</button><button class="tab ${activeTab==='department'?'active':''}" data-tab="department" type="button">사내부서 ${(m.departments||[]).length}</button></div><div id="peopleArea" class="people-list"></div>${m.note?`<div class="note-box">${esc(m.note)}</div>`:''}<div class="detail-footer"><span class="grow"></span>${!locked?'<button class="btn danger" id="deleteViewBtn" type="button">회차 삭제</button>':''}</div></div>`;renderViewList(m);document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchTab(t.dataset.tab,m));$('editBtn').onclick=()=>locked?reopenMeeting(m):renderAdminDetail(m,true);if($('deleteViewBtn'))$('deleteViewBtn').onclick=()=>deleteMeeting(m)}

async function reopenMeeting(m){if(!confirm('확정된 회차를 재오픈하여 수정할까요?'))return;try{const d=await api(`/api/admin/committee/${encodeURIComponent(m.id)}`,{method:'PATCH',body:JSON.stringify({meeting_date:m.meeting_date,note:m.note||'',partners:m.partners||[],departments:m.departments||[],reopen:true,status:'draft',expected_updated_at:m.updated_at})});detailCache.set(m.id,d.meeting);updateLocal(d.meeting);renderSummary();renderRail();renderMonths();renderAdminDetail(d.meeting,true)}catch(e){alert(e.message)}}

function statusOptions(v){return [['pending','미정'],['present','참석'],['absent','불참']].map(([x,t])=>`<option value="${x}" ${x===v?'selected':''}>${t}</option>`).join('')}
function editRows(options,selected,type){const key=type==='partner'?'company_id':'department_id',nameKey=type==='partner'?'company_name':'department_name',map=new Map((selected||[]).map(r=>[r[key],r]));return (options||[]).map(o=>{const r=map.get(o.id),checked=!!r;return `<div class="target-row" data-id="${esc(o.id)}"><label class="target-check"><input class="check" type="checkbox" ${checked?'checked':''}><span>${esc(o[nameKey])}</span></label><select class="att-status" ${checked?'':'disabled'}>${statusOptions(r?.attendance_status||'pending')}</select><input class="position person-field" type="text" placeholder="직급" value="${esc(r?.attendee_position||'')}" ${checked?'':'disabled'}><input class="name person-field" type="text" placeholder="성명" value="${esc(r?.attendee_name||'')}" ${checked?'':'disabled'}></div>`}).join('')}
function bindEditRows(id){$(id).querySelectorAll('.target-row').forEach(row=>{const c=row.querySelector('.check'),s=row.querySelector('.att-status'),inputs=[...row.querySelectorAll('.person-field')];const sync=()=>{s.disabled=!c.checked;inputs.forEach(i=>i.disabled=!c.checked);if(!c.checked){s.value='pending';inputs.forEach(i=>i.value='')}};c.onchange=sync})}
function renderEdit(m){const month=monthOf(m);$('detail').innerHTML=`<div class="detail-head"><div class="detail-head-top"><div class="detail-heading"><strong>${month}월 협의체 편집</strong><span>조회 화면과 입력 화면을 분리해 필요한 순간에만 수정합니다.</span></div>${statusBadge(m.status)}</div></div><div class="edit-shell"><div class="fields"><div class="field"><label>개최일</label><input id="meetingDate" type="date" value="${esc(m.meeting_date||'')}"></div><div class="field"><label>비고</label><textarea id="meetingNote" placeholder="필요한 메모만 입력하세요.">${esc(m.note||'')}</textarea></div></div><div class="edit-section"><div class="edit-section-head"><strong>대상 협력사</strong><span>참석 시 직급·성명 필수</span></div><div class="quick-actions"><button class="btn" type="button" data-all="partner">선택 대상 모두 참석</button><button class="btn" type="button" data-clear="partner">전체 선택 해제</button></div><div class="target-list" id="partnerRows">${editRows(annualData.options?.companies,m.partners,'partner')}</div></div><div class="edit-section"><div class="edit-section-head"><strong>사내 부서</strong><span>점수에는 반영되지 않음</span></div><div class="quick-actions"><button class="btn" type="button" data-all="department">선택 대상 모두 참석</button><button class="btn" type="button" data-clear="department">전체 선택 해제</button></div><div class="target-list" id="departmentRows">${editRows(annualData.options?.departments,m.departments,'department')}</div></div><div class="edit-actions"><button class="btn danger" id="deleteBtn" type="button">회차 삭제</button><span class="save-state" id="saveState"></span><span class="grow"></span><button class="btn" id="cancelEdit" type="button">취소</button><button class="btn" id="saveBtn" type="button">임시저장</button><button class="btn primary" id="finalizeBtn" type="button">회의 확정</button></div></div>`;bindEditRows('partnerRows');bindEditRows('departmentRows');document.querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>setAll(b.dataset.all));document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>clearAll(b.dataset.clear));$('cancelEdit').onclick=()=>renderAdminDetail(m,false);$('saveBtn').onclick=()=>saveMeeting(m,false);$('finalizeBtn').onclick=()=>saveMeeting(m,true);$('deleteBtn').onclick=()=>deleteMeeting(m)}
function listId(type){return type==='partner'?'partnerRows':'departmentRows'}
function setAll(type){$(listId(type)).querySelectorAll('.target-row').forEach(r=>{if(r.querySelector('.check').checked)r.querySelector('.att-status').value='present'})}
function clearAll(type){$(listId(type)).querySelectorAll('.target-row').forEach(r=>{const c=r.querySelector('.check');c.checked=false;c.dispatchEvent(new Event('change'))})}
function collectRows(id,key){return [...$(id).querySelectorAll('.target-row')].filter(r=>r.querySelector('.check').checked).map(r=>({[key]:r.dataset.id,attendance_status:r.querySelector('.att-status').value,attendee_position:r.querySelector('.position').value.trim(),attendee_name:r.querySelector('.name').value.trim()}))}
function validate(rows,label,finalize){if(!finalize)return null;if(label==='협력사'&&!rows.length)return '대상 협력사를 1개 이상 선택하세요.';for(const r of rows){if(r.attendance_status==='pending')return `${label}의 참석 또는 불참을 모두 지정하세요.`;if(r.attendance_status==='present'&&(!r.attendee_position||!r.attendee_name))return `참석 ${label}의 직급과 성명을 모두 입력하세요.`}return null}
function updateLocal(d){const i=annualData.meetings.findIndex(x=>x.id===d.id),p=d.partners||[],summary={...d,partner_target_count:p.length,partner_present_count:p.filter(x=>x.attendance_status==='present').length,partner_absent_count:p.filter(x=>x.attendance_status==='absent').length,partner_pending_count:p.filter(x=>x.attendance_status==='pending').length,department_target_count:(d.departments||[]).length};if(i>=0)annualData.meetings[i]={...annualData.meetings[i],...summary};else annualData.meetings.push(summary)}
async function saveMeeting(m,finalize){const partners=collectRows('partnerRows','company_id'),departments=collectRows('departmentRows','department_id'),msg=validate(partners,'협력사',finalize)||validate(departments,'부서',finalize);if(msg){alert(msg);return}const buttons=[...$('detail').querySelectorAll('.edit-actions button')];buttons.forEach(b=>b.disabled=true);$('saveState').textContent='저장 중...';const started=performance.now();try{const d=await api(`/api/admin/committee/${encodeURIComponent(m.id)}`,{method:'PATCH',body:JSON.stringify({meeting_date:$('meetingDate').value,note:$('meetingNote').value.trim(),partners,departments,finalize:!!finalize,status:finalize?undefined:'draft',expected_updated_at:m.updated_at})});detailCache.set(m.id,d.meeting);updateLocal(d.meeting);renderSummary();renderRail();renderMonths();renderAdminDetail(d.meeting,false);const elapsed=Math.round(performance.now()-started),footer=$('detail').querySelector('.detail-footer');if(footer){const s=document.createElement('span');s.className='save-state';s.textContent=`✓ 저장됨 · ${elapsed}ms`;footer.prepend(s)}}catch(e){alert(e.message);renderAdminDetail(m,true)}}
async function deleteMeeting(m){if(!confirm(`${monthOf(m)}월 협의체를 삭제할까요?`))return;try{await api(`/api/admin/committee/${encodeURIComponent(m.id)}`,{method:'DELETE'});annualData.meetings=annualData.meetings.filter(x=>x.id!==m.id);detailCache.delete(m.id);activeMonth=null;renderSummary();renderRail();renderMonths();$('detail').innerHTML='<div class="detail-empty"><div class="empty-symbol">12</div><strong>월을 선택하세요</strong><span>월별 참석 현황과 담당자 정보를 확인할 수 있습니다.</span></div>'}catch(e){alert(e.message)}}

(async()=>{try{session=JSON.parse(sessionStorage.getItem(KEY)||'null');if(!session){location.replace('/index.html');return}buildYears();const me=await api('/api/me');if(me.auth_state!=='approved')throw Object.assign(new Error('포털 로그인 및 계정 승인이 필요합니다.'),{status:403});currentUser=me.user;$('userLabel').textContent=currentUser.name||currentUser.email||'';$('pageTitle').textContent=currentUser.role==='admin'?'연간 안전보건협의체 관리':'연간 안전보건협의체 참석 현황';$('subtitle').textContent=currentUser.role==='admin'?'연간 운영 상태를 먼저 보고, 월을 선택해 참석자를 조회·편집합니다.':'월별 참석 결과와 연간 협의체 점수를 한 화면에서 확인합니다.';await loadYear()}catch(e){$('months').innerHTML=`<div class="error" style="grid-column:1/-1">${esc(e.message)}</div>`;$('detail').innerHTML=`<div class="error">${esc(e.message)}<br><br><button class="btn" onclick="goHome()">포털로 돌아가기</button></div>`}})();
</script>
</body>
</html>
