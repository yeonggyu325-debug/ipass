<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>안전보건협의체 | Hniruja EHS</title>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
<style>
:root{--blue:#2878d4;--blue-soft:#eef6ff;--line:#e5e9ec;--line-2:#edf0f2;--text:#26323b;--muted:#7f8b95;--bg:#f5f7f9;--green:#2f7e5d;--green-bg:#edf7f2;--red:#bd514b;--red-bg:#fff1ef;--amber:#9a6a25;--amber-bg:#fff7e8;--shadow:0 8px 28px rgba(31,48,61,.06)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:var(--text);background:var(--bg);letter-spacing:-.018em}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.head{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:sticky;top:0;z-index:20}.head-inner{width:min(1220px,calc(100% - 40px));display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px;border:0;background:none;padding:0;color:var(--text);font-weight:760}.brand img{height:26px}.brand small{color:#98a3ab;font-size:10px;font-weight:700}.head-actions{display:flex;align-items:center;gap:8px}.user{font-size:11px;color:var(--muted)}
.btn{min-height:38px;padding:0 13px;border:1px solid #d9e1e6;border-radius:8px;background:#fff;color:#53616b;font-weight:650}.btn:hover{background:#f8fafb}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:#b54b46;border-color:#efd4d1}.btn:disabled{opacity:.5;cursor:not-allowed}.wrap{max-width:1220px;margin:0 auto;padding:30px 20px 56px}.crumb{color:#9aa4ab;font-size:11px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin:12px 0 20px}.top h1{margin:0;font-size:26px;letter-spacing:-.045em}.sub{margin-top:7px;color:var(--muted);font-size:12px;line-height:1.55}.year{height:40px;border:1px solid #dfe5e9;border-radius:8px;background:#fff;padding:0 11px;color:#46545f;font-weight:650}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:11px;padding:15px 16px}.stat .label{font-size:10.5px;color:#87939c;font-weight:700}.stat .value{margin-top:7px;font-size:23px;font-weight:780}.stat .meta{margin-top:3px;color:#a0a9b0;font-size:9.5px}
.year-panel{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}.panel-head{min-height:54px;padding:0 17px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line-2)}.panel-head strong{font-size:14px}.panel-head span{font-size:10.5px;color:#98a2aa}.months{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;background:var(--line)}.month-card{min-height:166px;padding:16px;border:0;background:#fff;text-align:left;position:relative;display:flex;flex-direction:column;gap:8px;transition:background .15s ease,box-shadow .15s ease}.month-card:hover{background:#fbfdff}.month-card.active{z-index:1;box-shadow:inset 0 0 0 2px var(--blue);background:#fbfdff}.month-card.empty-month:hover{background:#f9fbfd}.month-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.month-num{font-size:20px;font-weight:780;letter-spacing:-.04em}.badge{display:inline-flex;align-items:center;min-height:22px;padding:0 7px;border-radius:6px;font-size:9.5px;font-weight:750}.badge.finalized{background:var(--green-bg);color:var(--green)}.badge.draft{background:var(--amber-bg);color:var(--amber)}.badge.empty{background:#f1f3f5;color:#89939b}.badge.present{background:var(--green-bg);color:var(--green)}.badge.absent{background:var(--red-bg);color:var(--red)}.month-date{font-size:11px;color:#7f8c96}.month-counts{display:flex;gap:10px;flex-wrap:wrap;font-size:10.5px;color:#77848e}.month-counts b{color:#3b4852}.month-people{margin-top:auto;min-height:32px;font-size:10.5px;color:#8a969f;line-height:1.45}.month-people b{color:#52606b;font-weight:700}.month-empty{margin:auto 0;color:#a3abb1;font-size:11px}.month-create-hint{margin-top:auto;color:#6f94b3;font-size:10px;font-weight:700}
.detail{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}.detail-empty{padding:38px;text-align:center;color:#98a3ab;font-size:12px}.detail-head{min-height:58px;padding:0 17px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line-2)}.detail-title{display:flex;align-items:center;gap:9px}.detail-title strong{font-size:15px}.detail-body{padding:18px}.fields{display:grid;grid-template-columns:180px minmax(0,1fr);gap:12px;margin-bottom:20px}.field label{display:block;margin-bottom:6px;color:#77848e;font-size:10.5px;font-weight:700}.field input,.field textarea{width:100%;border:1px solid #dfe5e9;border-radius:7px;background:#fff;color:#46545f}.field input{height:40px;padding:0 10px}.field textarea{min-height:72px;padding:9px 10px;resize:vertical}.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:22px 0 8px}.section-head h3{margin:0;font-size:13px}.section-head span{font-size:10px;color:#9aa4ab}.batch{display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px}.target-list{border:1px solid var(--line);border-radius:9px;overflow:hidden}.target-row{display:grid;grid-template-columns:minmax(160px,1.3fr) 100px minmax(90px,.65fr) minmax(100px,.7fr);align-items:center;gap:8px;min-height:50px;padding:7px 10px;border-bottom:1px solid var(--line-2)}.target-row:last-child{border-bottom:0}.target-check{display:flex;align-items:center;gap:8px;min-width:0;font-size:11.5px;font-weight:650;color:#46545f}.target-check input{width:15px;height:15px;accent-color:var(--blue)}.target-check span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.target-row select,.target-row input[type=text]{height:34px;border:1px solid #dfe5e9;border-radius:6px;background:#fbfcfd;padding:0 8px;color:#52606b;font-size:11px}.target-row select:disabled,.target-row input:disabled{opacity:.48;background:#f4f6f7}.actions{display:flex;align-items:center;gap:7px;margin-top:16px}.actions .spacer{flex:1}.save-state{color:#4d8068;font-size:10.5px;font-weight:700}.locked-note{padding:10px 12px;margin-bottom:14px;background:#f7fafb;border:1px solid #e8ecef;border-radius:8px;color:#74818b;font-size:10.5px;line-height:1.5}
.people-table{width:100%;border-collapse:collapse}.people-table th,.people-table td{padding:10px 11px;border-bottom:1px solid var(--line-2);text-align:left;font-size:11px}.people-table th{background:#fafbfc;color:#7b8790;font-size:10px}.people-table tr:last-child td{border-bottom:0}.state-present{color:var(--green);font-weight:750}.state-absent{color:var(--red);font-weight:750}.error,.loading{padding:32px;text-align:center;color:var(--muted)}.error{color:var(--red)}
@media(max-width:900px){.months{grid-template-columns:repeat(3,minmax(0,1fr))}.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.target-row{grid-template-columns:minmax(130px,1fr) 90px}.target-row .person-input{grid-column:1/-1}}
@media(max-width:640px){.head-inner{width:calc(100% - 24px)}.brand small,.user{display:none}.wrap{padding:20px 12px 40px}.top{align-items:flex-start;flex-direction:column}.months{grid-template-columns:repeat(2,minmax(0,1fr))}.month-card{min-height:154px;padding:13px}.fields{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.detail-body{padding:13px}.section-head{align-items:flex-start;flex-direction:column}.batch{justify-content:flex-start;flex-wrap:wrap}.actions{flex-wrap:wrap}.actions .spacer{display:none}.actions .btn{flex:1}.target-row{grid-template-columns:minmax(0,1fr) 88px}.target-row .person-input{grid-column:1/-1}}
</style>
</head>
<body>
<header class="head"><div class="head-inner"><button class="brand" type="button" id="brandHome"><img src="/hniruja-logo.png" alt="Hniruja"><span>협력사 EHS 포털</span><small>안전보건협의체</small></button><div class="head-actions"><span class="user" id="userLabel"></span><button class="btn" type="button" id="homeBtn">포털 홈</button></div></div></header>
<main class="wrap">
  <div class="crumb">홈 · EHS 업무 · 안전보건협의체</div>
  <div class="top"><div><h1 id="pageTitle">연간 안전보건협의체 관리</h1><div class="sub" id="subtitle">월별 회차와 참석자를 한 화면에서 관리합니다.</div></div><select id="year" class="year" aria-label="연도"></select></div>
  <div id="summary" class="summary"></div>
  <section class="year-panel"><div class="panel-head"><strong id="yearTitle">연간 운영 현황</strong><span id="yearMeta"></span></div><div id="months" class="months"></div></section>
  <section class="detail" id="detail"><div class="detail-empty">월을 선택하면 참석자와 회의 정보를 확인할 수 있습니다.</div></section>
</main>
<script>
const API_ORIGIN=location.hostname==='ipass.i-pass-eval.workers.dev'?'':'https://ipass.i-pass-eval.workers.dev';
const FIREBASE_API_KEY='AIzaSyC0s7buQaayKr84QA_wFNyF6rcs6w1-IoU';
const KEY='ipass.session.v10';
let session=null,currentUser=null,annualData=null,activeMonth=null;
const detailCache=new Map();
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
function goHome(){try{if(document.referrer){const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return}}}catch{}location.replace('/index.html')}
$('homeBtn').onclick=goHome;$('brandHome').onclick=goHome;
async function refresh(){const body=new URLSearchParams({grant_type:'refresh_token',refresh_token:session.refreshToken});const r=await fetch(`https://securetoken.googleapis.com/v1/token?key=${encodeURIComponent(FIREBASE_API_KEY)}`,{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body});const d=await r.json();if(!r.ok)throw Object.assign(new Error('로그인 세션이 만료되었습니다.'),{status:401});session.idToken=d.id_token;session.refreshToken=d.refresh_token||session.refreshToken;session.expiresAt=Date.now()+Number(d.expires_in||3600)*1000;sessionStorage.setItem(KEY,JSON.stringify(session));return session.idToken}
async function api(path,opt={},retry=true){if(!session)throw Object.assign(new Error('로그인이 필요합니다.'),{status:401});const t=Date.now()>Number(session.expiresAt||0)-60000?await refresh():session.idToken;let r;try{r=await fetch(API_ORIGIN+path,{...opt,headers:{Accept:'application/json',Authorization:`Bearer ${t}`,...(opt.body?{'content-type':'application/json'}:{}),...(opt.headers||{})}})}catch{throw new Error('i-PaSS API에 연결하지 못했습니다.')}if(r.status===401&&retry){await refresh();return api(path,opt,false)}const d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||`HTTP ${r.status}`),{status:r.status,data:d});return d}
function buildYears(){const s=$('year'),now=new Date().getFullYear();for(let y=now+1;y>=now-4;y--){const o=document.createElement('option');o.value=String(y);o.textContent=`${y}년`;if(y===now)o.selected=true;s.append(o)}s.onchange=()=>loadYear(true)}
function meetingByMonth(month){return (annualData?.meetings||[]).find(m=>Number(m.meeting_month||String(m.meeting_date||'').slice(5,7))===month)||null}
function partnerByMonth(month){return (annualData?.meetings||[]).find(m=>Number(m.meeting_month||String(m.meeting_date||'').slice(5,7))===month)||null}
function badge(status){if(status==='finalized')return '<span class="badge finalized">확정</span>';if(status==='draft')return '<span class="badge draft">작성중</span>';if(status==='present')return '<span class="badge present">참석</span>';if(status==='absent')return '<span class="badge absent">불참</span>';return '<span class="badge empty">미등록</span>'}
function personPreview(detail){if(!detail)return '클릭하면 참석자 명단을 확인할 수 있습니다.';const p=(detail.partners||[]).filter(x=>x.attendance_status==='present').slice(0,2).map(x=>`${x.company_name} · ${x.attendee_name||''}`.trim());const d=(detail.departments||[]).filter(x=>x.attendance_status==='present').slice(0,1).map(x=>`${x.department_name} · ${x.attendee_name||''}`.trim());const list=[...p,...d];return list.length?`<b>${list.map(esc).join('</b><br><b>')}</b>${((detail.partners||[]).filter(x=>x.attendance_status==='present').length+(detail.departments||[]).filter(x=>x.attendance_status==='present').length)>list.length?'<br>외 참석자 있음':''}`:'참석자로 기록된 대상이 없습니다.'}
function renderSummary(){const meetings=annualData?.meetings||[];if(currentUser.role==='partner'){const s=annualData?.summary||{};$('summary').innerHTML=`<div class="stat"><div class="label">협의체 점수</div><div class="value">${Number(s.score??10)} / 10</div><div class="meta">불참 1회당 -3점</div></div><div class="stat"><div class="label">대상 회차</div><div class="value">${Number(s.finalized_meeting_count||0)}회</div><div class="meta">확정된 대상 회차</div></div><div class="stat"><div class="label">참석</div><div class="value">${Number(s.present_count||0)}회</div><div class="meta">연간 참석</div></div><div class="stat"><div class="label">불참</div><div class="value">${Number(s.absence_count||0)}회</div><div class="meta">연간 불참</div></div>`;return}const finalized=meetings.filter(m=>m.status==='finalized');const present=finalized.reduce((n,m)=>n+Number(m.partner_present_count||0),0);const absent=finalized.reduce((n,m)=>n+Number(m.partner_absent_count||0),0);$('summary').innerHTML=`<div class="stat"><div class="label">등록 월</div><div class="value">${meetings.length} / 12</div><div class="meta">연간 협의체 등록 현황</div></div><div class="stat"><div class="label">확정 회차</div><div class="value">${finalized.length}회</div><div class="meta">회의 확정 완료</div></div><div class="stat"><div class="label">협력사 참석</div><div class="value">${present}건</div><div class="meta">확정 회차 누계</div></div><div class="stat"><div class="label">협력사 불참</div><div class="value">${absent}건</div><div class="meta">i-PaSS 감점 대상</div></div>`}
function renderMonths(){const year=Number($('year').value),isAdmin=currentUser.role==='admin';$('yearTitle').textContent=`${year}년 월별 운영 현황`;$('yearMeta').textContent=isAdmin?'월을 눌러 참석자와 회의 내용을 관리하세요.':'확정된 내 참석 현황을 월별로 확인하세요.';$('months').innerHTML=Array.from({length:12},(_,i)=>i+1).map(month=>{const m=isAdmin?meetingByMonth(month):partnerByMonth(month);const active=activeMonth===month?' active':'';if(!m)return `<button class="month-card empty-month${active}" type="button" data-month="${month}"><div class="month-top"><span class="month-num">${month}월</span>${badge('empty')}</div><div class="month-empty">${isAdmin?'등록된 협의체가 없습니다.':'확정된 대상 회차가 없습니다.'}</div>${isAdmin?'<div class="month-create-hint">+ 이 달 협의체 만들기</div>':''}</button>`;if(!isAdmin)return `<button class="month-card${active}" type="button" data-month="${month}"><div class="month-top"><span class="month-num">${month}월</span>${badge(m.attendance_status)}</div><div class="month-date">${esc(m.meeting_date||'')}</div><div class="month-counts"><span>${m.attendance_status==='present'?'참석 완료':'불참'}</span></div><div class="month-people">${m.attendance_status==='present'?`<b>${esc(`${m.attendee_position||''} ${m.attendee_name||''}`.trim()||'참석자')}</b>`:'불참으로 확정되었습니다.'}</div></button>`;const cached=detailCache.get(m.id);return `<button class="month-card${active}" type="button" data-month="${month}"><div class="month-top"><span class="month-num">${month}월</span>${badge(m.status)}</div><div class="month-date">${esc(m.meeting_date||'')}</div><div class="month-counts"><span>대상 <b>${Number(m.partner_target_count||0)}</b></span><span>참석 <b>${Number(m.partner_present_count||0)}</b></span><span>불참 <b>${Number(m.partner_absent_count||0)}</b></span></div><div class="month-people">${personPreview(cached)}</div></button>`}).join('');$('months').querySelectorAll('.month-card').forEach(btn=>btn.onclick=()=>openMonth(Number(btn.dataset.month)))}
async function loadYear(force=false){activeMonth=null;detailCache.clear();$('detail').innerHTML='<div class="detail-empty">월을 선택하면 참석자와 회의 정보를 확인할 수 있습니다.</div>';const year=$('year').value;$('months').innerHTML='<div class="loading" style="grid-column:1/-1">연간 협의체 현황을 불러오는 중...</div>';try{annualData=await api(`/api/committee?year=${encodeURIComponent(year)}`);renderSummary();renderMonths()}catch(e){$('months').innerHTML=`<div class="error" style="grid-column:1/-1">${esc(e.message)}</div>`}}
async function openMonth(month){activeMonth=month;renderMonths();if(currentUser.role!=='admin'){const m=partnerByMonth(month);renderPartnerDetail(month,m);return}const m=meetingByMonth(month);if(!m){renderCreate(month);return}await openAdminMeeting(m)}
function renderPartnerDetail(month,m){if(!m){$('detail').innerHTML=`<div class="detail-empty">${month}월에는 확정된 대상 협의체가 없습니다.</div>`;return}$('detail').innerHTML=`<div class="detail-head"><div class="detail-title"><strong>${month}월 참석 결과</strong>${badge(m.attendance_status)}</div><span class="sub">${esc(m.meeting_date||'')}</span></div><div class="detail-body"><table class="people-table"><thead><tr><th>구분</th><th>상태</th><th>직급</th><th>성명</th></tr></thead><tbody><tr><td>협력사 참석자</td><td class="${m.attendance_status==='present'?'state-present':'state-absent'}">${m.attendance_status==='present'?'참석':'불참'}</td><td>${esc(m.attendee_position||'-')}</td><td>${esc(m.attendee_name||'-')}</td></tr></tbody></table>${m.note?`<div class="locked-note" style="margin-top:14px">${esc(m.note)}</div>`:''}</div>`}
function renderCreate(month){const year=Number($('year').value),now=new Date(),day=(year===now.getFullYear()&&month===now.getMonth()+1)?String(now.getDate()).padStart(2,'0'):'01';const mm=String(month).padStart(2,'0');$('detail').innerHTML=`<div class="detail-head"><div class="detail-title"><strong>${month}월 협의체 생성</strong>${badge('empty')}</div></div><div class="detail-body"><div class="fields"><div class="field"><label>개최일</label><input id="createDate" type="date" value="${year}-${mm}-${day}"></div><div class="field"><label>비고</label><textarea id="createNote" placeholder="필요한 메모만 입력하세요."></textarea></div></div><div class="actions"><span class="spacer"></span><button class="btn primary" id="createBtn" type="button">${month}월 협의체 생성</button></div></div>`;$('createBtn').onclick=()=>createMeeting(month)}
async function createMeeting(month){const btn=$('createBtn'),year=Number($('year').value),meeting_date=$('createDate').value,note=$('createNote').value.trim();btn.disabled=true;btn.textContent='생성 중...';try{const d=await api('/api/admin/committee',{method:'POST',body:JSON.stringify({year,month,meeting_date,note})});annualData.meetings=[{...d.meeting,partner_target_count:0,partner_present_count:0,partner_absent_count:0,partner_pending_count:0,department_target_count:0},...(annualData.meetings||[])];detailCache.set(d.meeting.id,d.meeting);renderSummary();renderMonths();renderAdminDetail(d.meeting)}catch(e){alert(e.message);btn.disabled=false;btn.textContent=`${month}월 협의체 생성`}}
async function openAdminMeeting(m){$('detail').innerHTML='<div class="loading">참석자 명단을 불러오는 중...</div>';try{let detail=detailCache.get(m.id);if(!detail){const d=await api(`/api/admin/committee/${encodeURIComponent(m.id)}`);detail=d.meeting;detailCache.set(m.id,detail);renderMonths()}renderAdminDetail(detail)}catch(e){$('detail').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
function statusOptions(v){return ['pending','present','absent'].map(x=>`<option value="${x}" ${x===v?'selected':''}>${x==='present'?'참석':x==='absent'?'불참':'미정'}</option>`).join('')}
function targetRows(options,selected,type,locked){const key=type==='partner'?'company_id':'department_id',nameKey=type==='partner'?'company_name':'department_name',map=new Map((selected||[]).map(r=>[r[key],r]));return (options||[]).map(o=>{const r=map.get(o.id),checked=!!r,status=r?.attendance_status||'pending';return `<div class="target-row" data-id="${esc(o.id)}"><label class="target-check"><input class="check" type="checkbox" ${checked?'checked':''} ${locked?'disabled':''}><span>${esc(o[nameKey])}</span></label><select class="status" ${(!checked||locked)?'disabled':''}>${statusOptions(status)}</select><input class="position person-input" type="text" placeholder="직급" value="${esc(r?.attendee_position||'')}" ${(!checked||locked)?'disabled':''}><input class="name person-input" type="text" placeholder="성명" value="${esc(r?.attendee_name||'')}" ${(!checked||locked)?'disabled':''}></div>`}).join('')}
function bindTargets(id,locked){if(locked)return;$(id).querySelectorAll('.target-row').forEach(row=>{const c=row.querySelector('.check'),s=row.querySelector('.status'),inputs=[...row.querySelectorAll('.person-input')];const sync=()=>{s.disabled=!c.checked;inputs.forEach(x=>x.disabled=!c.checked);if(!c.checked){s.value='pending';inputs.forEach(x=>x.value='')}};c.onchange=sync})}
function renderAdminDetail(m){const month=Number(m.meeting_month||String(m.meeting_date||'').slice(5,7)),locked=m.status==='finalized';$('detail').innerHTML=`<div class="detail-head"><div class="detail-title"><strong>${month}월 안전보건협의체</strong>${badge(m.status)}</div><span class="sub">${locked?'확정된 회차':'작성 중'}</span></div><div class="detail-body">${locked?'<div class="locked-note">확정된 회차는 참석자와 점수에 반영되어 있습니다. 수정하려면 먼저 재오픈하세요.</div>':''}<div class="fields"><div class="field"><label>개최일</label><input id="meetingDate" type="date" value="${esc(m.meeting_date||'')}" ${locked?'disabled':''}></div><div class="field"><label>비고</label><textarea id="meetingNote" ${locked?'disabled':''}>${esc(m.note||'')}</textarea></div></div><div class="section-head"><h3>대상 협력사 · 참석자</h3><span>참석 시 직급과 성명을 입력합니다.</span></div>${locked?'':`<div class="batch"><button class="btn" type="button" data-all="partner" data-state="present">선택 대상 모두 참석</button><button class="btn" type="button" data-clear="partner">전체 선택 해제</button></div>`}<div class="target-list" id="partnerRows">${targetRows(annualData.options?.companies,m.partners,'partner',locked)}</div><div class="section-head"><h3>사내 부서 · 참석자</h3><span>부서 참석은 i-PaSS 점수에는 반영되지 않습니다.</span></div>${locked?'':`<div class="batch"><button class="btn" type="button" data-all="department" data-state="present">선택 대상 모두 참석</button><button class="btn" type="button" data-clear="department">전체 선택 해제</button></div>`}<div class="target-list" id="departmentRows">${targetRows(annualData.options?.departments,m.departments,'department',locked)}</div><div class="actions"><button class="btn danger" id="deleteBtn" type="button" ${locked?'disabled':''}>회차 삭제</button><span class="save-state" id="saveState"></span><span class="spacer"></span>${locked?'<button class="btn" id="reopenBtn" type="button">재오픈하여 수정</button>':'<button class="btn" id="saveBtn" type="button">임시저장</button><button class="btn primary" id="finalizeBtn" type="button">회의 확정</button>'}</div></div>`;bindTargets('partnerRows',locked);bindTargets('departmentRows',locked);document.querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>setAll(b.dataset.all,b.dataset.state));document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>clearAll(b.dataset.clear));if($('saveBtn'))$('saveBtn').onclick=()=>saveMeeting(m,false,false);if($('finalizeBtn'))$('finalizeBtn').onclick=()=>saveMeeting(m,true,false);if($('reopenBtn'))$('reopenBtn').onclick=()=>saveMeeting(m,false,true);$('deleteBtn').onclick=()=>deleteMeeting(m)}
function containerFor(type){return type==='partner'?'partnerRows':'departmentRows'}
function setAll(type,state){$(containerFor(type)).querySelectorAll('.target-row').forEach(row=>{const c=row.querySelector('.check');if(c.checked){row.querySelector('.status').value=state}})}
function clearAll(type){$(containerFor(type)).querySelectorAll('.target-row').forEach(row=>{const c=row.querySelector('.check');c.checked=false;c.dispatchEvent(new Event('change'))})}
function collectRows(id,key){return [...$(id).querySelectorAll('.target-row')].filter(r=>r.querySelector('.check').checked).map(r=>({[key]:r.dataset.id,attendance_status:r.querySelector('.status').value,attendee_position:r.querySelector('.position').value.trim(),attendee_name:r.querySelector('.name').value.trim()}))}
function validateRows(rows,label,finalize){if(!finalize)return null;if(label==='협력사'&&!rows.length)return '대상 협력사를 1개 이상 선택하세요.';for(const r of rows){if(r.attendance_status==='pending')return `${label}의 참석 또는 불참을 모두 지정하세요.`;if(r.attendance_status==='present'&&(!r.attendee_position||!r.attendee_name))return `참석 ${label}의 직급과 성명을 모두 입력하세요.`}return null}
async function saveMeeting(m,finalize,reopen){const partners=collectRows('partnerRows','company_id'),departments=collectRows('departmentRows','department_id');const msg=validateRows(partners,'협력사',finalize)||validateRows(departments,'부서',finalize);if(msg){alert(msg);return}const body={meeting_date:$('meetingDate').value,note:$('meetingNote').value.trim(),partners,departments,finalize:!!finalize,expected_updated_at:m.updated_at};if(reopen){body.reopen=true;body.status='draft'}else if(!finalize)body.status='draft';const buttons=[...$('detail').querySelectorAll('.actions button')];buttons.forEach(b=>b.disabled=true);if($('saveState'))$('saveState').textContent='저장 중...';const started=performance.now();try{const d=await api(`/api/admin/committee/${encodeURIComponent(m.id)}`,{method:'PATCH',body:JSON.stringify(body)});detailCache.set(m.id,d.meeting);const idx=annualData.meetings.findIndex(x=>x.id===m.id);const p=d.meeting.partners||[];const summary={...d.meeting,partner_target_count:p.length,partner_present_count:p.filter(x=>x.attendance_status==='present').length,partner_absent_count:p.filter(x=>x.attendance_status==='absent').length,partner_pending_count:p.filter(x=>x.attendance_status==='pending').length,department_target_count:(d.meeting.departments||[]).length};if(idx>=0)annualData.meetings[idx]={...annualData.meetings[idx],...summary};renderSummary();renderMonths();renderAdminDetail(d.meeting);if($('saveState'))$('saveState').textContent=`✓ 저장됨 · ${Math.round(performance.now()-started)}ms`}catch(e){alert(e.message);renderAdminDetail(m)}}
async function deleteMeeting(m){if(!confirm(`${Number(m.meeting_month)}월 협의체를 삭제할까요?`))return;try{await api(`/api/admin/committee/${encodeURIComponent(m.id)}`,{method:'DELETE'});annualData.meetings=annualData.meetings.filter(x=>x.id!==m.id);detailCache.delete(m.id);activeMonth=null;renderSummary();renderMonths();$('detail').innerHTML='<div class="detail-empty">월을 선택하면 참석자와 회의 정보를 확인할 수 있습니다.</div>'}catch(e){alert(e.message)}}
(async()=>{try{session=JSON.parse(sessionStorage.getItem(KEY)||'null');if(!session){location.replace('/index.html');return}buildYears();const me=await api('/api/me');if(me.auth_state!=='approved')throw Object.assign(new Error('포털 로그인 및 계정 승인이 필요합니다.'),{status:403});currentUser=me.user;$('userLabel').textContent=currentUser.name||currentUser.email||'';$('pageTitle').textContent=currentUser.role==='admin'?'연간 안전보건협의체 관리':'연간 안전보건협의체 참석 현황';$('subtitle').textContent=currentUser.role==='admin'?'1월부터 12월까지 회차·대상·참석자를 한 화면에서 관리합니다.':'월별 참석 결과와 연간 협의체 점수를 확인합니다.';await loadYear()}catch(e){if(e.status===401||e.status===403){$('months').innerHTML=`<div class="error" style="grid-column:1/-1">${esc(e.message)}<br><br><button class="btn" onclick="goHome()">포털로 돌아가기</button></div>`}else{$('months').innerHTML=`<div class="error" style="grid-column:1/-1">${esc(e.message)}<br><br>로그인 상태는 유지됩니다. 잠시 후 다시 시도해 주세요.</div>`}}})();
</script>
