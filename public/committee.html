<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>안전보건협의체 | Hniruja</title>
  <style>
    html,body{width:100%;height:100%;margin:0;background:#f5f7f9}
    #committeeApp{width:100%;height:100%;border:0;display:block;background:#fff}
    #loading{position:fixed;inset:0;display:grid;place-items:center;background:#f5f7f9;color:#66737d;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;z-index:1}
    #loading.hidden{display:none}
  </style>
</head>
<body>
  <div id="loading">안전보건협의체를 불러오는 중...</div>
  <iframe id="committeeApp" title="안전보건협의체" src="/"></iframe>
  <script>
    const frame=document.getElementById('committeeApp');
    const loading=document.getElementById('loading');
    let timer=null;
    function openCommittee(){
      try{
        const win=frame.contentWindow;
        const doc=frame.contentDocument;
        const app=doc&&doc.getElementById('app');
        if(!win||!app||app.classList.contains('hidden')||typeof win.navigatePage!=='function')return;
        win.navigatePage('committee');
        loading.classList.add('hidden');
        clearInterval(timer);
      }catch(_){}
    }
    frame.addEventListener('load',()=>{
      clearInterval(timer);
      timer=setInterval(openCommittee,200);
      openCommittee();
    });
  </script>
</body>
</html>
