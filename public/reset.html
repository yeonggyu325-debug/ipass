<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hniruja Partner Portal | 비밀번호 찾기</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--navy:#234e70;--ink:#273746;--muted:#7b8996;--line:#d9e3e9;--danger:#b33f39;--success:#2c7758}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Segoe UI",sans-serif;background:linear-gradient(135deg,#f9fbfc,#edf4f7);color:var(--ink);letter-spacing:-.018em}
body{font-size:110%}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
.content{width:min(390px,92vw)}
.eyebrow{color:#8292a0;font-size:10px;font-weight:800;letter-spacing:.11em}
h1{margin:9px 0 30px;color:#294459;font-size:28px;font-weight:730;letter-spacing:-.035em}
p{display:none}
label{display:block;margin-bottom:8px;color:#4a5e6d;font-size:12px;font-weight:650}
input{width:100%;height:52px;border:1px solid #ccd8e1;background:#fff;padding:0 13px;outline:none}
input:focus{border-color:#79a1bc;box-shadow:0 0 0 3px rgba(91,140,174,.07)}
button{width:100%;height:52px;margin-top:18px;border:0;background:var(--navy);color:#fff;font-size:14px;font-weight:700}
.links{text-align:center;margin-top:19px}
a{color:#62798b;font-size:11px;text-decoration:none}
.msg{min-height:18px;margin-top:14px;text-align:center;color:var(--danger);font-size:12px}
.ok{color:var(--success)}
</style>
</head>
<body>
<div class="wrap"><div class="content"><div class="eyebrow">HNIRUJA PARTNER PORTAL</div><h1>비밀번호 찾기</h1><form id="form"><label>이메일</label><input id="email" type="email" required><button type="submit">재설정 메일 발송</button></form><div id="message" class="msg"></div><div class="links"><a href="/">로그인으로 돌아가기</a></div></div></div>
<script>
const FIREBASE_API_KEY="AIzaSyC0s7buQaayKr84QA_wFNyF6rcs6w1-IoU";
document.getElementById("form").onsubmit=async e=>{e.preventDefault();const msg=document.getElementById("message");msg.className="msg";msg.textContent="메일 발송 중...";try{const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:sendOobCode?key=${encodeURIComponent(FIREBASE_API_KEY)}`,{method:"POST",headers:{"content-type":"application/json","X-Firebase-Locale":"ko"},body:JSON.stringify({requestType:"PASSWORD_RESET",email:document.getElementById("email").value.trim()})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d?.error?.message||"메일 발송에 실패했습니다.");msg.className="msg ok";msg.textContent="비밀번호 재설정 메일을 발송했습니다."}catch(err){msg.textContent=err.message}};
</script>
</body>
</html>
