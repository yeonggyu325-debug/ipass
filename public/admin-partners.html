<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>협력사 관리 | Hniruja EHS</title><link rel="stylesheet" href="/global-toolbar-v5.css?v=5"><link rel="stylesheet" href="/portal-shell-v1.css?v=2"><script src="/shared/auth.js?v=4"></script><script src="/shared/api.js?v=6"></script><script src="/global-toolbar-v5.js?v=7"></script><style>
:root{--ink:#24343f;--muted:#8b98a0;--line:#e3e8ec;--page:#f5f7f9;--blue:#236f9f;--blue-soft:#eef6fa;--green:#24745a;--red:#b94d47}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:"Pretendard Variable","Pretendard","Noto Sans KR","Segoe UI",sans-serif;letter-spacing:-.025em}.partner-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:24px}.partner-head h1{margin:0;font-size:28px;line-height:1.25;font-weight:820;letter-spacing:-.04em}.partner-head p{margin:8px 0 0;color:var(--muted);font-size:12px;line-height:1.55}.admin-tabs{display:flex;gap:8px}.admin-tab,.btn{height:40px;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#60717b;font-size:11.5px;font-weight:760;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;line-height:1}.admin-tab.active{background:var(--blue-soft);color:var(--blue)}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:24px}.metric{min-height:88px;padding:18px 20px;border-radius:12px;background:#fff;box-shadow:0 4px 16px rgba(30,48,62,.04);display:flex;flex-direction:column;justify-content:center}.metric span{font-size:11px;line-height:1.3;color:#85929a}.metric b{display:block;margin-top:7px;font-size:24px;line-height:1;font-weight:820}.add-card{margin-bottom:24px;padding:18px 20px;border-radius:13px;background:#fff}.add-form{display:grid;grid-template-columns:1.2fr 1fr .7fr auto;gap:10px;align-items:center}.add-form input,.search{height:40px;border:1px solid var(--line);border-radius:9px;padding:0 12px;font:inherit;font-size:11.5px;color:var(--ink);background:#fff}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.partner-controls{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.filter-group,.partner-tools{display:flex;align-items:center;gap:8px}.filter-btn{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:10.5px;font-weight:720;display:inline-flex;align-items:center;justify-content:center}.filter-btn.active{background:var(--blue-soft);color:var(--blue)}.panel{overflow:hidden;border-radius:13px;background:#fff;box-shadow:0 5px 18px rgba(30,48,62,.045)}.panel-head{min-height:64px;padding:12px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}.panel-head strong{font-size:12.5px;font-weight:800}.panel-head span{font-size:10.5px;color:var(--muted)}.table-wrap{overflow:auto}table{width:100%;min-width:1120px;border-collapse:collapse;table-layout:fixed}col.company-col{width:29%}col.industry-col{width:16%}col.account-col{width:9%}col.target-col{width:14%}col.signup-col{width:14%}col.logo-col{width:18%}th,td{height:66px;padding:12px 14px;border-bottom:1px solid #edf0f2;text-align:center;font-size:11.5px;line-height:1.35;vertical-align:middle}th{height:44px;background:#f7f9fa;color:#657782;font-size:10.5px;font-weight:780;white-space:nowrap}tbody tr:hover{background:#fbfcfd}.company-cell{display:flex;align-items:center;justify-content:flex-start;gap:12px;min-width:0;text-align:left}.logo-thumb{width:40px;height:40px;border-radius:9px;border:1px solid var(--line);background:#f7f9fa;display:grid;place-items:center;overflow:hidden;color:#9aa5ac;font-size:9px;font-weight:760;flex:0 0 auto}.logo-thumb img{width:100%;height:100%;object-fit:contain;background:#fff}.company{min-width:0}.company b{display:block;font-size:11.8px;line-height:1.3;font-weight:780;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.company small{display:block;margin-top:4px;color:#909ba2;font-size:10px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.toggle-wrap{display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}.toggle{position:relative;width:44px;height:24px;border:0;border-radius:999px;background:#cbd3d8;flex:0 0 auto;cursor:pointer}.toggle:after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.18s}.toggle.on{background:#3d8b69}.toggle.on:after{transform:translateX(20px)}.toggle-wrap span{min-width:34px;text-align:left;font-size:10.5px;font-weight:720}.logo-actions{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}.logo-file{display:none}.mini{min-width:48px;height:32px;padding:0 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#5e6d76;font-family:inherit;font-size:10px;font-weight:740;line-height:1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;white-space:nowrap}.mini.clipboard{min-width:64px}.mini.danger{color:var(--red)}.paste-active{outline:2px solid rgba(35,111,159,.22);outline-offset:2px}.loading,.empty,.error{padding:46px;text-align:center;color:#919ca4;font-size:11.5px}.error{color:var(--red)}@media(max-width:900px){.partner-head{flex-direction:column;align-items:flex-start}.summary{grid-template-columns:1fr 1fr}.add-form{grid-template-columns:1fr 1fr}.partner-controls{flex-direction:column;align-items:stretch}.partner-tools{justify-content:flex-end}}@media(max-width:560px){.summary{grid-template-columns:1fr}.add-form{grid-template-columns:1fr}.admin-tabs,.filter-group,.partner-tools{width:100%;flex-wrap:wrap}.admin-tab,.filter-btn,.partner-tools .btn{flex:1}.search{width:100%}}
</style></head><body><main class="shell admin-partner-shell"><section class="partner-head"><div><h1>협력사 관리</h1><p>협력사 마스터, 협의체 대상, 회원가입 허용 및 회사 로고를 한 곳에서 관리합니다.</p></div><nav class="admin-tabs"><a class="admin-tab" href="/admin/approvals">회원가입 승인</a><a class="admin-tab" href="/admin/accounts">협력사 계정</a><a class="admin-tab active" aria-current="page" href="/admin-partners.html">협력사 관리</a></nav></section><section class="summary"><div class="metric"><span>등록 협력사</span><b id="totalCount">-</b></div><div class="metric"><span>협의체 대상</span><b id="targetCount">-</b></div><div class="metric"><span>가입 허용</span><b id="signupCount">-</b></div><div class="metric"><span>등록 계정</span><b id="accountCount">-</b></div></section><section class="add-card"><form id="addForm" class="add-form"><input id="companyName" required placeholder="협력사명"><input id="industryName" placeholder="업종"><input id="industryCode" placeholder="업종코드"><button class="btn primary">협력사 추가</button></form></section><section class="partner-controls"><div class="filter-group"><button class="filter-btn active" data-filter="all">전체</button><button class="filter-btn" data-filter="target">협의체 대상</button><button class="filter-btn" data-filter="signup">가입 허용</button></div><div class="partner-tools"><input id="searchInput" class="search" placeholder="회사명·업종 검색"><button id="refreshBtn" class="btn">새로고침</button></div></section><section class="panel"><div class="panel-head"><strong>협력사 마스터 목록</strong><span>PNG · JPG · WEBP / 최대 2MB / 파일 선택 또는 클립보드 붙여넣기</span></div><div id="tableBox" class="loading">협력사 정보를 불러오는 중...</div></section></main><script>
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let rows=[],filter='all',pasteCompanyId=null;function summary(){const target=rows.filter(r=>r.is_target).length,signup=rows.filter(r=>r.signup_enabled).length;$('totalCount').textContent=rows.length;$('targetCount').textContent=target;$('signupCount').textContent=signup;$('accountCount').textContent=rows.reduce((s,r)=>s+Number(r.account_count||0),0)}function filteredRows(){const q=$('searchInput').value.trim().toLowerCase();return rows.filter(r=>{if(filter==='target'&&!r.is_target)return false;if(filter==='signup'&&!r.signup_enabled)return false;return !q||[r.company_name,r.industry_name,r.industry_code].some(v=>String(v||'').toLowerCase().includes(q))})}function toggleHtml(r,key,on,off){return `<div class="toggle-wrap"><button class="toggle ${r[key]?'on':''}" role="switch" aria-label="${key==='is_target'?'협의체 대상':'회원가입 허용'}" aria-checked="${r[key]?'true':'false'}" data-setting="${key}" data-id="${esc(r.id)}"></button><span>${r[key]?on:off}</span></div>`}function logoHtml(r){return `<div class="logo-actions" data-logo-actions="${esc(r.id)}"><label class="mini">${r.has_logo?'변경':'등록'}<input class="logo-file" type="file" accept="image/png,image/jpeg,image/webp" data-logo="${esc(r.id)}"></label><button class="mini clipboard" type="button" data-logo-paste="${esc(r.id)}">붙여넣기</button>${r.has_logo?`<button class="mini danger" type="button" data-logo-delete="${esc(r.id)}">삭제</button>`:''}</div>`}function render(){summary();const list=filteredRows();$('tableBox').className='';$('tableBox').innerHTML=list.length?`<div class="table-wrap"><table><colgroup><col class="company-col"><col class="industry-col"><col class="account-col"><col class="target-col"><col class="signup-col"><col class="logo-col"></colgroup><thead><tr><th>협력사</th><th>업종</th><th>계정</th><th>협의체</th><th>회원가입</th><th>회사 로고</th></tr></thead><tbody>${list.map(r=>`<tr><td><div class="company-cell"><div class="logo-thumb">${r.logo_url?`<img src="${esc(r.logo_url)}" alt="${esc(r.company_name||'협력사')} 로고">`:'LOGO'}</div><div class="company"><b>${esc(r.company_name||'-')}</b><small>${esc(r.industry_code||'업종코드 없음')}</small></div></div></td><td>${esc(r.industry_name||'-')}</td><td>${Number(r.account_count||0)}개</td><td>${toggleHtml(r,'is_target','대상','비대상')}</td><td>${toggleHtml(r,'signup_enabled','허용','차단')}</td><td>${logoHtml(r)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">조건에 맞는 협력사가 없습니다.</div>';document.querySelectorAll('[data-setting]').forEach(b=>b.onclick=()=>toggleSetting(b.dataset.id,b.dataset.setting));document.querySelectorAll('[data-logo]').forEach(i=>i.onchange=()=>uploadLogo(i.dataset.logo,i.files?.[0]));document.querySelectorAll('[data-logo-paste]').forEach(b=>b.onclick=()=>pasteLogo(b.dataset.logoPaste));document.querySelectorAll('[data-logo-delete]').forEach(b=>b.onclick=()=>deleteLogo(b.dataset.logoDelete));markPasteTarget()}function markPasteTarget(){document.querySelectorAll('[data-logo-actions]').forEach(el=>el.classList.toggle('paste-active',el.dataset.logoActions===pasteCompanyId))}async function load(){try{const d=await window.EHSApi.request('/api/admin/partners',{ehsNoCache:true});rows=d.partners||[];render()}catch(e){$('tableBox').className='error';$('tableBox').textContent=window.EHSApi.describe(e)}}async function toggleSetting(id,key){const r=rows.find(x=>x.id===id);if(!r)return;await window.EHSApi.request(`/api/admin/partners/${encodeURIComponent(id)}`,{method:'PATCH',body:JSON.stringify({[key]:!r[key]})});r[key]=!r[key];render()}async function uploadLogo(id,file){if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(String(file.type||'').toLowerCase())){alert('PNG, JPG, WEBP 이미지만 가능합니다.');return}if(file.size>2*1024*1024){alert('로고는 2MB 이하만 가능합니다.');return}const form=new FormData();form.append('logo',file,file.name||'clipboard-logo.png');try{await window.EHSApi.request(`/api/admin/partners/${encodeURIComponent(id)}/logo`,{method:'PUT',body:form,timeoutMs:60000});pasteCompanyId=null;await load()}catch(e){alert(window.EHSApi.describe(e))}}async function pasteLogo(id){pasteCompanyId=id;markPasteTarget();if(navigator.clipboard?.read){try{const items=await navigator.clipboard.read();for(const item of items){const type=item.types.find(t=>['image/png','image/jpeg','image/webp'].includes(t));if(type){const blob=await item.getType(type);const file=new File([blob],`clipboard-logo.${type==='image/png'?'png':type==='image/webp'?'webp':'jpg'}`,{type});await uploadLogo(id,file);return}}alert('클립보드에 이미지가 없습니다.')}catch(_){alert('브라우저가 직접 읽기를 차단했습니다. 해당 회사의 붙여넣기 버튼을 누른 뒤 Ctrl+V를 눌러 주세요.')}}else alert('해당 회사의 붙여넣기 버튼을 누른 뒤 Ctrl+V를 눌러 주세요.')}document.addEventListener('paste',e=>{if(!pasteCompanyId)return;const item=[...(e.clipboardData?.items||[])].find(x=>String(x.type||'').startsWith('image/'));const file=item?.getAsFile?.();if(file){e.preventDefault();uploadLogo(pasteCompanyId,file)}});async function deleteLogo(id){if(!confirm('등록된 회사 로고를 삭제하시겠습니까?'))return;try{await window.EHSApi.request(`/api/admin/partners/${encodeURIComponent(id)}/logo`,{method:'DELETE'});pasteCompanyId=null;await load()}catch(e){alert(window.EHSApi.describe(e))}}$('addForm').onsubmit=async e=>{e.preventDefault();try{await window.EHSApi.request('/api/admin/partners',{method:'POST',body:JSON.stringify({company_name:$('companyName').value.trim(),industry_name:$('industryName').value.trim(),industry_code:$('industryCode').value.trim()})});$('addForm').reset();await load()}catch(err){alert(window.EHSApi.describe(err))}};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});(async()=>{const user=await window.EHSAuth.requireUser();if(user.role!=='admin'){location.replace('/home');return}window.__EHS_PAGE_USER=user;document.dispatchEvent(new CustomEvent('ehs:user-ready',{detail:user}));$('searchInput').addEventListener('input',render);$('refreshBtn').onclick=load;await load()})();
</script></body></html>
