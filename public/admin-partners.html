<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>협력사 관리 | Hniruja EHS</title>
<link rel="stylesheet" href="/global-toolbar-v5.css?v=5" data-global-toolbar-v5="true">
<link rel="stylesheet" href="/portal-shell-v1.css?v=2">
<script src="/shared/auth.js?v=4"></script>
<script src="/shared/api.js?v=6"></script>
<script src="/global-toolbar-v5.js?v=7" data-global-toolbar-v5="true"></script>
<style>
:root{--ink:#24343f;--text:#566771;--muted:#8b98a0;--line:#e3e8ec;--page:#f5f7f9;--blue:#236f9f;--blue-soft:#eef6fa;--green:#24745a;--green-soft:#edf7f2;--gray:#78858d;--gray-soft:#f2f4f5;--red:#b94d47}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Segoe UI",sans-serif;letter-spacing:-.025em}button,input{font:inherit}.hidden{display:none!important}
.partner-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:24px}.partner-head h1{margin:0;font-size:28px;letter-spacing:-.045em}.partner-head p{margin:8px 0 0;color:var(--muted);font-size:12px;line-height:1.55}.admin-tabs{display:flex;gap:8px;flex-wrap:wrap}.admin-tab{height:40px;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#60717b;font-size:11px;font-weight:760;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.admin-tab:hover{background:#f8fafb}.admin-tab.active{border-color:#d4e5ef;background:var(--blue-soft);color:var(--blue)}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:24px}.metric{min-height:88px;padding:18px 20px;border-radius:12px;background:#fff;box-shadow:0 4px 16px rgba(30,48,62,.04);display:flex;flex-direction:column;justify-content:center}.metric span{display:block;color:#85929a;font-size:11px;font-weight:720}.metric b{display:block;margin-top:7px;font-size:24px;letter-spacing:-.04em}.metric.target b,.metric.signup b{color:var(--green)}.metric.non-target b{color:var(--gray)}
.partner-controls{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.filter-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.filter-btn{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#667780;font-size:10.5px;font-weight:760;cursor:pointer}.filter-btn.active{background:var(--blue-soft);border-color:#d4e5ef;color:var(--blue)}.partner-tools{display:flex;align-items:center;gap:8px}.search{width:260px;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none;color:#40525d;font-size:12px}.search:focus,.add-form input:focus{border-color:#9bbdd2;box-shadow:0 0 0 3px rgba(35,111,159,.07)}.btn{height:40px;padding:0 13px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#62727c;font-size:11px;font-weight:750;cursor:pointer}.btn:hover{background:#f7f9fa}.btn.primary{border-color:var(--blue);background:var(--blue);color:#fff}.btn.primary:hover{background:#1f638e}
.add-card{margin-bottom:24px;padding:18px 20px;border-radius:13px;background:#fff;box-shadow:0 5px 18px rgba(30,48,62,.045)}.add-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.add-head strong{font-size:14px}.add-head span{color:var(--muted);font-size:10.5px}.add-form{display:grid;grid-template-columns:minmax(180px,1.2fr) minmax(160px,1fr) minmax(130px,.7fr) auto;gap:10px}.add-form input{height:40px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none;color:#40525d;font-size:12px}
.panel{overflow:hidden;border-radius:13px;background:#fff;box-shadow:0 5px 18px rgba(30,48,62,.045)}.panel-head{min-height:64px;padding:12px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-head strong{font-size:14px}.panel-head span{color:#8a969e;font-size:10.5px}.table-wrap{overflow:auto}table{width:100%;min-width:930px;border-collapse:collapse}th,td{padding:14px 16px;border-bottom:1px solid #edf0f2;text-align:left;vertical-align:middle}th{background:#f7f9fa;color:#657782;font-size:10.5px;font-weight:800;white-space:nowrap}td{color:#4e606b;font-size:11.5px}tbody tr:hover td{background:#fbfcfd}tbody tr:last-child td{border-bottom:0}.company b{display:block;color:#30434f;font-size:12px}.company small{display:block;margin-top:4px;color:#909ba2;font-size:9.5px}.account-count{color:#6d7d86;font-variant-numeric:tabular-nums}.setting-cell{width:178px}.toggle-wrap{display:flex;align-items:center;justify-content:flex-start;gap:10px}.toggle{position:relative;width:44px;height:24px;flex:none;border:0;border-radius:999px;background:#cbd3d8;cursor:pointer;transition:.18s}.toggle::after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(25,40,52,.24);transition:.18s}.toggle.on{background:#3d8b69}.toggle.on::after{transform:translateX(20px)}.toggle:focus-visible{outline:3px solid rgba(35,111,159,.16);outline-offset:2px}.toggle:disabled{opacity:.55;cursor:wait}.toggle-label{min-width:58px;color:#7b8890;font-size:10.5px;font-weight:760}.toggle-label.on{color:var(--green)}.loading,.empty,.error{padding:46px 20px;text-align:center;color:#919ca4;font-size:11px}.error{color:var(--red)}
@media(max-width:980px){.partner-head{align-items:flex-start;flex-direction:column}.admin-tabs{width:100%}.admin-tab{flex:1;min-width:130px}.partner-controls{align-items:stretch;flex-direction:column}.partner-tools{width:100%}.search{width:100%;flex:1}.summary{grid-template-columns:1fr 1fr}.add-form{grid-template-columns:1fr 1fr}.add-form .primary{grid-column:1/-1}.panel-head{padding:14px 16px;align-items:flex-start;flex-direction:column}}
@media(max-width:560px){.admin-tabs{display:grid;grid-template-columns:1fr;width:100%}.summary{grid-template-columns:1fr}.filter-group{display:grid;grid-template-columns:repeat(3,1fr)}.partner-tools{flex-direction:column}.partner-tools .btn{width:100%}.add-form{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="shell admin-partner-shell">
  <section class="partner-head">
    <div><h1>협력사 관리</h1><p>이 목록이 협력사 마스터입니다. 회원가입 회사 선택과 협의체 협력사 구성은 이 목록을 기준으로 연동됩니다.</p></div>
    <nav class="admin-tabs" aria-label="관리자 협력사 메뉴"><a class="admin-tab" href="/admin/approvals">회원가입 승인</a><a class="admin-tab" href="/admin/accounts">협력사 계정</a><a class="admin-tab active" href="/admin-partners.html" aria-current="page">협력사 관리</a></nav>
  </section>
  <section class="summary"><div class="metric"><span>등록 협력사</span><b id="totalCount">-</b></div><div class="metric target"><span>협의체 대상</span><b id="targetCount">-</b></div><div class="metric signup"><span>가입 허용</span><b id="signupCount">-</b></div><div class="metric"><span>등록 계정</span><b id="accountCount">-</b></div></section>
  <section class="add-card"><div class="add-head"><strong>협력사 등록</strong><span>등록 즉시 회원가입 목록과 협의체 대상에 반영</span></div><form id="addForm" class="add-form"><input id="companyName" required maxlength="120" placeholder="협력사명"><input id="industryName" maxlength="120" placeholder="업종"><input id="industryCode" maxlength="40" placeholder="업종코드"><button class="btn primary" type="submit">협력사 추가</button></form></section>
  <section class="partner-controls"><div class="filter-group" role="group" aria-label="협력사 필터"><button class="filter-btn active" type="button" data-filter="all">전체</button><button class="filter-btn" type="button" data-filter="target">협의체 대상</button><button class="filter-btn" type="button" data-filter="signup">가입 허용</button></div><div class="partner-tools"><input id="searchInput" class="search" type="search" placeholder="회사명·업종 검색"><button id="refreshBtn" class="btn" type="button">새로고침</button></div></section>
  <section class="panel"><div class="panel-head"><strong>협력사 마스터 목록</strong><span>토글 변경 즉시 저장 · 협의체/회원가입 공통 기준</span></div><div id="tableBox" class="loading">협력사 정보를 불러오는 중...</div></section>
</main>
<script>
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let rows=[],filter='all';
function summary(){const target=rows.filter(r=>r.is_target).length,signup=rows.filter(r=>r.signup_enabled).length;$('totalCount').textContent=rows.length;$('targetCount').textContent=target;$('signupCount').textContent=signup;$('accountCount').textContent=rows.reduce((sum,r)=>sum+Number(r.account_count||0),0)}
function filteredRows(){const q=$('searchInput').value.trim().toLowerCase();return rows.filter(r=>{if(filter==='target'&&!r.is_target)return false;if(filter==='signup'&&!r.signup_enabled)return false;if(!q)return true;return [r.company_name,r.industry_name,r.industry_code].some(v=>String(v||'').toLowerCase().includes(q))})}
function toggleHtml(r,key,onLabel,offLabel){const on=!!r[key];return `<div class="toggle-wrap"><button class="toggle ${on?'on':''}" type="button" role="switch" aria-checked="${on?'true':'false'}" aria-label="${esc(r.company_name)} ${esc(onLabel)} 여부" data-setting="${key}" data-id="${esc(r.id)}"></button><span class="toggle-label ${on?'on':''}">${on?onLabel:offLabel}</span></div>`}
function render(){summary();const list=filteredRows();$('tableBox').className='';$('tableBox').innerHTML=list.length?`<div class="table-wrap"><table><thead><tr><th>협력사</th><th>업종</th><th>등록 계정</th><th class="setting-cell">협의체</th><th class="setting-cell">회원가입</th></tr></thead><tbody>${list.map(r=>`<tr><td class="company"><b>${esc(r.company_name||'-')}</b><small>${esc(r.industry_code||'업종코드 없음')}</small></td><td>${esc(r.industry_name||'-')}</td><td class="account-count">${Number(r.account_count||0)}개</td><td class="setting-cell">${toggleHtml(r,'is_target','대상','비대상')}</td><td class="setting-cell">${toggleHtml(r,'signup_enabled','허용','차단')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">조건에 맞는 협력사가 없습니다.</div>';document.querySelectorAll('[data-setting]').forEach(btn=>btn.onclick=()=>toggleSetting(btn.dataset.id,btn.dataset.setting,btn))}
async function load(){$('tableBox').className='loading';$('tableBox').textContent='협력사 정보를 불러오는 중...';try{const data=await window.EHSApi.request('/api/admin/partners',{ehsNoCache:true});rows=data.partners||[];render()}catch(error){$('tableBox').className='error';$('tableBox').textContent=window.EHSApi?.describe?window.EHSApi.describe(error):error.message}}
async function toggleSetting(id,key,button){const row=rows.find(r=>r.id===id);if(!row)return;const next=!row[key];button.disabled=true;try{await window.EHSApi.request(`/api/admin/partners/${encodeURIComponent(id)}`,{method:'PATCH',body:JSON.stringify({[key]:next})});row[key]=next;render()}catch(error){button.disabled=false;alert(window.EHSApi?.describe?window.EHSApi.describe(error):error.message)}}
$('addForm').onsubmit=async event=>{event.preventDefault();const payload={company_name:$('companyName').value.trim(),industry_name:$('industryName').value.trim(),industry_code:$('industryCode').value.trim()};if(!payload.company_name)return;const button=$('addForm').querySelector('button');button.disabled=true;try{await window.EHSApi.request('/api/admin/partners',{method:'POST',body:JSON.stringify(payload)});$('addForm').reset();await load()}catch(error){alert(window.EHSApi?.describe?window.EHSApi.describe(error):error.message)}finally{button.disabled=false}};
document.querySelectorAll('[data-filter]').forEach(btn=>btn.onclick=()=>{filter=btn.dataset.filter;document.querySelectorAll('[data-filter]').forEach(el=>el.classList.toggle('active',el===btn));render()});
(async()=>{try{const user=await window.EHSAuth.requireUser();if(user.role!=='admin'){location.replace('/home');return}window.__EHS_PAGE_USER=user;document.dispatchEvent(new CustomEvent('ehs:user-ready',{detail:user}));$('searchInput').addEventListener('input',render);$('refreshBtn').onclick=load;await load()}catch(error){if(error?.status!==401){$('tableBox').className='error';$('tableBox').textContent=error.message||'협력사 관리 화면을 열 수 없습니다.'}}})();
</script>
</body>
</html>
