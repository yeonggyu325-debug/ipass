<style>
:root{--blue:#2878d4;--ink:#202632;--text:#4e5968;--muted:#8b95a1;--line:#e5e8eb;--page:#f5f7f9;--green:#16845b;--greenbg:#edf8f3;--orange:#b46f12;--orangebg:#fff6e8;--red:#c94c46;--redbg:#fdf0ef;--graybg:#f1f3f5}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Segoe UI",sans-serif;color:var(--ink);background:var(--page);letter-spacing:-.018em}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.header{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:30}.brand{border:0;background:none;display:flex;align-items:center;gap:11px;color:var(--ink);font-weight:750}.brand img{height:26px}.brand small{padding-left:11px;border-left:1px solid var(--line);color:#8a949d;font-size:11px}.head{display:flex;align-items:center;gap:8px}.user{font-size:11px;color:#7b8790}.icon{width:38px;height:38px;border:1px solid #dfe4e8;border-radius:9px;background:#fff;color:#65737d}.shell{max-width:1280px;width:calc(100% - 48px);margin:auto;padding:28px 0 52px}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}.page-head h1{margin:0;font-size:25px;letter-spacing:-.04em}.page-head p{margin:7px 0 0;color:var(--muted);font-size:11px}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{height:38px;border:1px solid #dfe4e8;border-radius:8px;background:#fff;color:#596773;padding:0 13px;font-size:11px;font-weight:720}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:#b64c46;border-color:#efd3d0}.btn:disabled{opacity:.45;cursor:not-allowed}.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:14px;align-items:start}.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.card-head{height:54px;padding:0 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.card-head strong{font-size:13px}.side{position:sticky;top:80px}.cycle-btn{width:100%;border:0;border-bottom:1px solid #eef1f3;background:#fff;padding:12px 14px;text-align:left;color:#596670}.cycle-btn:hover,.cycle-btn.active{background:#f7fafc}.cycle-title{font-size:11.5px;font-weight:760}.cycle-meta{margin-top:5px;color:#929ca4;font-size:9px}.tag{display:inline-flex;padding:3px 6px;border-radius:999px;font-size:8.5px;font-weight:800}.draft{background:var(--orangebg);color:var(--orange)}.active{background:var(--greenbg);color:var(--green)}.closed{background:var(--graybg);color:#67727b}.empty{padding:28px;text-align:center;color:#98a2aa;font-size:10.5px}.editor{padding:16px}.form{display:grid;grid-template-columns:minmax(180px,.8fr) minmax(180px,.8fr) minmax(260px,1.4fr);gap:10px;margin-bottom:14px}.field label{display:block;margin-bottom:5px;color:#74818b;font-size:9.5px;font-weight:720}.field input{width:100%;height:38px;border:1px solid #dfe4e8;border-radius:7px;padding:0 9px;outline:none}.field input:disabled{background:#f5f7f8;color:#8b959d}.status-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}.metric{padding:13px 14px;border:1px solid var(--line);border-radius:9px;background:#fff}.metric span{display:block;color:#87929b;font-size:9px}.metric b{display:block;margin-top:5px;font-size:19px}.notice{margin-bottom:12px;padding:10px 12px;border-radius:8px;background:#f7f9fa;color:#75818a;font-size:10px;line-height:1.55}.notice.exempt{background:#edf8f3;color:#37745a}.tools{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 8px}.tools strong{font-size:12px}.tools-right{display:flex;gap:6px}.search{width:220px;height:34px;border:1px solid #dfe4e8;border-radius:7px;padding:0 9px;font-size:10px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:9px}.targets{width:100%;min-width:760px;border-collapse:collapse}.targets th{height:36px;padding:0 10px;background:#fafbfc;border-bottom:1px solid var(--line);color:#7b8790;font-size:9.5px;text-align:left}.targets td{padding:9px 10px;border-bottom:1px solid #eef1f3;color:#53606a;font-size:10.5px}.targets tr:last-child td{border-bottom:0}.targets tr.exempt-row{background:#fbfdfc}.targets input[type=checkbox]{width:15px;height:15px;accent-color:var(--blue)}.workers{width:90px;height:31px;border:1px solid #dfe4e8;border-radius:6px;padding:0 7px;font-size:10px}.reason{color:#8b959d;font-size:9.5px;line-height:1.4}.score{color:#267054;font-weight:750}.foot{display:flex;align-items:center;justify-content:flex-end;gap:7px;margin-top:13px}.saved{margin-right:auto;color:#4f7d69;font-size:10px}.loading{padding:36px;text-align:center;color:#89949c;font-size:11px}.modal{position:fixed;inset:0;background:rgba(20,31,40,.38);display:grid;place-items:center;padding:20px;z-index:80}.modal-box{width:min(520px,94vw);background:#fff;border-radius:12px;overflow:hidden}.modal-head{padding:16px 18px;border-bottom:1px solid var(--line);font-size:14px;font-weight:750}.modal-body{padding:18px}.modal-actions{padding:13px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:7px}.modal-body select{width:100%;height:40px;border:1px solid #dfe4e8;border-radius:7px;padding:0 9px}.modal-body p{color:#7b8790;font-size:10.5px;line-height:1.6}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static}.form{grid-template-columns:1fr 1fr}.form .name{grid-column:1/-1}.status-strip{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.shell{width:calc(100% - 24px)}.header{padding:0 12px}.brand small,.user{display:none}.page-head{flex-direction:column}.form{grid-template-columns:1fr}.form .name{grid-column:auto}.status-strip{grid-template-columns:1fr 1fr}.tools{align-items:flex-start;flex-direction:column}.tools-right{width:100%}.search{width:100%}}
</style></head>
<body>
<header class="header"><button class="brand" id="homeBtn"><img src="/hniruja-logo.png" alt="Hniruja"><span>협력사 EHS 포털</span><small>평가회차 운영</small></button><div class="head"><span id="userLabel" class="user"></span><button id="refreshBtn" class="icon" aria-label="새로고침">↻</button></div></header>
<main class="shell"><div class="page-head"><div><h1>평가회차 운영</h1><p>사용중 평가표를 실제 상·하반기 평가에 연결하고 대상 협력사를 확정합니다.</p></div><div class="actions"><button class="btn" onclick="location.href='/evaluation-management.html'">평가표 관리</button><button class="btn primary" id="createBtn">평가표 연결</button></div></div><section class="layout"><aside class="card side"><div class="card-head"><strong>평가회차</strong></div><div id="cycleList"><div class="loading">불러오는 중...</div></div></aside><section class="card"><div id="workspace"><div class="empty">평가회차를 선택하거나 평가표를 연결하세요.</div></div></section></section></main>
<div id="modal" class="modal hidden"><div class="modal-box"><div class="modal-head">사용중 평가표 연결</div><div class="modal-body"><select id="templateSelect"></select><p>평가표의 연도·상/하반기를 기준으로 회차가 생성됩니다. 같은 연도·반기에는 하나의 평가회차만 운영할 수 있습니다.</p></div><div class="modal-actions"><button class="btn" id="modalCancel">취소</button><button class="btn primary" id="modalCreate">연결</button></div></div></div>
<script>
const API_ORIGIN=location.hostname==='ipass.i-pass-eval.workers.dev'?'':'https://ipass.i-pass-eval.workers.dev',KEY='ipass.session.v10',FIREBASE_API_KEY='AIzaSyC0s7buQaayKr84QA_wFNyF6rcs6w1-IoU';let session=null,user=null,data=null,current=null,targets=[],dirty=false;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');function half(h){return h==='first'?'상반기':'하반기'}function status(s){return s==='active'?'진행중':s==='closed'?'종료':'준비중'}function statusClass(s){return s==='active'?'active':s==='closed'?'closed':'draft'}
async function refreshToken(){const body=new URLSearchParams({grant_type:'refresh_token',refresh_token:session.refreshToken});const r=await fetch(`https://securetoken.googleapis.com/v1/token?key=${encodeURIComponent(FIREBASE_API_KEY)}`,{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body});const d=await r.json();if(!r.ok)throw new Error('로그인 세션이 만료되었습니다.');session.idToken=d.id_token;session.refreshToken=d.refresh_token||session.refreshToken;session.expiresAt=Date.now()+Number(d.expires_in||3600)*1000;sessionStorage.setItem(KEY,JSON.stringify(session))}async function api(path,opt={},retry=true){if(Date.now()>Number(session?.expiresAt||0)-60000)await refreshToken();let r=await fetch(API_ORIGIN+path,{...opt,headers:{Accept:'application/json',Authorization:`Bearer ${session.idToken}`,...(opt.body?{'content-type':'application/json'}:{}),...(opt.headers||{})}});if(r.status===401&&retry){await refreshToken();return api(path,opt,false)}const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}
function renderList(){const list=data?.cycles||[];$('cycleList').innerHTML=list.length?list.map(c=>`<button class="cycle-btn ${current?.id===c.id?'active':''}" data-id="${esc(c.id)}"><div class="cycle-title">${c.year}년 ${half(c.half)}</div><div class="cycle-meta">${esc(c.template_name||'')} · <span class="tag ${statusClass(c.status)}">${status(c.status)}</span></div></button>`).join(''):'<div class="empty">연결된 평가회차가 없습니다.</div>';$('cycleList').querySelectorAll('.cycle-btn').forEach(b=>b.onclick=()=>loadBundle(b.dataset.id))}
function selectedCount(){return targets.filter(x=>Number(x.is_selected)===1).length}function exemptCount(){return targets.filter(x=>x.exemption_type==='ipass_excellent').length}function stateCount(...s){return targets.filter(x=>Number(x.is_selected)===1&&s.includes(x.status)).length}
function render(){renderList();if(!current){$('workspace').innerHTML='<div class="empty">평가회차를 선택하거나 평가표를 연결하세요.</div>';return}const editable=current.status==='draft';$('workspace').innerHTML=`<div class="card-head"><strong>${esc(current.cycle_name)}</strong><span class="tag ${statusClass(current.status)}">${status(current.status)}</span></div><div class="editor"><div class="form"><div class="field"><label>평가 시작일</label><input id="startAt" type="date" value="${esc(current.start_at||'')}" ${editable?'':'disabled'}></div><div class="field"><label>평가 종료일</label><input id="endAt" type="date" value="${esc(current.end_at||'')}" ${editable?'':'disabled'}></div><div class="field name"><label>회차명</label><input id="cycleName" value="${esc(current.cycle_name||'')}" ${editable?'':'disabled'}></div></div><div class="status-strip"><div class="metric"><span>평가대상</span><b>${selectedCount()}개사</b></div><div class="metric"><span>상반기 면제</span><b>${exemptCount()}개사</b></div><div class="metric"><span>제출완료</span><b>${stateCount('submitted','evaluating','completed','published')}개사</b></div><div class="metric"><span>평가완료</span><b>${stateCount('completed','published')}개사</b></div></div>${current.half==='first'?`<div class="notice exempt">전년도 i-PaSS ${Number(data.policy?.excellence_threshold??90)}점 이상 협력사는 상반기 평가대상에서 자동 제외됩니다. 면제사는 해당 연도 하반기 평가가 ${Number(data.policy?.exempt_second_half_weight??80)}%로 반영됩니다.</div>`:''}<div class="tools"><strong>대상 협력사</strong><div class="tools-right">${editable?'<button class="btn" id="selectAll">면제 제외 전체 선택</button><button class="btn" id="clearAll">전체 해제</button>':''}<input id="search" class="search" placeholder="협력사 검색"></div></div><div class="table-wrap"><table class="targets"><thead><tr><th style="width:52px">대상</th><th>협력사</th><th>업종</th><th style="width:110px">상시근로자</th><th>제외/면제 사유</th><th style="width:90px">전년 점수</th></tr></thead><tbody id="targetBody"></tbody></table></div><div class="foot"><span id="saved" class="saved"></span>${editable?'<button class="btn" id="saveBtn">저장</button><button class="btn primary" id="startBtn">평가 시작</button>':current.status==='active'?'<button class="btn danger" id="closeBtn">평가 종료</button>':'<button class="btn" disabled>종료된 평가</button>'}</div></div>`;renderTargets();bind()}
function renderTargets(q=''){const editable=current.status==='draft',s=String(q||'').trim().toLowerCase();const list=targets.filter(x=>!s||`${x.company_name} ${x.industry_name||''}`.toLowerCase().includes(s));$('targetBody').innerHTML=list.map(x=>{const exempt=x.exemption_type==='ipass_excellent';return `<tr class="${exempt?'exempt-row':''}" data-id="${esc(x.company_id)}"><td><input class="sel" type="checkbox" ${Number(x.is_selected)===1?'checked':''} ${!editable||exempt?'disabled':''}></td><td><b>${esc(x.company_name)}</b></td><td>${esc(x.industry_name||'-')}</td><td><input class="workers" type="number" min="0" value="${x.worker_count??''}" ${editable&&!exempt?'':'disabled'}></td><td class="reason">${exempt?`<span class="tag active">상반기 면제</span> ${esc(x.exclusion_reason||'')}`:Number(x.is_selected)===1?'-':esc(x.exclusion_reason||'평가대상 제외')}</td><td>${x.previous_ipass_score==null?'-':`<span class="score">${Number(x.previous_ipass_score)}점</span>`}</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">검색 결과가 없습니다.</td></tr>';if(editable){$('targetBody').querySelectorAll('tr[data-id]').forEach(tr=>{const t=targets.find(x=>x.company_id===tr.dataset.id),c=tr.querySelector('.sel'),w=tr.querySelector('.workers');if(c)c.onchange=()=>{t.is_selected=c.checked?1:0;t.exclusion_reason=c.checked?null:'관리자 평가대상 제외';dirty=true;render()};if(w)w.onchange=()=>{t.worker_count=w.value===''?null:Math.max(0,Math.round(Number(w.value)||0));dirty=true}})}}
function bind(){if($('search'))$('search').oninput=e=>renderTargets(e.target.value);if($('selectAll'))$('selectAll').onclick=()=>{targets.forEach(x=>{if(x.exemption_type!=='ipass_excellent'){x.is_selected=1;x.exclusion_reason=null}});dirty=true;render()};if($('clearAll'))$('clearAll').onclick=()=>{targets.forEach(x=>{if(x.exemption_type!=='ipass_excellent'){x.is_selected=0;x.exclusion_reason='관리자 평가대상 제외'}});dirty=true;render()};if($('saveBtn'))$('saveBtn').onclick=saveCycle;if($('startBtn'))$('startBtn').onclick=startCycle;if($('closeBtn'))$('closeBtn').onclick=closeCycle;['startAt','endAt','cycleName'].forEach(id=>{if($(id))$(id).oninput=()=>dirty=true})}
async function saveCycle(){try{const body={start_at:$('startAt').value,end_at:$('endAt').value,cycle_name:$('cycleName').value.trim(),targets:targets.map(x=>({company_id:x.company_id,is_selected:Number(x.is_selected)===1,exclusion_reason:x.exclusion_reason,worker_count:x.worker_count}))};await api(`/api/admin/evaluation-runtime/cycles/${encodeURIComponent(current.id)}`,{method:'PATCH',body:JSON.stringify(body)});dirty=false;$('saved').textContent='✓ 저장됨';await loadBundle(current.id)}catch(e){alert(e.message)}}async function startCycle(){if(dirty)await saveCycle();if(!confirm('평가를 시작할까요? 시작 후 평가표·기간·대상 협력사를 변경할 수 없습니다.'))return;try{await api(`/api/admin/evaluation-runtime/cycles/${encodeURIComponent(current.id)}/start`,{method:'POST',body:'{}'});dirty=false;await loadBundle(current.id)}catch(e){alert(e.message)}}async function closeCycle(){if(!confirm('이 평가회차를 종료할까요? 연결된 평가표도 잠금 처리됩니다.'))return;try{await api(`/api/admin/evaluation-runtime/cycles/${encodeURIComponent(current.id)}/close`,{method:'POST',body:'{}'});await loadBundle(current.id)}catch(e){alert(e.message)}}
function openCreate(){const used=new Set((data.cycles||[]).map(c=>c.template_id)),available=(data.templates||[]).filter(t=>!used.has(t.id));if(!available.length)return alert('연결 가능한 사용중 평가표가 없습니다. 평가표 관리에서 먼저 사용 시작하세요.');$('templateSelect').innerHTML=available.map(t=>`<option value="${esc(t.id)}">${t.year}년 ${half(t.half)} · ${esc(t.name)}</option>`).join('');$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}$('createBtn').onclick=openCreate;$('modalCancel').onclick=closeModal;$('modalCreate').onclick=async()=>{try{const d=await api('/api/admin/evaluation-runtime/cycles',{method:'POST',body:JSON.stringify({template_id:$('templateSelect').value})});closeModal();await loadBundle(d.cycle.id)}catch(e){alert(e.message)}};
async function loadBundle(id=''){if(dirty&&!confirm('저장하지 않은 변경사항이 있습니다. 이동할까요?'))return;dirty=false;$('workspace').innerHTML='<div class="loading">불러오는 중...</div>';try{data=await api(`/api/admin/evaluation-runtime${id?`?cycle_id=${encodeURIComponent(id)}`:''}`);current=data.cycle||null;targets=data.companies||[];render()}catch(e){$('workspace').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}$('homeBtn').onclick=()=>{if(!dirty||confirm('저장하지 않은 변경사항이 있습니다. 이동할까요?'))location.href='/'};$('refreshBtn').onclick=()=>loadBundle(current?.id||'');window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
(async()=>{try{session=JSON.parse(sessionStorage.getItem(KEY)||'null');if(!session){location.href='/';return}const me=await api('/api/me');if(me.auth_state!=='approved'||me.user?.role!=='admin'){alert('관리자만 사용할 수 있습니다.');location.href='/';return}user=me.user;$('userLabel').textContent=user.name||user.email||'';await loadBundle()}catch(e){$('workspace').innerHTML=`<div class="empty">${esc(e.message)}</div>`}})();
</script></body></html>
