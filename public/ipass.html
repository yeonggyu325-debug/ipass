<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>i-PaSS | Hniruja EHS</title>
<style>
:root{--blue:#2878b5;--blue2:#226b9f;--ink:#20313d;--text:#52636f;--muted:#87949d;--line:#e0e6ea;--page:#f3f6f8;--card:#fff;--green:#237557;--greenbg:#edf7f2;--orange:#9d671b;--orangebg:#fff6e8;--red:#b64c46;--redbg:#fff0ef;--shadow:0 5px 18px rgba(30,48,62,.05)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Segoe UI",sans-serif;background:var(--page);color:var(--ink);letter-spacing:-.018em}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.header{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;position:sticky;top:0;z-index:30}.header-inner{width:min(1440px,calc(100% - 48px));margin:auto;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--ink);font-weight:800}.brand img{height:31px}.brand-copy{display:flex;align-items:center;gap:9px}.brand-title{font-size:14px}.brand-chip{height:23px;padding:0 9px;display:inline-flex;align-items:center;border-radius:6px;background:#eaf3f8;color:#286d99;font-size:10px;font-weight:800}.header-actions{display:flex;align-items:center;gap:9px}.user{color:#778792;font-size:11px}.header-btn{height:38px;padding:0 12px;border:1px solid #dce3e7;border-radius:8px;background:#fff;color:#566a77;font-size:11px;font-weight:700}.header-btn:hover{background:#f6f8fa}
.shell{width:min(1520px,calc(100% - 48px));margin:0 auto;padding:26px 0 60px}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:15px}.eyebrow{color:#6d8494;font-size:9.5px;font-weight:800;letter-spacing:.11em}.hero h1{margin:5px 0 0;font-size:28px;letter-spacing:-.045em}.hero p{margin:7px 0 0;color:var(--muted);font-size:11.5px}.role-badge{padding:6px 10px;border-radius:7px;background:#eef3f6;color:#627785;font-size:10px;font-weight:800}
.layout{display:block}.workspace-nav{width:100%;margin-bottom:15px;padding:5px;display:flex;align-items:center;gap:5px;overflow-x:auto;border:0;border-radius:12px;background:#e9eef2;box-shadow:none;scrollbar-width:thin}.nav-btn{min-width:132px;flex:1;height:42px;border:0;border-radius:9px;background:transparent;color:#667782;padding:0 14px;font-size:11.5px;font-weight:750;display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;box-shadow:none}.nav-btn:hover{background:rgba(255,255,255,.58);color:#2d678e}.nav-btn.active{background:#fff;color:#24658f;box-shadow:0 4px 13px rgba(30,52,68,.09)}.nav-btn .arrow{display:none}
.content{min-width:0}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}.panel+.panel{margin-top:14px}.panel-head{min-height:58px;padding:0 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-head strong{font-size:14px}.panel-head span{color:var(--muted);font-size:10px}.panel-body{padding:18px}.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}.kpi{position:relative;background:#fff;border:1px solid var(--line);border-radius:11px;padding:16px;overflow:hidden}.kpi:before{content:'';position:absolute;left:0;top:0;right:0;height:3px;background:#dce7ed}.kpi.attention:before{background:#d69a47}.kpi span{display:block;color:#7d8b95;font-size:10px;font-weight:700}.kpi b{display:block;margin-top:8px;font-size:24px;letter-spacing:-.04em}.kpi.attention b{color:#9d671b}.quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.quick{min-height:112px;border:1px solid var(--line);border-radius:11px;background:#fff;text-align:left;padding:16px;transition:.14s}.quick:hover{border-color:#b9cbd6;box-shadow:0 8px 22px rgba(30,48,62,.07);transform:translateY(-1px)}.quick strong{display:block;font-size:13px;color:#304653}.quick span{display:block;margin-top:6px;color:#8c99a2;font-size:10.5px;line-height:1.55}.quick em{display:block;margin-top:14px;color:#2c719d;font-style:normal;font-size:10px;font-weight:800}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th{background:#f3f7f9;color:#607683;font-size:10.5px;font-weight:800}th,td{padding:13px 14px;border-bottom:1px solid #e9edf0;text-align:left}td{color:#475b67;font-size:11px}tbody tr:last-child td{border-bottom:0}.status{display:inline-flex;align-items:center;padding:4px 7px;border-radius:6px;font-size:9px;font-weight:800}.status.green{background:var(--greenbg);color:var(--green)}.status.orange{background:var(--orangebg);color:var(--orange)}.status.gray{background:#f1f3f5;color:#717c84}.status.blue{background:#edf5fa;color:#35739c}.status.red{background:var(--redbg);color:var(--red)}.eval-row{cursor:pointer}.eval-row:hover td{background:#f9fbfc}.empty,.loading,.error{padding:36px;text-align:center;color:#8a969f;font-size:11px}.error{color:var(--red)}
.score-card{display:grid;grid-template-columns:minmax(220px,.6fr) minmax(0,1.4fr);gap:18px;align-items:center}.score-main{padding:20px}.score-label{color:#7e8d97;font-size:10px;font-weight:700}.score-line{display:flex;align-items:flex-end;gap:6px;margin-top:8px}.score-value{font-size:46px;line-height:1;font-weight:820;letter-spacing:-.055em;color:#18394d}.score-unit{padding-bottom:5px;color:#929da5;font-size:11px}.score-grade{display:inline-flex;margin-top:11px;padding:5px 8px;border-radius:6px;background:#edf5fa;color:#34729a;font-size:9px;font-weight:800}.formula{padding:16px;border:1px solid #e1e7eb;border-radius:10px;background:#f6f9fa;color:#677984;font-size:10.5px;line-height:1.65}.formula b{color:#425966}.iframe-wrap{height:calc(100vh - 190px);min-height:760px;background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:var(--shadow)}.iframe-wrap iframe{width:100%;height:100%;border:0;background:#f5f7f9}
@media(max-width:980px){.kpis{grid-template-columns:repeat(3,1fr)}.quick-grid{grid-template-columns:1fr 1fr}.score-card{grid-template-columns:1fr}}
@media(max-width:640px){.header-inner,.shell{width:calc(100% - 24px)}.brand-title{display:none}.user{display:none}.shell{padding-top:20px}.hero{align-items:flex-start;flex-direction:column}.hero h1{font-size:24px}.kpis{grid-template-columns:1fr 1fr}.quick-grid{grid-template-columns:1fr}.iframe-wrap{height:calc(100vh - 180px);min-height:640px}}
</style>
<script src="/shared/auth.js?v=3"></script>
<script src="/shared/api.js?v=3"></script>
</head>
<body>
<header class="header"><div class="header-inner"><button class="brand" id="brandBtn" type="button"><img src="/hniruja-logo.png" alt="Hniruja"><span class="brand-copy"><span class="brand-title">협력사 EHS 포털</span><span class="brand-chip">i-PaSS</span></span></button><div class="header-actions"><span id="userLabel" class="user"></span><button class="header-btn" id="homeBtn" type="button">포털 홈</button></div></div></header>
<main class="shell" id="ipassShell"><div class="hero"><div><div class="eyebrow">INTEGRATED i-PaSS WORKSPACE</div><h1 id="workspaceTitle">i-PaSS</h1><p id="heroMeta"></p></div><span id="roleBadge" class="role-badge"></span></div><div class="layout"><nav class="workspace-nav" id="sideNav" aria-label="i-PaSS 업무 메뉴"></nav><section class="content" id="content"><div class="panel"><div class="loading">i-PaSS 업무공간을 불러오는 중...</div></div></section></div></main>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');let user=null;
const api=(path,opt={})=>window.EHSApi.request(path,opt);
function statusLabel(s){const m={not_started:['작성전','gray'],in_progress:['작성중','orange'],submitted:['제출완료','green'],evaluating:['평가중','orange'],completed:['평가완료','blue'],published:['결과공개','green']};const v=m[s]||[s||'-','gray'];return `<span class="status ${v[1]}">${esc(v[0])}</span>`}
function route(){const p=location.pathname.replace(/\/+$/,'')||'/ipass';if(p==='/ipass/templates')return'templates';if(p==='/ipass/cycles')return'cycles';if(p==='/ipass/evaluations')return'evaluations';return'overview'}
function navItems(){return user?.role==='admin'?[['overview','/ipass','종합현황'],['evaluations','/ipass/evaluations','평가 현황'],['templates','/ipass/templates','평가표 관리'],['cycles','/ipass/cycles','평가회차 운영']]:[['overview','/ipass','내 i-PaSS'],['evaluations','/ipass/evaluations','내 평가']]}
function renderNav(){const active=route();$('sideNav').innerHTML=navItems().map(([key,path,label])=>`<button class="nav-btn ${active===key?'active':''}" type="button" data-route="${path}" ${active===key?'aria-current="page"':''}><span>${label}</span></button>`).join('');$('sideNav').querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>go(b.dataset.route))}
function go(path){if(location.pathname!==path)history.pushState({},'',path);renderNav();renderRoute()}window.addEventListener('popstate',()=>{renderNav();renderRoute()});
function panel(title,meta,body){return `<section class="panel"><div class="panel-head"><strong>${esc(title)}</strong><span>${esc(meta||'')}</span></div>${body}</section>`}
async function renderAdminOverview(){const box=$('content');box.innerHTML='<div class="panel"><div class="loading">종합현황을 불러오는 중...</div></div>';try{const d=await api('/api/admin/dashboard-bundle');const a=d.dashboard||{},cycle=d.cycles?.[0],target=Number(a.target_company_count||0),submitted=Number(a.submitted_count||0);box.innerHTML=`<div class="kpis"><div class="kpi"><span>평가대상</span><b>${target}</b></div><div class="kpi"><span>제출완료</span><b>${submitted}</b></div><div class="kpi"><span>평가중</span><b>${Number(a.evaluating_count||0)}</b></div><div class="kpi"><span>평가완료</span><b>${Number(a.completed_count||0)}</b></div><div class="kpi attention"><span>미제출</span><b>${Math.max(0,target-submitted)}</b></div></div>${panel('현재 평가회차',cycle?`${cycle.cycle_name} · ${cycle.start_at||'-'} ~ ${cycle.end_at||'-'}`:'운영 중인 평가회차가 없습니다.',`<div class="panel-body"><div class="quick-grid"><button class="quick" data-go="/ipass/evaluations"><strong>평가 현황</strong><span>협력사별 제출 및 평가 진행상태를 확인합니다.</span><em>현황 보기 ›</em></button><button class="quick" data-go="/ipass/templates"><strong>평가표 관리</strong><span>상·하반기 평가항목, 배점, 제출가이드와 N/A 기준을 관리합니다.</span><em>평가표 열기 ›</em></button><button class="quick" data-go="/ipass/cycles"><strong>평가회차 운영</strong><span>평가기간과 평가대상 협력사를 확정하고 회차를 시작·종료합니다.</span><em>회차 운영 ›</em></button></div></div>`)}`;box.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}catch(e){box.innerHTML=`<div class="panel"><div class="error">${esc(e.message)}</div></div>`}}
async function renderAdminEvaluations(){const box=$('content');box.innerHTML='<div class="panel"><div class="loading">평가현황을 불러오는 중...</div></div>';try{const d=await api('/api/admin/dashboard-bundle'),list=(d.targets||[]).filter(x=>Number(x.is_selected)===1),cycle=d.cycles?.[0];box.innerHTML=panel('협력사 평가 현황',cycle?cycle.cycle_name:'현재 평가회차',list.length?`<div class="table-wrap"><table><thead><tr><th>협력사</th><th>업종</th><th>상시근로자</th><th>제출일</th><th>상태</th></tr></thead><tbody>${list.map(x=>{const ready=['submitted','evaluating','completed','published'].includes(x.status);return `<tr class="${ready?'eval-row':''}" ${ready?`data-score-target="${esc(x.id)}"`:''}><td><b>${esc(x.company_name)}</b></td><td>${esc(x.industry_name||'-')}</td><td>${x.worker_count??'-'}</td><td>${esc(x.submitted_at?String(x.submitted_at).slice(0,10):'-')}</td><td>${statusLabel(x.status)}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">현재 평가대상이 없습니다.</div>');box.querySelectorAll('[data-score-target]').forEach(r=>r.onclick=()=>location.href='/evaluation-scoring.html?target='+encodeURIComponent(r.dataset.scoreTarget))}catch(e){box.innerHTML=`<div class="panel"><div class="error">${esc(e.message)}</div></div>`}}
let partnerDataPromise=null;
function partnerData(){if(!partnerDataPromise){const year=new Date().getFullYear();partnerDataPromise=Promise.all([api(`/api/annual-ipass?year=${year}`).catch(()=>({annual:{}})),api('/api/my/evaluations')]).then(([annual,evals])=>({year,annual:annual.annual||{},list:evals.evaluations||[]}))}return partnerDataPromise}
function partnerTable(list){return list.length?`<div class="table-wrap"><table><thead><tr><th>평가회차</th><th>기간</th><th>상태</th></tr></thead><tbody>${list.map(x=>`<tr class="eval-row" tabindex="0" data-target="${esc(x.id)}"><td><b>${esc(x.cycle_name)}</b></td><td>${esc((x.start_at||'-')+' ~ '+(x.end_at||'-'))}</td><td>${statusLabel(x.status)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">현재 배정된 평가가 없습니다.</div>'}
function bindPartnerRows(box){box.querySelectorAll('[data-target]').forEach(r=>{const open=()=>location.href='/evaluation-submit.html?target='+encodeURIComponent(r.dataset.target);r.onclick=open;r.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}})}
function submissionReturnNotice(){const params=new URLSearchParams(location.search);if(params.get('submitted')!=='1')return'';const duration=Math.max(0,Math.min(120000,Number(params.get('duration_ms')||0)));params.delete('submitted');params.delete('duration_ms');history.replaceState({},'',location.pathname+(params.size?'?'+params.toString():'')+location.hash);return `<div class="route-notice" role="status">평가자료가 제출되었습니다.${duration?` 처리시간 ${(duration/1000).toFixed(1)}초.`:''} 최신 상태를 반영했습니다.</div>`}
async function renderPartnerOverview(){const box=$('content');box.innerHTML='<div class="panel"><div class="loading">i-PaSS 정보를 불러오는 중...</div></div>';try{const {year,annual:a,list}=await partnerData(),total=a.final_total??a.current_reflected_score,max=a.final_total!=null?100:(a.current_reflected_max||60),score=total==null?'—':Number(total).toFixed(Number(total)%1?1:0),grade=a.final_grade||'산정 중',active=list.filter(x=>!['completed','published'].includes(x.status)).slice(0,3);box.innerHTML=`${panel(`${year}년 i-PaSS`,grade,`<div class="panel-body"><div class="score-card"><div class="score-main"><div class="score-label">현재 반영점수</div><div class="score-line"><span class="score-value">${score}</span><span class="score-unit">/ ${max}점</span></div><span class="score-grade">${esc(grade)}</span></div><div class="formula"><b>연간 i-PaSS</b><br>상반기 40점 + 하반기 40점 + 협의체 10점 + 산업재해 10점 − 불합리 적발 감점</div></div></div>`) }${panel('진행 중인 평가','최근 업무만 보여드립니다. 전체 이력은 내 평가에서 확인하세요.',partnerTable(active))}`;bindPartnerRows(box)}catch(e){box.innerHTML=`<div class="panel"><div class="error">${esc(e.message)}</div></div>`}}
async function renderPartnerEvaluations(){const box=$('content');box.innerHTML='<div class="panel"><div class="loading">평가 이력을 불러오는 중...</div></div>';try{const {list}=await partnerData(),open=list.filter(x=>['not_started','in_progress'].includes(x.status)).length,review=list.filter(x=>['submitted','evaluating'].includes(x.status)).length,done=list.filter(x=>['completed','published'].includes(x.status)).length;box.innerHTML=`${submissionReturnNotice()}<div class="kpis partner-kpis"><div class="kpi"><span>전체 평가</span><b>${list.length}</b></div><div class="kpi"><span>작성 필요</span><b>${open}</b></div><div class="kpi"><span>심사 중</span><b>${review}</b></div><div class="kpi"><span>완료</span><b>${done}</b></div></div>${panel('내 평가 전체 이력','평가행을 선택하면 제출 화면으로 이동합니다.',partnerTable(list))}`;bindPartnerRows(box)}catch(e){box.innerHTML=`<div class="panel"><div class="error">${esc(e.message)}</div></div>`}}
function renderIframe(type){if(user?.role!=='admin'){go('/ipass');return}const src=type==='templates'?'/evaluation-management.html?embedded=1':'/evaluation-cycle.html?embedded=1';$('content').innerHTML=`<div class="iframe-wrap"><iframe src="${src}" title="${type==='templates'?'평가표 관리':'평가회차 운영'}"></iframe></div>`}
function renderRoute(){const r=route();if(user?.role!=='admin')return r==='evaluations'?renderPartnerEvaluations():renderPartnerOverview();if(r==='templates')return renderIframe('templates');if(r==='cycles')return renderIframe('cycles');if(r==='evaluations')return renderAdminEvaluations();return renderAdminOverview()}
function goHome(){location.href='/home'}$('homeBtn').onclick=goHome;$('brandBtn').onclick=goHome;
(async function boot(){try{user=await window.EHSAuth.requireUser();window.__EHS_PAGE_USER=user;document.dispatchEvent(new CustomEvent('ehs:user-ready',{detail:user}));$('userLabel').textContent=[user.company_name,user.name].filter(Boolean).join(' · ');$('roleBadge').textContent=user.role==='admin'?'관리자':'협력사';$('workspaceTitle').textContent=user.role==='admin'?'i-PaSS 관리':'내 i-PaSS';$('heroMeta').textContent=user.role==='admin'?'평가 현황, 평가표, 평가회차를 넓은 통합 업무공간에서 관리합니다.':'연간 점수와 이행수준평가 진행상태를 한눈에 확인합니다.';if(user.role!=='admin'&&!['/ipass','/ipass/','/ipass/evaluations'].includes(location.pathname))history.replaceState({},'', '/ipass');renderNav();renderRoute()}catch(e){if(e?.status===401)return;$('content').innerHTML=`<div class="panel"><div class="error">${esc(window.EHSApi?.describe?window.EHSApi.describe(e):e.message)}</div></div>`}})();
</script>
</body>
</html>
