<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--blue:#2878d4;--blue2:#1f69bd;--ink:#1f2933;--text:#4b5965;--muted:#8c98a2;--line:#e6eaed;--page:#f5f7f9;--card:#fff;--green:#167a57;--green-bg:#edf8f3;--orange:#a86a13;--orange-bg:#fff6e8;--red:#bd4e47;--red-bg:#fff0ef;--gray:#6f7a83;--gray-bg:#f1f3f5;--shadow:0 8px 26px rgba(30,44,58,.045)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Segoe UI",sans-serif;background:var(--page);color:var(--ink);letter-spacing:-.018em}button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.header{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:30}.brand{display:flex;align-items:center;gap:11px;border:0;background:none;color:var(--ink);font-weight:760}.brand img{height:26px}.brand small{padding-left:11px;border-left:1px solid var(--line);color:#89949d;font-size:11px;font-weight:650}.header-right{display:flex;align-items:center;gap:10px}.user{max-width:220px;color:#6f7c86;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.home-btn{height:36px;padding:0 12px;border:1px solid #dde3e7;border-radius:8px;background:#fff;color:#62717c;font-size:10.5px;font-weight:700}
.shell{max-width:1440px;margin:0 auto;padding:28px 28px 56px}.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end;margin-bottom:18px}.eyebrow{color:#7990a1;font-size:10px;font-weight:800;letter-spacing:.08em}.hero h1{margin:6px 0 0;font-size:28px;letter-spacing:-.045em}.hero-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{display:inline-flex;align-items:center;min-height:27px;padding:0 9px;border-radius:999px;background:#eef4f8;color:#4d7189;font-size:10px;font-weight:720}.chip.gray{background:var(--gray-bg);color:var(--gray)}.chip.green{background:var(--green-bg);color:var(--green)}.chip.orange{background:var(--orange-bg);color:var(--orange)}.hero-actions{display:flex;gap:8px}.btn{height:40px;padding:0 14px;border:1px solid #dfe4e8;border-radius:9px;background:#fff;color:#56646f;font-size:11px;font-weight:740}.btn:hover{background:#f8fafb}.btn.primary{border-color:var(--blue);background:var(--blue);color:#fff}.btn.primary:hover{background:var(--blue2)}.btn:disabled{opacity:.45;cursor:not-allowed}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}.metric{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 17px;box-shadow:var(--shadow)}.metric span{display:block;color:#87939c;font-size:9.5px;font-weight:720}.metric b{display:block;margin-top:8px;font-size:24px;letter-spacing:-.04em}.metric.progress b{color:var(--blue)}.metric.warn b{color:var(--orange)}
.progressbar{height:8px;margin:0 0 18px;border-radius:999px;background:#e9edf0;overflow:hidden}.progressbar span{display:block;height:100%;background:var(--blue);transition:width .2s ease}
.layout{display:grid;grid-template-columns:264px minmax(0,1fr);gap:14px;align-items:start}.sidebar{position:sticky;top:82px;background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:var(--shadow)}.sidebar-head{padding:15px 16px;border-bottom:1px solid var(--line)}.sidebar-head strong{display:block;font-size:13px}.sidebar-head span{display:block;margin-top:5px;color:#949da5;font-size:9.5px}.nav-list{max-height:calc(100vh - 200px);overflow:auto;padding:8px}.nav-cat{margin:9px 7px 4px;color:#7b8791;font-size:10px;font-weight:800}.nav-item{width:100%;min-height:40px;border:0;border-radius:8px;background:#fff;text-align:left;padding:8px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;color:#53616b}.nav-item:hover{background:#f7f9fa}.nav-item.active{background:#eef5fa;color:#276e9e}.nav-name{font-size:10.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nav-state{font-size:9px;color:#97a1a8}.nav-state.done{color:var(--green)}.nav-state.na{color:#89949c}.content{min-width:0}.profile-card,.item-card,.submit-card{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}.card-head{min-height:54px;padding:0 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.card-head strong{font-size:13px}.card-head span{font-size:9.5px;color:#8f9aa2}.profile-body{padding:16px 18px}.profile-grid{display:grid;grid-template-columns:1fr 1fr 160px;gap:10px}.field label{display:block;margin-bottom:6px;color:#7a8791;font-size:9.5px;font-weight:720}.field input,.field textarea{width:100%;border:1px solid #dfe4e8;border-radius:8px;background:#fff;color:#394650;outline:none}.field input{height:40px;padding:0 10px}.field textarea{min-height:112px;padding:11px 12px;resize:vertical;line-height:1.62}.field input:focus,.field textarea:focus{border-color:#86b4d7;box-shadow:0 0 0 3px rgba(40,120,212,.08)}.profile-actions{display:flex;justify-content:flex-end;margin-top:10px}.saved{color:var(--green)!important;font-weight:700}.error-text{color:var(--red)!important}
.item-card.na{background:#fbfcfd}.item-head{padding:16px 18px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start}.item-title-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.item-code{color:#7e8b95;font-size:9.5px;font-weight:800}.item-title{font-size:15px;font-weight:760}.score-badge{display:inline-flex;align-items:center;height:25px;padding:0 8px;border-radius:999px;background:#eef5fa;color:#34719c;font-size:9.5px;font-weight:800}.bonus{background:#fff5e9;color:#a96916}.na-badge{background:#f1f3f5;color:#757f87}.item-category{margin-top:6px;color:#96a0a7;font-size:9.5px}.guide-btn{width:32px;height:32px;border:1px solid #dbe3e8;border-radius:50%;background:#fff;color:#4d7895;font-size:12px;font-weight:800}.guide-btn:hover{background:#f3f7fa}.item-body{padding:16px 18px}.guide-panel{display:none;margin-bottom:13px;padding:12px 13px;border-radius:9px;background:#f7f9fa;color:#66747e;font-size:10.5px;line-height:1.7;white-space:pre-wrap}.guide-panel.open{display:block}.input-label-row{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:7px}.input-label-row label{color:#68757f;font-size:10px;font-weight:750}.input-label-row span{font-size:9px;color:#9aa3aa}.evidence{margin-top:13px}.evidence-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.evidence-head strong{font-size:10px;color:#68757f}.upload-note{font-size:8.8px;color:#9ca5ac}.upload-row{display:flex;gap:7px;align-items:center}.file-input{display:none}.file-pick{height:34px;padding:0 10px;border:1px solid #dfe4e8;border-radius:7px;background:#fff;color:#64727c;font-size:9.5px;font-weight:700;display:inline-flex;align-items:center}.file-pick.disabled{opacity:.45;cursor:not-allowed}.file-list{margin-top:8px;border-top:1px solid #edf0f2}.file-row{min-height:40px;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;border-bottom:1px solid #f0f2f3}.file-name{font-size:9.8px;color:#58656f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file-size{font-size:8.5px;color:#9da6ac}.file-action{border:0;background:none;color:#517c99;font-size:9px}.file-action.delete{color:#b65b55}.item-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:13px}.save-state{margin-right:auto;color:#8a959d;font-size:9.5px}.save-state.ok{color:var(--green);font-weight:700}.na-copy{padding:13px;border-radius:9px;background:#f3f5f6;color:#77828a;font-size:10.5px;line-height:1.6}.submit-card{padding:18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center}.submit-card h3{margin:0;font-size:14px}.submit-card p{margin:7px 0 0;color:#85919a;font-size:10.5px;line-height:1.6}.submit-card .status{margin-top:8px;font-size:9.5px;color:#65747f}.sticky-submit{display:none}
.modal{position:fixed;inset:0;z-index:80;background:rgba(25,36,46,.38);display:grid;place-items:center;padding:20px}.modal-box{width:min(520px,95vw);background:#fff;border-radius:13px;box-shadow:0 20px 60px rgba(20,34,45,.18);overflow:hidden}.modal-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head strong{font-size:14px}.modal-close{width:32px;height:32px;border:0;border-radius:7px;background:#f3f5f6;color:#687680}.modal-body{padding:18px;color:#5f6d77;font-size:11px;line-height:1.7}.modal-actions{padding:13px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:7px}.loading{padding:44px;text-align:center;color:#8f99a1;font-size:11px}.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:100;min-width:220px;max-width:80vw;padding:11px 14px;border-radius:9px;background:#26323b;color:#fff;font-size:10.5px;text-align:center;box-shadow:0 10px 30px rgba(24,35,44,.2)}
@media(max-width:980px){.layout{grid-template-columns:1fr}.sidebar{position:static}.nav-list{max-height:none;display:flex;gap:6px;overflow:auto;padding:8px}.nav-cat{display:none}.nav-item{min-width:180px}.summary{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.header{padding:0 14px}.brand small{display:none}.user{display:none}.shell{padding:20px 12px 96px}.hero{grid-template-columns:1fr}.hero h1{font-size:24px}.hero-actions{justify-content:flex-start}.summary{grid-template-columns:1fr 1fr;gap:8px}.metric{padding:13px}.metric b{font-size:20px}.profile-grid{grid-template-columns:1fr}.item-head,.item-body,.profile-body{padding-left:14px;padding-right:14px}.submit-card{grid-template-columns:1fr}.submit-card>.btn{display:none}.sticky-submit{position:fixed;left:0;right:0;bottom:0;z-index:25;display:block;padding:10px 12px 12px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);backdrop-filter:blur(12px)}.sticky-submit .btn{width:100%;height:46px}.nav-item{min-width:160px}}
</style>

<body>
<header class="header"><button class="brand" id="brandBtn" type="button"><img src="/hniruja-logo.png" alt="Hniruja"><span>협력사 EHS 포털</span><small>이행수준평가</small></button><div class="header-right"><span id="userLabel" class="user"></span><button class="home-btn" id="homeBtn" type="button">포털 홈</button></div></header>
<main class="shell"><div id="app"><div class="loading" aria-label="평가자료 화면 준비"></div></div></main>
<div id="modal" class="modal hidden"><div class="modal-box"><div class="modal-head"><strong id="modalTitle">확인</strong><button class="modal-close" id="modalClose" type="button">×</button></div><div id="modalBody" class="modal-body"></div><div id="modalActions" class="modal-actions"></div></div></div>
<div id="toast" class="toast hidden"></div>
<script>
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');let user=null,targetId='',data=null,dirty=new Set();
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),2200)}function half(h){return h==='first'?'상반기':'하반기'}function statusText(s){return s==='submitted'?'제출완료':s==='in_progress'?'작성중':s==='evaluating'?'채점중':s==='completed'?'평가완료':s==='published'?'결과공개':'작성전'}function fmtBytes(n){n=Number(n||0);if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(1)+' MB'}
const api=(path,opt={})=>window.EHSApi.request(path,opt);
function modal(title,body,actions=''){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalActions').innerHTML=actions;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}$('modalClose').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};
function itemPrepared(i){return Number(i.applicable)===0||String(i.description||'').trim()||(i.files||[]).length}function grouped(){const map=new Map();for(const i of data.workspace.items||[]){const key=i.parent_category_name||i.category_name||'기타';if(!map.has(key))map.set(key,[]);map.get(key).push(i)}return [...map.entries()]}
function renderNav(){return grouped().map(([cat,items])=>`<div class="nav-cat">${esc(cat)}</div>${items.map(i=>`<button class="nav-item" type="button" data-nav="${esc(i.target_item_state_id)}"><span class="nav-name">${esc((i.item_code?i.item_code+' ':'')+i.item_name)}</span><span class="nav-state ${Number(i.applicable)===0?'na':itemPrepared(i)?'done':''}">${Number(i.applicable)===0?'N/A':itemPrepared(i)?'완료':'미작성'}</span></button>`).join('')}`).join('')}
function evidenceHtml(i){const cap=data.capabilities||{};return `<div class="evidence"><div class="evidence-head"><strong>증빙자료</strong><span class="upload-note">PDF · JPG · PNG · Excel · HWP · PowerPoint · Word · 최대 25MB</span></div>${cap.evidence_upload?`<div class="upload-row"><label class="file-pick" for="file-${esc(i.target_item_state_id)}">+ 파일 첨부</label><input class="file-input" id="file-${esc(i.target_item_state_id)}" data-file-input="${esc(i.target_item_state_id)}" type="file" accept=".pdf,.jpg,.jpeg,.png,.xls,.xlsx,.hwp,.hwpx,.ppt,.pptx,.doc,.docx"></div>`:`<div class="na-copy">증빙파일 저장소가 아직 연결되지 않아 파일 첨부는 현재 사용할 수 없습니다. 설명 입력과 제출은 정상적으로 사용할 수 있습니다.</div>`}<div class="file-list">${(i.files||[]).map(f=>`<div class="file-row"><span class="file-name">${esc(f.file_name)}</span><span class="file-size">${fmtBytes(f.file_size)}</span><span><button class="file-action preview" type="button" data-preview-file="${esc(f.id)}" data-file-name="${esc(f.file_name)}" data-file-size="${Number(f.file_size||0)}" data-content-type="${esc(f.content_type||'')}">미리보기</button><button class="file-action" type="button" data-download="${esc(f.id)}">다운로드</button><button class="file-action delete" type="button" data-delete-file="${esc(f.id)}">삭제</button></span></div>`).join('')}</div></div>`}
function itemCard(i){const na=Number(i.applicable)===0;return `<section class="item-card ${na?'na':''}" id="item-${esc(i.target_item_state_id)}"><div class="item-head"><div><div class="item-title-line"><span class="item-code">${esc(i.item_code||'')}</span><span class="item-title">${esc(i.item_name)}</span><span class="score-badge ${i.item_type==='bonus'?'bonus':''}">${i.item_type==='bonus'?'가점 +':'배점 '}${Number(i.max_score||0)}점</span>${na?'<span class="score-badge na-badge">N/A</span>':''}</div><div class="item-category">${esc([i.parent_category_name,i.category_name].filter(Boolean).join(' · '))}</div></div>${i.guide_text||i.judgment_guide?`<button class="guide-btn" type="button" data-guide-toggle="${esc(i.target_item_state_id)}">i</button>`:''}</div><div class="item-body">${i.guide_text||i.judgment_guide?`<div class="guide-panel" data-guide-panel="${esc(i.target_item_state_id)}">${i.guide_text?`[제출가이드]\n${esc(i.guide_text)}`:''}${i.guide_text&&i.judgment_guide?'\n\n':''}${i.judgment_guide?`[판정기준]\n${esc(i.judgment_guide)}`:''}</div>`:''}${na?`<div class="na-copy">이 항목은 현재 회사의 업종·상시근로자 기준에 따라 N/A 처리되었습니다.${i.manual_na_reason?`<br>사유: ${esc(i.manual_na_reason)}`:''}</div>`:`<div class="input-label-row"><label for="desc-${esc(i.target_item_state_id)}">제출 설명</label><span>필요한 내용만 간결하게 입력하세요.</span></div><div class="field"><textarea id="desc-${esc(i.target_item_state_id)}" data-desc="${esc(i.target_item_state_id)}" placeholder="예: 최근 실시일, 대상 인원, 조치 결과 등 평가자가 확인해야 할 내용을 입력하세요.">${esc(i.description||'')}</textarea></div>${evidenceHtml(i)}<div class="item-actions"><span class="save-state" id="state-${esc(i.target_item_state_id)}">${i.description?'저장된 내용':'미작성'}</span><button class="btn" type="button" data-save-item="${esc(i.target_item_state_id)}">저장</button></div>`}</div></section>`}
function render(){const w=data.workspace,t=w.target,s=w.summary;const editable=data.capabilities?.editable!==false;$('app').innerHTML=`<div class="hero"><div><div class="eyebrow">i-PaSS · ${t.year}년 ${half(t.half)} 이행수준평가</div><h1>${esc(t.company_name)} 평가자료 제출</h1><div class="hero-meta"><span class="chip ${t.status==='submitted'?'green':'orange'}">${statusText(t.status)}</span><span class="chip gray">${esc(t.start_at||'-')} ~ ${esc(t.end_at||'-')}</span>${t.industry_name?`<span class="chip gray">${esc(t.industry_name)}</span>`:''}</div></div><div class="hero-actions"><button class="btn" id="refreshBtn" type="button">새로고침</button><button class="btn primary" id="topSubmitBtn" type="button">${t.submitted_at?'변경사항 재제출':'제출완료'}</button></div></div><div class="summary"><div class="metric progress"><span>작성률</span><b>${s.progress}%</b></div><div class="metric"><span>전체 항목</span><b>${s.total}</b></div><div class="metric"><span>N/A</span><b>${s.na}</b></div><div class="metric ${s.blank?'warn':''}"><span>미작성 항목</span><b>${s.blank}</b></div></div><div class="progressbar"><span style="width:${s.progress}%"></span></div><div class="layout"><aside class="sidebar"><div class="sidebar-head"><strong>평가항목</strong><span>항목을 선택하면 해당 작성 위치로 이동합니다.</span></div><div class="nav-list">${renderNav()}</div></aside><div class="content"><section class="profile-card"><div class="card-head"><strong>회사 기본정보</strong><span id="profileState">${t.business_number&&t.representative_name&&t.worker_count!=null?'저장됨':'필수 입력'}</span></div><div class="profile-body"><div class="profile-grid"><div class="field"><label>사업자등록번호</label><input id="businessNumber" value="${esc(t.business_number||'')}" placeholder="000-00-00000"></div><div class="field"><label>대표자명</label><input id="representativeName" value="${esc(t.representative_name||'')}"></div><div class="field"><label>상시근로자 수</label><input id="workerCount" type="number" min="0" value="${t.worker_count??''}"></div></div><div class="profile-actions"><button class="btn" id="saveProfileBtn" type="button">기본정보 저장</button></div></div></section>${(w.items||[]).map(itemCard).join('')}<section class="submit-card"><div><h3>${editable?(t.submitted_at?'변경사항을 다시 제출할 수 있습니다.':'작성한 평가자료를 제출하세요.'):'현재는 평가자료를 수정할 수 없습니다.'}</h3><p>${editable?'미작성 항목이 있어도 제출할 수 있습니다. 자료가 없는 항목은 평가 시 감점될 수 있으며, 평가기간 내에는 제출 후에도 수정할 수 있습니다.':t.status==='published'?'관리자가 결과를 공개하여 제출자료가 확정되었습니다.':'평가자료 수정기간이 종료되었습니다.'}</p><div class="status">${t.submitted_at?`최초 제출: ${esc(String(t.submitted_at).replace('T',' ').slice(0,16))}`:'아직 제출하지 않았습니다.'}</div></div><button class="btn primary" id="bottomSubmitBtn" type="button">${t.submitted_at?'변경사항 재제출':'제출완료'}</button></section></div></div><div class="sticky-submit"><button class="btn primary" id="mobileSubmitBtn" type="button">${t.submitted_at?'변경사항 재제출':'제출완료'}</button></div>`;bind();if(!editable){document.querySelectorAll('input,textarea,button[data-save-item],#saveProfileBtn,#topSubmitBtn,#bottomSubmitBtn,#mobileSubmitBtn,[data-file-input],[data-delete-file]').forEach(el=>el.disabled=true);document.querySelectorAll('.file-pick').forEach(el=>el.classList.add('disabled'))}}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{const el=$('item-'+b.dataset.nav);if(el){el.scrollIntoView({behavior:'smooth',block:'start'});document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));b.classList.add('active')}});document.querySelectorAll('[data-guide-toggle]').forEach(b=>b.onclick=()=>document.querySelector(`[data-guide-panel="${CSS.escape(b.dataset.guideToggle)}"]`)?.classList.toggle('open'));document.querySelectorAll('[data-desc]').forEach(t=>t.oninput=()=>dirty.add(t.dataset.desc));document.querySelectorAll('[data-save-item]').forEach(b=>b.onclick=()=>saveItem(b.dataset.saveItem));document.querySelectorAll('[data-file-input]').forEach(i=>i.onchange=()=>uploadFile(i.dataset.fileInput,i));document.querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>downloadFile(b.dataset.download));document.querySelectorAll('[data-delete-file]').forEach(b=>b.onclick=()=>deleteFile(b.dataset.deleteFile));$('saveProfileBtn').onclick=saveProfile;$('refreshBtn').onclick=()=>load(true);['topSubmitBtn','bottomSubmitBtn','mobileSubmitBtn'].forEach(id=>$(id).onclick=submitEvaluation)}
async function saveProfile(){const btn=$('saveProfileBtn'),state=$('profileState');btn.disabled=true;state.textContent='저장 중...';try{const d=await api(`/api/partner/submission/${encodeURIComponent(targetId)}/profile`,{method:'PATCH',body:JSON.stringify({business_number:$('businessNumber').value,representative_name:$('representativeName').value,worker_count:$('workerCount').value})});data.workspace=d.workspace;toast('기본정보를 저장했습니다.');render()}catch(e){state.textContent=e.message;state.className='error-text'}finally{if(document.body.contains(btn))btn.disabled=false}}
async function saveItem(id){const state=$('state-'+id),btn=document.querySelector(`[data-save-item="${CSS.escape(id)}"]`),desc=$('desc-'+id);if(!desc)return;btn.disabled=true;state.textContent='저장 중...';try{await api(`/api/partner/submission/${encodeURIComponent(targetId)}/items/${encodeURIComponent(id)}`,{method:'PATCH',body:JSON.stringify({description:desc.value})});const item=data.workspace.items.find(x=>x.target_item_state_id===id);if(item)item.description=desc.value;dirty.delete(id);state.textContent='✓ 저장됨';state.className='save-state ok';toast('저장했습니다.')}catch(e){state.textContent=e.message;state.className='save-state error-text'}finally{btn.disabled=false}}
async function uploadFile(id,input){const file=input.files?.[0];if(!file)return;const fd=new FormData();fd.append('file',file);toast('파일 업로드 중...');try{await api(`/api/partner/submission/${encodeURIComponent(targetId)}/items/${encodeURIComponent(id)}/files`,{method:'POST',body:fd});toast('파일을 첨부했습니다.');await load(true)}catch(e){modal('파일 첨부 실패',esc(e.message),'<button class="btn" id="modalOk">확인</button>');setTimeout(()=>{$('modalOk').onclick=closeModal},0)}finally{input.value=''}}
function downloadFile(id){return window.EHSApi.download(`/api/partner/submission/files/${encodeURIComponent(id)}`,'증빙자료')}
async function deleteFile(id){if(!confirm('첨부파일을 삭제할까요?'))return;try{await api(`/api/partner/submission/files/${encodeURIComponent(id)}`,{method:'DELETE'});toast('삭제했습니다.');await load(true)}catch(e){alert(e.message)}}
async function saveDirty(){for(const id of [...dirty])await saveItem(id)}
async function submitEvaluation(){try{if(dirty.size){await saveDirty()}const s=data.workspace.summary;modal(data.workspace.target.submitted_at?'변경사항 재제출':'평가자료 제출',`현재 작성률은 <b>${s.progress}%</b>이며 미작성 항목은 <b>${s.blank}개</b>입니다.<br><br>자료가 없는 항목은 그대로 제출할 수 있으며 평가 시 감점될 수 있습니다. 제출하시겠습니까?`,`<button class="btn" id="cancelSubmit">취소</button><button class="btn primary" id="confirmSubmit">${data.workspace.target.submitted_at?'재제출':'제출완료'}</button>`);$('cancelSubmit').onclick=closeModal;$('confirmSubmit').onclick=async()=>{const b=$('confirmSubmit');b.disabled=true;b.textContent='제출 중...';try{await api(`/api/partner/submission/${encodeURIComponent(targetId)}/submit`,{method:'POST'});closeModal();toast('평가자료를 제출했습니다.');await load(true)}catch(e){b.disabled=false;b.textContent='다시 시도';alert(e.message)}}}catch(e){alert(e.message)}}
async function load(force=false){$('app').innerHTML='<div class="loading" aria-label="평가자료 화면 준비"></div>';try{const d=await api(`/api/partner/submission/${encodeURIComponent(targetId)}`);if(d.user?.role&&d.user.role!=='partner')throw new Error('협력사 계정에서만 이용할 수 있습니다.');data=d;user=d.user||user;window.__EHS_PAGE_USER=user;document.dispatchEvent(new CustomEvent('ehs:user-ready',{detail:user}));dirty.clear();$('userLabel').textContent=[user?.company_name,user?.name].filter(Boolean).join(' · ');render()}catch(e){$('app').innerHTML=`<div class="loading error-text">${esc(e.message)}</div>`}}
function goHome(){if(dirty.size&&!confirm('저장하지 않은 변경사항이 있습니다. 이동할까요?'))return;location.href='/home'}$('homeBtn').onclick=goHome;$('brandBtn').onclick=goHome;window.addEventListener('beforeunload',e=>{if(dirty.size){e.preventDefault();e.returnValue=''}});
(async function boot(){try{targetId=new URLSearchParams(location.search).get('target')||'';if(!targetId)throw new Error('평가 대상 정보가 없습니다.');if(!window.EHSAuth.readSession()){window.EHSAuth.redirectToLogin(location.pathname+location.search);return}await load()}catch(e){if(e?.status===401)return;$('app').innerHTML=`<div class="loading error-text">${esc(window.EHSApi.describe(e))}</div>`}})();
</script>
</body>
</html>
