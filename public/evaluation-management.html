<style>
:root{--blue:#2878d4;--blue2:#1f69bd;--ink:#202632;--text:#4e5968;--muted:#8b95a1;--line:#e5e8eb;--page:#f5f7f9;--white:#fff;--green:#16845b;--greenbg:#edf8f3;--orange:#b46f12;--orangebg:#fff6e8;--red:#c94c46;--redbg:#fdf0ef;--gray:#69737c;--graybg:#f1f3f5;--radius:10px;--shadow:0 8px 24px rgba(30,45,60,.045)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Segoe UI",sans-serif;color:var(--ink);background:var(--page);letter-spacing:-.018em}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.header{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:30}.brand{display:flex;align-items:center;gap:11px;border:0;background:none;color:var(--ink);font-weight:750}.brand img{height:26px}.brand small{padding-left:11px;border-left:1px solid var(--line);color:#8a949d;font-size:11px;font-weight:650}.head-actions{display:flex;align-items:center;gap:8px}.user{max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#7b8790;font-size:11px}.icon-btn{width:38px;height:38px;border:1px solid #dfe4e8;border-radius:9px;background:#fff;color:#64727d;display:grid;place-items:center}.icon-btn:hover{background:#f7f9fa;color:var(--blue)}.icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 64px)}.side{background:#fff;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}.side-title{display:flex;justify-content:space-between;align-items:center;padding:0 6px 12px}.side-title strong{font-size:14px}.side-title button{border:0;background:none;color:var(--blue);font-size:11px;font-weight:750}.side-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}.side-actions button{height:34px;border:1px solid #dfe4e8;border-radius:8px;background:#fff;color:#62717c;font-size:10px;font-weight:700}.side-actions button:hover{border-color:#b9d2e7;color:#2870a5}.tpl-year{margin:16px 6px 7px;color:#8a949d;font-size:10px;font-weight:800}.tpl{width:100%;border:0;background:transparent;border-radius:9px;text-align:left;padding:10px 11px;margin:2px 0;color:#58656f}.tpl:hover{background:#f7f9fa}.tpl.active{background:#edf5fa;color:#286f9e}.tpl-main{display:flex;align-items:center;justify-content:space-between;gap:8px}.tpl-name{font-size:11.5px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tpl-meta{margin-top:5px;color:#929ca4;font-size:9px}.tag{display:inline-flex;align-items:center;padding:3px 6px;border-radius:999px;font-size:8.5px;font-weight:800;white-space:nowrap}.draft{background:var(--orangebg);color:var(--orange)}.active-status{background:var(--greenbg);color:var(--green)}.locked{background:var(--graybg);color:var(--gray)}
.main{padding:28px 30px 50px;min-width:0}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:16px}.page-head h1{margin:0;font-size:25px;letter-spacing:-.04em}.page-head .meta{margin-top:7px;color:var(--muted);font-size:11px}.head-buttons{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.btn{height:38px;border:1px solid #dfe4e8;border-radius:8px;background:#fff;color:#596773;padding:0 13px;font-size:11px;font-weight:720}.btn:hover{background:#f8fafb}.btn.primary{border-color:var(--blue);background:var(--blue);color:#fff}.btn.primary:hover{background:var(--blue2)}.btn.danger{border-color:#efd4d1;color:#b84b46}.btn:disabled{opacity:.45;cursor:not-allowed}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:14px}.metric{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 15px}.metric span{display:block;color:#87929b;font-size:9.5px;font-weight:700}.metric b{display:block;margin-top:6px;font-size:21px;letter-spacing:-.04em}.metric.ok b{color:var(--green)}.metric.bad b{color:var(--red)}.validation{margin-bottom:14px;padding:11px 13px;border-radius:9px;font-size:10.5px}.validation.ok{background:var(--greenbg);color:#286d54}.validation.bad{background:var(--redbg);color:#a74843}.validation ul{margin:5px 0 0;padding-left:18px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px;align-items:start}.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}.card-head{height:54px;padding:0 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.card-head strong{font-size:13px}.card-actions{display:flex;gap:6px}.small-btn{height:30px;border:1px solid #e0e5e8;border-radius:7px;background:#fff;color:#6a7781;padding:0 9px;font-size:9.5px;font-weight:700}.small-btn:hover{background:#f7f9fa}.categories{padding:10px}.category{border:1px solid #e8ecef;border-radius:10px;margin-bottom:8px;overflow:hidden}.category:last-child{margin-bottom:0}.category-head{min-height:42px;padding:7px 10px;background:#f9fafb;display:flex;align-items:center;justify-content:space-between;gap:8px}.cat-title{display:flex;align-items:center;gap:8px;min-width:0}.cat-title b{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cat-actions{display:flex;gap:4px;flex:0 0 auto}.mini{width:28px;height:28px;border:1px solid #dfe4e8;border-radius:7px;background:#fff;color:#71808a;display:grid;place-items:center;font-size:12px}.mini:hover{background:#f6f8fa}.mini.danger{color:#b95650;border-color:#efd9d6}.items{padding:6px}.item{display:grid;grid-template-columns:34px minmax(0,1fr) 62px 86px 90px;gap:7px;align-items:center;min-height:55px;padding:7px 8px;border-bottom:1px solid #eef1f3}.item:last-child{border-bottom:0}.order{display:flex;flex-direction:column;gap:2px}.order button{width:24px;height:19px;border:0;border-radius:5px;background:#f1f4f6;color:#7b8790;font-size:8px}.item-name{min-width:0}.item-name strong{display:flex;align-items:center;gap:6px;font-size:11px;line-height:1.3}.item-name strong span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item-name small{display:block;margin-top:4px;color:#919aa2;font-size:8.8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.info-btn{width:20px;height:20px;border:1px solid #d8e2e8;border-radius:50%;background:#fff;color:#4b7897;font-size:10px;font-weight:800;flex:0 0 auto}.score{font-size:13px;font-weight:820;text-align:right;white-space:nowrap}.type{text-align:center}.row-actions{display:flex;justify-content:flex-end;gap:4px}.empty{padding:30px;text-align:center;color:#98a2aa;font-size:10.5px}
.side-card{padding:15px}.side-card h3{margin:0 0 12px;font-size:12px}.policy-field{margin-bottom:12px}.policy-field label{display:block;margin-bottom:5px;color:#7b8790;font-size:9px;font-weight:720}.policy-field input{width:100%;height:36px;border:1px solid #dfe4e8;border-radius:7px;padding:0 9px;outline:none}.policy-field input:focus{border-color:#8cb8da;box-shadow:0 0 0 3px rgba(40,120,212,.08)}.toggle-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;font-size:10px;color:#58656f}.toggle-row input{width:17px;height:17px;accent-color:var(--blue)}.policy-note{padding:9px 10px;border-radius:8px;background:#f7f9fa;color:#7e8992;font-size:9.5px;line-height:1.55}.exempt-list{margin-top:12px;border-top:1px solid #edf0f2;padding-top:10px;max-height:240px;overflow:auto}.exempt-row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #f0f2f3;font-size:9.5px}.exempt-row b{color:#257056}.exempt-empty{padding:12px 0;color:#99a3aa;font-size:9.5px;text-align:center}
.modal{position:fixed;inset:0;z-index:80;background:rgba(22,32,41,.38);display:grid;place-items:center;padding:20px}.modal-box{width:min(720px,96vw);max-height:90vh;background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(20,34,45,.18);overflow:hidden}.modal-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modal-head strong{font-size:14px}.modal-close{width:32px;height:32px;border:0;border-radius:7px;background:#f4f6f7;color:#6f7c85}.modal-body{padding:18px;max-height:70vh;overflow:auto}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{min-width:0}.field.full{grid-column:1/-1}.field label{display:block;margin-bottom:5px;color:#6f7b85;font-size:9.5px;font-weight:720}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe4e8;border-radius:7px;background:#fff;outline:none}.field input,.field select{height:38px;padding:0 9px}.field textarea{min-height:95px;padding:9px;resize:vertical;line-height:1.55}.field input:focus,.field select:focus,.field textarea:focus{border-color:#8bb8da;box-shadow:0 0 0 3px rgba(40,120,212,.08)}.modal-actions{display:flex;justify-content:flex-end;gap:7px;padding:13px 18px;border-top:1px solid var(--line)}.na-box{margin-top:10px;border:1px solid #e6ebee;border-radius:9px;padding:10px}.na-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.na-title strong{font-size:10px}.na-row{display:grid;grid-template-columns:130px minmax(0,1fr) 100px 30px;gap:6px;margin-bottom:6px}.na-row:last-child{margin-bottom:0}.na-row select,.na-row input{height:32px;border:1px solid #dfe4e8;border-radius:6px;padding:0 7px;font-size:9px;min-width:0}.guide-view{white-space:pre-wrap;color:#55636d;font-size:12px;line-height:1.7}.loading{padding:36px;text-align:center;color:#8b959d;font-size:11px}
@media(max-width:1050px){.grid{grid-template-columns:1fr}.side-policy{display:grid;grid-template-columns:1fr 1fr;gap:14px}.summary{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.layout{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.main{padding:20px 14px 40px}.page-head{flex-direction:column}.head-buttons{justify-content:flex-start}.item{grid-template-columns:28px minmax(0,1fr) 54px}.type,.row-actions{grid-column:auto}.item .type{display:none}.row-actions{grid-column:2/4}.side-policy{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.na-row{grid-template-columns:1fr 1fr}.na-row button{grid-column:2}}

<body>
<header class="header"><button class="brand" id="homeBtn" type="button"><img src="/hniruja-logo.png" alt="Hniruja"><span>협력사 EHS 포털</span><small>평가표 관리</small></button><div class="head-actions"><span id="userLabel" class="user"></span><button id="refreshBtn" class="icon-btn" type="button" aria-label="새로고침"><svg viewBox="0 0 24 24"><path d="M20 6v5h-5"/><path d="M19 11a7 7 0 1 0 1 5"/></svg></button></div></header>
<div class="layout">
<aside class="side"><div class="side-title"><strong>평가표</strong><button id="newBlankBtn" type="button">+ 새 평가표</button></div><div class="side-actions"><button id="copyBtn" type="button">이전 평가표 복사</button><button id="policyJump" type="button">면제 설정</button></div><div id="templateList"><div class="loading">불러오는 중...</div></div></aside>
<main class="main">
<div id="workspace"><div class="loading">평가관리 데이터를 불러오는 중...</div></div>
</main></div>
<div id="modal" class="modal hidden"><div class="modal-box"><div class="modal-head"><strong id="modalTitle"></strong><button id="modalClose" class="modal-close" type="button">×</button></div><div id="modalBody" class="modal-body"></div><div id="modalActions" class="modal-actions"></div></div></div>
<script>
let user=null,data=null,current=null,dirty=false;
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
function clone(v){return JSON.parse(JSON.stringify(v))}function statusText(s){return s==='active'?'사용중':s==='locked'?'잠금':'작성중'}function halfText(h){return h==='first'?'상반기':'하반기'}
const api=(path,opt={})=>window.EHSApi.request(path,opt);
function goHome(){if(dirty&&!confirm('저장하지 않은 변경사항이 있습니다. 이동할까요?'))return;location.href='/home'}$('homeBtn').onclick=goHome;$('refreshBtn').onclick=()=>{if(dirty&&!confirm('저장하지 않은 변경사항이 있습니다. 새로고침할까요?'))return;load()};window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
function modal(title,body,actions=''){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalActions').innerHTML=actions;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}$('modalClose').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};
function sortTemplates(list){const by={};for(const t of list||[]){(by[t.year]??=[]).push(t)}return Object.entries(by).sort((a,b)=>Number(b[0])-Number(a[0]))}
function renderList(){const html=sortTemplates(data?.templates||[]).map(([year,list])=>`<div class="tpl-year">${year}년</div>${list.map(t=>`<button class="tpl ${current?.id===t.id?'active':''}" data-id="${esc(t.id)}" type="button"><div class="tpl-main"><span class="tpl-name">${halfText(t.half)}${Number(t.version)>1?` v${t.version}`:''}</span><span class="tag ${t.status==='active'?'active-status':t.status==='locked'?'locked':'draft'}">${statusText(t.status)}</span></div><div class="tpl-meta">평가 ${Number(t.score_total||0)}점 · 가점 +${Number(t.bonus_total||0)}점</div></button>`).join('')}`).join('');$('templateList').innerHTML=html||'<div class="empty">평가표가 없습니다.</div>';$('templateList').querySelectorAll('.tpl').forEach(b=>b.onclick=()=>selectTemplate(b.dataset.id))}
function validationHtml(v){if(!v)return'';return `<div class="validation ${v.valid?'ok':'bad'}">${v.valid?'✓ 평가 시작 가능':'평가 시작 전 확인 필요'}${v.errors?.length?`<ul>${v.errors.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</div>`}
function catChildren(parent){return (current.categories||[]).filter(c=>(c.parent_id||null)===(parent||null)).sort((a,b)=>Number(a.sort_order)-Number(b.sort_order))}
function itemsFor(catId){return (current.items||[]).filter(i=>i.category_id===catId).sort((a,b)=>Number(a.sort_order)-Number(b.sort_order))}
function guideButton(item){return (item.submission_guide||item.judgment_guide)?`<button class="info-btn" data-guide="${esc(item.id)}" type="button" title="가이드">i</button>`:''}
function itemHtml(item,index,list){return `<div class="item" data-item="${esc(item.id)}"><div class="order"><button data-move="up" ${index===0?'disabled':''}>▲</button><button data-move="down" ${index===list.length-1?'disabled':''}>▼</button></div><div class="item-name"><strong><span>${esc(item.item_name)}</span>${guideButton(item)}</strong><small>${esc(item.item_code||'')} ${item.na_rules?.length?`· N/A ${item.na_rules.length}개 조건`:''}</small></div><div class="score">${Number(item.max_score||0)}점</div><div class="type"><span class="tag ${item.item_type==='bonus'?'draft':'active-status'}">${item.item_type==='bonus'?'가점항목':'평가항목'}</span></div><div class="row-actions"><button class="mini" data-edit-item="${esc(item.id)}" title="수정">✎</button><button class="mini danger" data-delete-item="${esc(item.id)}" title="삭제">×</button></div></div>`}
function categoryBlock(cat,depth=0){const its=itemsFor(cat.id);const subs=catChildren(cat.id);return `<div class="category" data-cat="${esc(cat.id)}"><div class="category-head"><div class="cat-title"><b>${depth?'↳ ':''}${esc(cat.category_name)}</b></div><div class="cat-actions"><button class="mini" data-add-item="${esc(cat.id)}" title="평가항목 추가">＋</button>${depth===0?`<button class="mini" data-add-sub="${esc(cat.id)}" title="중분류 추가">⌘</button>`:''}<button class="mini" data-edit-cat="${esc(cat.id)}" title="수정">✎</button><button class="mini danger" data-delete-cat="${esc(cat.id)}" title="삭제">×</button></div></div><div class="items">${its.length?its.map((x,i)=>itemHtml(x,i,its)).join(''):'<div class="empty">평가항목이 없습니다.</div>'}</div>${subs.map(s=>categoryBlock(s,1)).join('')}</div>`}
function renderWorkspace(){if(!current){$('workspace').innerHTML='<div class="card"><div class="empty">평가표를 선택하세요.</div></div>';return}const v=data.validation||{valid:false,errors:[]};const locked=current.status!=='draft';$('workspace').innerHTML=`<div class="page-head"><div><h1>${esc(current.name)}</h1><div class="meta">${current.year}년 ${halfText(current.half)} · ${statusText(current.status)}${current.source_template_id?' · 이전 평가표 복사본':''}</div></div><div class="head-buttons">${current.status==='draft'?`<button class="btn" id="saveBtn">변경사항 저장</button><button class="btn primary" id="activateBtn">사용 시작</button><button class="btn danger" id="deleteTplBtn">평가표 삭제</button>`:current.status==='active'?`<button class="btn primary" id="lockBtn">평가 종료 · 잠금</button>`:'<button class="btn" disabled>잠긴 평가표</button>'}</div></div><div class="summary"><div class="metric ${Number(v.score_total)===100?'ok':'bad'}"><span>평가항목 배점</span><b>${Number(v.score_total||0)} / 100</b></div><div class="metric"><span>가점항목 배점</span><b>+${Number(v.bonus_total||0)}</b></div><div class="metric"><span>평가항목 수</span><b>${(current.items||[]).filter(x=>x.item_type!=='bonus').length}</b></div><div class="metric"><span>가점항목 수</span><b>${(current.items||[]).filter(x=>x.item_type==='bonus').length}</b></div></div>${validationHtml(v)}<div class="grid"><section class="card"><div class="card-head"><strong>평가표 편집</strong><div class="card-actions">${!locked?'<button class="small-btn" id="addCatBtn">+ 대분류</button>':''}</div></div><div class="categories">${catChildren(null).map(c=>categoryBlock(c)).join('')||'<div class="empty">대분류를 추가하세요.</div>'}</div></section><aside class="side-policy"><section class="card"><div class="card-head"><strong>i-PaSS 면제 설정</strong></div><div class="side-card" id="policyBox"></div></section><section class="card"><div class="card-head"><strong>익년도 상반기 면제 예상</strong><button class="small-btn" id="previewBtn">조회</button></div><div class="side-card"><div class="policy-field"><label>적용 연도</label><input id="previewYear" type="number" min="2020" max="2100" value="${new Date().getFullYear()+1}"></div><div id="exemptList" class="exempt-empty">조회 버튼을 누르세요.</div></div></section></aside></div>`;renderPolicy();bindWorkspace()}
function renderPolicy(){const p=data.policy||{};$('policyBox').innerHTML=`<div class="toggle-row"><span>익년도 상반기 평가 면제</span><input id="policyEnabled" type="checkbox" ${Number(p.first_half_exempt_enabled)!==0?'checked':''}></div><div class="policy-field"><label>면제 기준 i-PaSS 점수</label><input id="policyThreshold" type="number" min="0" max="100" step="0.1" value="${Number(p.excellence_threshold??90)}"></div><div class="policy-field"><label>면제 연도 하반기 평가 반영비율</label><input id="policySecondWeight" type="number" min="0" max="100" step="0.1" value="${Number(p.exempt_second_half_weight??80)}"></div><div class="policy-note">면제 협력사: 하반기 평가 80% + 협의체 10% + 산업재해 10%. 최종 i-PaSS는 100점을 초과하지 않습니다.</div><button class="btn primary" id="savePolicyBtn" style="width:100%;margin-top:12px">면제 설정 저장</button>`;$('savePolicyBtn').onclick=savePolicy}
function bindWorkspace(){
  $('addCatBtn')?.addEventListener('click',()=>editCategory());$('saveBtn')?.addEventListener('click',saveContent);$('activateBtn')?.addEventListener('click',()=>changeStatus('active'));$('lockBtn')?.addEventListener('click',()=>changeStatus('locked'));$('deleteTplBtn')?.addEventListener('click',deleteTemplate);$('previewBtn')?.addEventListener('click',previewExemptions);
  document.querySelectorAll('[data-add-sub]').forEach(b=>b.onclick=()=>editCategory(null,b.dataset.addSub));document.querySelectorAll('[data-edit-cat]').forEach(b=>b.onclick=()=>editCategory(b.dataset.editCat));document.querySelectorAll('[data-delete-cat]').forEach(b=>b.onclick=()=>deleteCategory(b.dataset.deleteCat));document.querySelectorAll('[data-add-item]').forEach(b=>b.onclick=()=>editItem(null,b.dataset.addItem));document.querySelectorAll('[data-edit-item]').forEach(b=>b.onclick=()=>editItem(b.dataset.editItem));document.querySelectorAll('[data-delete-item]').forEach(b=>b.onclick=()=>deleteItem(b.dataset.deleteItem));document.querySelectorAll('[data-guide]').forEach(b=>b.onclick=()=>showGuide(b.dataset.guide));document.querySelectorAll('.item [data-move]').forEach(b=>b.onclick=()=>moveItem(b.closest('.item').dataset.item,b.dataset.move));
}
function markDirty(){dirty=true;data.validation=localValidate();renderList();renderWorkspace()}
function localValidate(){const errors=[];let score=0,bonus=0;if(!(current.items||[]).length)errors.push('평가항목이 없습니다.');for(const i of current.items||[]){if(!String(i.item_name||'').trim())errors.push('평가항목명이 비어 있습니다.');if(!current.categories.some(c=>c.id===i.category_id))errors.push(`${i.item_name||'항목'}의 분류가 지정되지 않았습니다.`);if(i.item_type==='bonus')bonus+=Number(i.max_score||0);else score+=Number(i.max_score||0)}score=Math.round(score*100)/100;bonus=Math.round(bonus*100)/100;if(score!==100)errors.push(`평가 배점 합계가 ${score}점입니다. 100점이어야 합니다.`);return{valid:!errors.length,errors,score_total:score,bonus_total:bonus,final_score_cap:100}}
function editCategory(id=null,parentId=null){if(current.status!=='draft')return;const c=id?current.categories.find(x=>x.id===id):null;modal(c?'분류 수정':parentId?'중분류 추가':'대분류 추가',`<div class="field"><label>${parentId?'중분류명':'대분류명'}</label><input id="catName" value="${esc(c?.category_name||'')}"></div>`,`<button class="btn" id="cancelModal">취소</button><button class="btn primary" id="saveCat">저장</button>`);$('cancelModal').onclick=closeModal;$('saveCat').onclick=()=>{const name=$('catName').value.trim();if(!name)return alert('분류명을 입력하세요.');if(c)c.category_name=name;else current.categories.push({id:'local-cat-'+crypto.randomUUID(),template_id:current.id,parent_id:parentId||null,category_name:name,sort_order:current.categories.filter(x=>(x.parent_id||null)===(parentId||null)).length});closeModal();markDirty()}}
function deleteCategory(id){if(!confirm('분류와 포함된 평가항목을 삭제할까요?'))return;const children=new Set([id,...current.categories.filter(c=>c.parent_id===id).map(c=>c.id)]);current.categories=current.categories.filter(c=>!children.has(c.id));current.items=current.items.filter(i=>!children.has(i.category_id));markDirty()}
function naRowsHtml(rules=[]){return (rules||[]).map((r,i)=>`<div class="na-row"><select class="naType"><option value="worker_count" ${r.rule_type==='worker_count'?'selected':''}>근로자수</option><option value="industry_worker" ${r.rule_type==='industry_worker'?'selected':''}>업종 × 근로자수</option></select><input class="naIndustry" placeholder="업종명" value="${esc(r.industry_name||'')}"><input class="naWorkers" type="number" min="0" placeholder="기준 인원" value="${Number(r.min_worker_count||0)}"><button class="mini danger naRemove" type="button">×</button></div>`).join('')}
function editItem(id=null,catId=null){if(current.status!=='draft')return;const item=id?current.items.find(x=>x.id===id):null;const cats=current.categories.map(c=>`<option value="${esc(c.id)}" ${(item?.category_id||catId)===c.id?'selected':''}>${c.parent_id?'↳ ':''}${esc(c.category_name)}</option>`).join('');modal(item?'평가항목 수정':'평가항목 추가',`<div class="form-grid"><div class="field"><label>구분</label><select id="itemType"><option value="score" ${item?.item_type!=='bonus'?'selected':''}>평가항목</option><option value="bonus" ${item?.item_type==='bonus'?'selected':''}>가점항목</option></select></div><div class="field"><label>배점</label><input id="itemScore" type="number" min="0" step="0.1" value="${Number(item?.max_score||0)}"></div><div class="field"><label>분류</label><select id="itemCat">${cats}</select></div><div class="field"><label>항목 번호</label><input id="itemCode" value="${esc(item?.item_code||'')}"></div><div class="field full"><label>평가항목명</label><input id="itemName" value="${esc(item?.item_name||'')}"></div><div class="field full"><label>판정기준</label><textarea id="judgmentGuide">${esc(item?.judgment_guide||'')}</textarea></div><div class="field full"><label>제출가이드</label><textarea id="submissionGuide">${esc(item?.submission_guide||'')}</textarea></div></div><div class="na-box"><div class="na-title"><strong>N/A 조건</strong><button class="small-btn" id="addNa" type="button">+ 조건</button></div><div id="naRows">${naRowsHtml(item?.na_rules||[])}</div></div>`,`<button class="btn" id="cancelModal">취소</button><button class="btn primary" id="saveItem">저장</button>`);$('cancelModal').onclick=closeModal;bindNa();$('addNa').onclick=()=>{$('naRows').insertAdjacentHTML('beforeend',naRowsHtml([{rule_type:'worker_count',min_worker_count:5}]));bindNa()};$('saveItem').onclick=()=>{const name=$('itemName').value.trim(),score=Number($('itemScore').value);if(!name)return alert('평가항목명을 입력하세요.');if(!Number.isFinite(score)||score<0)return alert('배점을 확인하세요.');const rules=[...$('naRows').querySelectorAll('.na-row')].map(r=>({rule_type:r.querySelector('.naType').value,industry_name:r.querySelector('.naIndustry').value.trim()||null,min_worker_count:Math.max(0,Math.round(Number(r.querySelector('.naWorkers').value)||0))}));const next={id:item?.id||'local-item-'+crypto.randomUUID(),template_id:current.id,category_id:$('itemCat').value,item_code:$('itemCode').value.trim()||null,item_name:name,item_type:$('itemType').value,max_score:score,judgment_guide:$('judgmentGuide').value.trim()||null,submission_guide:$('submissionGuide').value.trim()||null,sort_order:item?.sort_order??current.items.length,na_rules:rules};if(item)Object.assign(item,next);else current.items.push(next);closeModal();markDirty()}}
function bindNa(){$('naRows').querySelectorAll('.na-row').forEach(r=>{const sync=()=>{const industry=r.querySelector('.naIndustry');industry.disabled=r.querySelector('.naType').value!=='industry_worker';if(industry.disabled)industry.value=''};r.querySelector('.naType').onchange=sync;r.querySelector('.naRemove').onclick=()=>r.remove();sync()})}
function deleteItem(id){if(!confirm('평가항목을 삭제할까요?'))return;current.items=current.items.filter(i=>i.id!==id);markDirty()}
function moveItem(id,dir){const item=current.items.find(x=>x.id===id);if(!item)return;const list=itemsFor(item.category_id),idx=list.findIndex(x=>x.id===id),j=dir==='up'?idx-1:idx+1;if(j<0||j>=list.length)return;const a=list[idx],b=list[j],tmp=a.sort_order;a.sort_order=b.sort_order;b.sort_order=tmp;markDirty()}
function showGuide(id){const item=current.items.find(x=>x.id===id);modal(item.item_name,`<div class="guide-view"><b>제출가이드</b>\n${esc(item.submission_guide||'등록된 제출가이드가 없습니다.')}\n\n<b>판정기준</b>\n${esc(item.judgment_guide||'등록된 판정기준이 없습니다.')}</div>`,`<button class="btn" id="closeGuide">닫기</button>`);$('closeGuide').onclick=closeModal}
async function saveContent(){try{const payload={categories:current.categories.map((c,i)=>({...c,sort_order:Number(c.sort_order??i)})),items:current.items.map((x,i)=>({...x,sort_order:Number(x.sort_order??i)}))};const d=await api(`/api/admin/evaluation-management/templates/${encodeURIComponent(current.id)}/content`,{method:'PUT',body:JSON.stringify(payload)});current=d.template;data.validation=d.validation;dirty=false;await refreshBundle(current.id)}catch(e){alert(e.message)}}
async function changeStatus(status){if(status==='active'&&!localValidate().valid)return alert(localValidate().errors.join('\n'));const msg=status==='active'?'이 평가표를 사용 시작할까요? 사용 시작 후 항목 구조는 수정할 수 없습니다.':'평가를 종료하고 평가표를 잠글까요?';if(!confirm(msg))return;try{await api(`/api/admin/evaluation-management/templates/${encodeURIComponent(current.id)}`,{method:'PATCH',body:JSON.stringify({status})});dirty=false;await refreshBundle(current.id)}catch(e){alert(e.data?.validation?.errors?.join('\n')||e.message)}}
async function deleteTemplate(){if(!confirm('작성중 평가표를 삭제할까요?'))return;try{await api(`/api/admin/evaluation-management/templates/${encodeURIComponent(current.id)}`,{method:'DELETE'});dirty=false;await load()}catch(e){alert(e.message)}}
async function createTemplate(copy=false){if(dirty&&!confirm('저장하지 않은 변경사항이 있습니다. 계속할까요?'))return;const now=new Date().getFullYear(),year=Number(prompt('평가 연도를 입력하세요.',String(now)));if(!Number.isInteger(year))return;const half=confirm('상반기 평가표를 만들까요?\n확인 = 상반기 / 취소 = 하반기')?'first':'second';let source='';if(copy){const choices=(data.templates||[]).map((t,i)=>`${i+1}. ${t.year}년 ${halfText(t.half)} ${statusText(t.status)}`).join('\n');const n=Number(prompt(`복사할 평가표 번호를 입력하세요.\n\n${choices}`));if(!n||!data.templates[n-1])return;source=data.templates[n-1].id}try{const d=await api('/api/admin/evaluation-management/templates',{method:'POST',body:JSON.stringify({year,half,source_template_id:source||null})});dirty=false;await refreshBundle(d.id)}catch(e){alert(e.message)}}
$('newBlankBtn').onclick=()=>createTemplate(false);$('copyBtn').onclick=()=>createTemplate(true);$('policyJump').onclick=()=>document.querySelector('.side-policy')?.scrollIntoView({behavior:'smooth'});
async function savePolicy(){try{const d=await api('/api/admin/evaluation-management/policy',{method:'PATCH',body:JSON.stringify({excellence_threshold:Number($('policyThreshold').value),first_half_exempt_enabled:$('policyEnabled').checked,exempt_second_half_weight:Number($('policySecondWeight').value)})});data.policy=d.policy;renderPolicy();alert('저장했습니다.')}catch(e){alert(e.message)}}
async function previewExemptions(){const y=Number($('previewYear').value);$('exemptList').innerHTML='<div class="exempt-empty">조회 중...</div>';try{const d=await api(`/api/admin/evaluation-management/exemptions?year=${encodeURIComponent(y)}`);$('exemptList').innerHTML=d.companies.length?`<div class="exempt-list">${d.companies.map(c=>`<div class="exempt-row"><span>${esc(c.company_name)}</span><b>${c.previous_ipass_score}점</b></div>`).join('')}</div>`:'<div class="exempt-empty">면제 예상 협력사가 없습니다.</div>'}catch(e){$('exemptList').innerHTML=`<div class="exempt-empty">${esc(e.message)}</div>`}}
async function selectTemplate(id){if(dirty&&!confirm('저장하지 않은 변경사항이 있습니다. 이동할까요?'))return;dirty=false;await refreshBundle(id)}
async function refreshBundle(id){$('workspace').innerHTML='<div class="loading">불러오는 중...</div>';const d=await api(`/api/admin/evaluation-management${id?`?template_id=${encodeURIComponent(id)}`:''}`);data=d;current=d.template?clone(d.template):null;renderList();renderWorkspace()}
async function load(){dirty=false;try{user=await window.EHSAuth.requireUser({role:'admin'});$('userLabel').textContent=user.name||user.email||'';await refreshBundle()}catch(e){if(e?.status===401)return;$('workspace').innerHTML=`<div class="card"><div class="empty">${esc(window.EHSApi.describe(e))}</div></div>`}}
load();
</script>
</body>
