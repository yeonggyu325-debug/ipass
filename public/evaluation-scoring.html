<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>협력사 평가 채점 | i-PaSS</title>
<style>
:root{--blue:#1769aa;--ink:#203442;--text:#586b78;--muted:#8a98a2;--line:#e1e7eb;--page:#f4f7f9;--green:#187357;--red:#b84d46}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Pretendard Variable","Pretendard","Noto Sans KR",sans-serif;background:var(--page);color:var(--ink)}button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.header{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;position:sticky;top:0;z-index:30}.header-inner{width:min(1440px,calc(100% - 48px));margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;border:0;background:none;font-weight:800;color:var(--ink)}.brand img{height:31px}.chip{padding:5px 8px;border-radius:6px;background:#edf5fa;color:#286b99;font-size:10px}.actions{display:flex;align-items:center;gap:8px}.user{font-size:11px;color:#71838f}.btn{height:38px;padding:0 13px;border:1px solid #d8e1e6;border-radius:8px;background:#fff;color:#526976;font-size:11px;font-weight:750}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.shell{width:min(1440px,calc(100% - 48px));margin:auto;padding:25px 0 64px}.back{border:0;background:none;color:#53768d;font-size:11px;padding:0}.hero{margin-top:12px;padding:20px;background:#fff;border:1px solid var(--line);border-radius:14px;display:flex;justify-content:space-between;gap:20px;align-items:flex-end}.eyebrow{font-size:10px;font-weight:800;color:#718b9c}.hero h1{margin:6px 0 0;font-size:26px}.hero-meta{margin-top:8px;color:var(--muted);font-size:11px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.metric{padding:15px 16px;background:#fff;border:1px solid var(--line);border-radius:11px}.metric span{font-size:10px;color:#7a8b96}.metric b{display:block;margin-top:7px;font-size:23px}.metric.attention b{color:#a56a1d}.item{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.item-head{padding:13px 16px;background:#fbfcfd;border-bottom:1px solid #e8edef;display:flex;justify-content:space-between;gap:12px}.item-title{font-size:13px;font-weight:800}.item-meta{margin-top:4px;color:#8a98a1;font-size:9.5px}.item-body{padding:14px 16px;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.55fr);gap:16px}.submitted{padding:11px;border:1px solid #e5eaed;border-radius:9px;background:#f8fafb;color:#586b77;font-size:10.5px;line-height:1.65;white-space:pre-wrap}.files{margin-top:10px}.file{min-height:37px;border-top:1px solid #edf0f2;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px}.file-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;color:#5b6c77}.file button{border:0;background:none;color:var(--blue);font-size:9.5px}.score-grid{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px}.field label{display:block;margin-bottom:5px;color:#71818c;font-size:9.5px;font-weight:750}.field input,.field textarea{width:100%;border:1px solid #d9e1e6;border-radius:8px;background:#fff;padding:9px 10px;color:#344b59}.field textarea{height:82px;resize:vertical}.save-row{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:8px}.save-state{margin-right:auto;color:#829099;font-size:9.5px}.na{padding:18px;text-align:center;color:#84919a;font-size:11px;background:#f7f8f9;border-radius:9px}.loading,.error,.empty{padding:60px;text-align:center;color:#84919a}.error{color:var(--red)}.modal{position:fixed;inset:0;z-index:90;background:rgba(22,34,44,.45);display:grid;place-items:center;padding:18px}.modal-box{width:min(1120px,96vw);background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 22px 70px rgba(18,31,42,.24)}.modal-head,.modal-actions{padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line)}.modal-actions{border:0;border-top:1px solid var(--line);justify-content:flex-end}.modal-body{padding:13px}.preview{height:min(73vh,780px);border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#f1f3f5}.preview iframe{width:100%;height:100%;border:0;background:#fff}.preview.image{display:grid;place-items:center;overflow:auto}.preview.image img{max-width:100%;max-height:100%;object-fit:contain}.preview-note{padding:9px 11px;margin-bottom:9px;border-radius:8px;background:#f2f7fa;color:#647a88;font-size:10px}.modal-loading{height:300px;display:grid;place-items:center;color:#7c8a94}@media(max-width:850px){.summary{grid-template-columns:1fr 1fr}.item-body{grid-template-columns:1fr}.header-inner,.shell{width:calc(100% - 24px)}.user{display:none}.hero{align-items:flex-start;flex-direction:column}}
</style>
<script src="/shared/auth.js?v=2"></script><script src="/shared/api.js?v=2"></script>
</head>
<body>
<header class="header"><div class="header-inner"><button class="brand" id="brand"><img src="/hniruja-logo.png" alt="Hniruja"><span>협력사 EHS 포털</span><span class="chip">i-PaSS 채점</span></button><div class="actions"><span id="user" class="user"></span><button class="btn" id="ipass">i-PaSS</button><button class="btn" id="home">포털 홈</button><button class="btn" id="logout">로그아웃</button></div></div></header>
<main class="shell"><button class="back" id="back">← 협력사 평가 현황</button><div id="app" class="loading">채점자료를 불러오는 중...</div></main>
<div id="modal" class="modal hidden"><div class="modal-box"><div class="modal-head"><strong id="modalTitle">파일 미리보기</strong><button class="btn" id="modalClose">닫기</button></div><div id="modalBody" class="modal-body"></div><div class="modal-actions"><button class="btn" id="modalDownload">다운로드</button></div></div></div>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');let targetId='',workspace=null,objectUrl=null,previewFileId='';
const api=(path,opt={})=>window.EHSApi.request(path,opt);function statusText(s){return({submitted:'제출완료',evaluating:'채점중',completed:'평가완료',published:'결과공개'})[s]||s||'-'}function fmtBytes(n){n=Number(n||0);return n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB'}function kind(name){const e=String(name||'').split('.').pop().toLowerCase();if(['jpg','jpeg','png'].includes(e))return'image';if(e==='pdf')return'pdf';if(['xls','xlsx','ppt','pptx','doc','docx','hwp','hwpx'].includes(e))return e.startsWith('hwp')?'hwp':'office';return'other'}
function closePreview(){if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null}$('modal').classList.add('hidden');$('modalBody').innerHTML='';previewFileId=''}$('modalClose').onclick=closePreview;$('modal').onclick=e=>{if(e.target===$('modal'))closePreview()};$('modalDownload').onclick=()=>previewFileId&&window.EHSApi.download(`/api/partner/submission/files/${encodeURIComponent(previewFileId)}`,'증빙자료');
async function blob(id,retry=true){const h=new Headers({Authorization:'Bearer '+await window.EHSAuth.token()});const r=await fetch((window.EHSApi.ORIGIN||'')+`/api/partner/submission/files/${encodeURIComponent(id)}`,{headers:h});if(r.status===401&&retry){await window.EHSAuth.refresh();return blob(id,false)}if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||'파일을 불러오지 못했습니다.')}return r.blob()}
async function preview(id){const f=workspace.items.flatMap(i=>i.files||[]).find(x=>x.id===id);if(!f)return;previewFileId=id;$('modalTitle').textContent=f.file_name;$('modalBody').innerHTML='<div class="modal-loading">파일을 불러오는 중...</div>';$('modal').classList.remove('hidden');try{const k=kind(f.file_name);if(k==='image'||k==='pdf'){const b=await blob(id);objectUrl=URL.createObjectURL(b);$('modalBody').innerHTML=k==='image'?`<div class="preview image"><img src="${objectUrl}" alt="${esc(f.file_name)}"></div>`:`<div class="preview"><iframe src="${objectUrl}" title="${esc(f.file_name)}"></iframe></div>`}else if(k==='office'||k==='hwp'){const t=await api(`/api/partner/submission/files/${encodeURIComponent(id)}/preview-ticket`,{method:'POST',body:'{}'});const note=k==='hwp'?'한글 파일은 Google 공식 지원 형식이 아니므로 문서에 따라 표시되지 않을 수 있습니다.':'Google 문서 뷰어로 표시하며 원본과 레이아웃이 일부 다를 수 있습니다.';$('modalBody').innerHTML=`<div class="preview-note">${note}</div><div class="preview"><iframe src="${esc(t.viewer_url)}" title="${esc(f.file_name)}" referrerpolicy="no-referrer"></iframe></div>`}else $('modalBody').innerHTML='<div class="modal-loading">이 형식은 다운로드하여 확인해 주세요.</div>'}catch(e){$('modalBody').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
function filesHtml(files){return (files||[]).length?`<div class="files">${files.map(f=>`<div class="file"><span class="file-name">${esc(f.file_name)} · ${fmtBytes(f.file_size)}</span><span><button data-preview="${esc(f.id)}">미리보기</button><button data-download="${esc(f.id)}">다운로드</button></span></div>`).join('')}</div>`:'<div class="files"><div class="file"><span class="file-name">첨부된 증빙자료가 없습니다.</span></div></div>'}
function render(){const t=workspace.target,s=workspace.summary;$('app').className='';$('app').innerHTML=`<section class="hero"><div><div class="eyebrow">${esc(t.cycle_name||'i-PaSS')} · ${statusText(t.status)}</div><h1>${esc(t.company_name)} 평가 채점</h1><div class="hero-meta">${esc(t.industry_name||'-')} · 제출일 ${esc(t.submitted_at?String(t.submitted_at).slice(0,10):'-')}</div></div><button class="btn primary" id="complete" ${s.complete?'':'disabled'}>평가완료</button></section><div class="summary"><div class="metric"><span>현재 원점수</span><b>${Number(s.raw_score||0)}</b></div><div class="metric"><span>채점 대상</span><b>${s.applicable_count}</b></div><div class="metric attention"><span>미채점</span><b>${s.unevaluated_count}</b></div><div class="metric"><span>N/A</span><b>${s.na_count}</b></div></div>${workspace.items.map(i=>`<section class="item"><div class="item-head"><div><div class="item-title">${esc((i.item_code?i.item_code+' ':'')+i.item_name)}</div><div class="item-meta">${esc([i.parent_category_name,i.category_name].filter(Boolean).join(' · '))}</div></div><span class="chip">${i.item_type==='bonus'?'가점':'배점'} ${Number(i.max_score||0)}점</span></div><div class="item-body">${Number(i.applicable)===0?`<div class="na">N/A 항목${i.manual_na_reason?' · '+esc(i.manual_na_reason):''}</div>`:`<div><div class="submitted">${esc(i.description||'협력사 제출 설명이 없습니다.')}</div>${filesHtml(i.files)}</div><div><div class="score-grid"><div class="field"><label>점수</label><input type="number" min="0" max="${Number(i.max_score||0)}" step="0.1" data-score="${esc(i.id)}" value="${i.earned_score??''}"></div><div class="field"><label>평가 의견</label><textarea data-comment="${esc(i.id)}">${esc(i.evaluation_comment||'')}</textarea></div></div><div class="save-row"><span class="save-state" id="state-${esc(i.id)}"></span><button class="btn primary" data-save="${esc(i.id)}">저장</button></div></div>`}</div></section>`).join('')}`;document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(b.dataset.save));document.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>preview(b.dataset.preview));document.querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>window.EHSApi.download(`/api/partner/submission/files/${encodeURIComponent(b.dataset.download)}`,'증빙자료'));$('complete').onclick=complete}
async function save(id){const b=document.querySelector(`[data-save="${CSS.escape(id)}"]`),state=$('state-'+id);b.disabled=true;state.textContent='저장 중...';try{const score=document.querySelector(`[data-score="${CSS.escape(id)}"]`).value,comment=document.querySelector(`[data-comment="${CSS.escape(id)}"]`).value;if(score==='')throw new Error('점수를 입력하세요.');const d=await api(`/api/admin/evaluation-scoring/${encodeURIComponent(targetId)}/items/${encodeURIComponent(id)}`,{method:'PATCH',body:JSON.stringify({earned_score:score,evaluation_comment:comment})});workspace=d.workspace;render()}catch(e){state.textContent=e.message;b.disabled=false}}
async function complete(){if(!confirm('모든 채점을 완료 처리할까요?'))return;try{const d=await api(`/api/admin/evaluation-scoring/${encodeURIComponent(targetId)}/complete`,{method:'POST',body:'{}'});workspace=d.workspace;render()}catch(e){alert(e.message)}}async function load(){const d=await api(`/api/admin/evaluation-scoring/${encodeURIComponent(targetId)}`);workspace=d.workspace;render()}
$('back').onclick=()=>location.href='/ipass/evaluations';$('ipass').onclick=$('brand').onclick=()=>location.href='/ipass';$('home').onclick=()=>location.href='/home';$('logout').onclick=()=>window.EHSAuth.logout();(async()=>{try{targetId=new URLSearchParams(location.search).get('target')||'';if(!targetId)throw new Error('평가 대상 정보가 없습니다.');const u=await window.EHSAuth.requireUser({role:'admin'});$('user').textContent=[u.position,u.name].filter(Boolean).join(' ')||u.email;await load()}catch(e){if(e?.status===401)return;$('app').className='error';$('app').textContent=window.EHSApi.describe(e)}})();
</script>
</body></html>
