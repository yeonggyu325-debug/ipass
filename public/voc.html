<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VOC | Hniruja EHS</title>
<script src="/attachment-preview.js?v=3"></script>
<link rel="stylesheet" href="/page-assets/voc.style-1.f647a706a1a3.css">
</head>
<body>
<header class="header">
  <div class="header-in">
    <button class="brand" id="homeBrand" type="button"><img src="/hniruja-logo.png" alt="Hniruja"><span>협력사 EHS 포털</span><small>VOC</small></button>
    <div class="head-actions"><span class="user" id="userLabel"></span><button class="head-btn" id="homeBtn" type="button">포털 홈</button><button class="head-btn logout" id="logoutBtn" type="button">로그아웃</button></div>
  </div>
</header>
<main class="shell">
  <div class="top">
    <div><div class="eyebrow">VOICE OF CUSTOMER</div><h1 id="pageTitle">VOC 건의</h1><p id="pageMeta">EHS 관련 문의와 개선 의견을 접수하고 처리상태를 확인합니다.</p></div>
    <div class="top-actions"><button class="btn" id="refreshBtn" type="button">새로고침</button><button class="btn primary" id="newBtn" type="button">VOC 접수</button></div>
  </div>
  <section class="summary" id="summary"></section>
  <section class="panel">
    <div class="panel-head"><strong id="listTitle">VOC 접수내역</strong><div class="filters"><input class="control search" id="search" type="search" maxlength="100" placeholder="제목·내용 검색"><select class="control" id="categoryFilter" aria-label="분류"><option value="">전체 분류</option><option value="general">일반문의</option><option value="safety">안전</option><option value="facility">시설·설비</option><option value="other">기타</option></select><select class="control" id="statusFilter" aria-label="처리상태"><option value="">전체 상태</option><option value="draft">작성중</option><option value="received">접수완료</option><option value="in_review">검토중</option><option value="answered">답변완료</option><option value="closed">종결</option></select></div></div>
    <div class="list-wrap" id="list"><div class="loading">VOC 내역을 불러오는 중...</div></div>
  </section>
</main>

<div class="modal hidden" id="mainModal">
  <div class="modal-card" id="modalCard"><div class="modal-head"><div class="modal-title"><strong id="modalTitle"></strong><span id="modalSub"></span></div><button class="close" id="modalClose" type="button" aria-label="닫기">×</button></div><div class="modal-body" id="modalBody"></div></div>
</div>

<div class="modal camera-modal hidden" id="cameraModal">
  <div class="camera-card"><div class="camera-head"><strong>사진 촬영</strong><button id="cameraClose" type="button" aria-label="카메라 닫기">×</button></div><div class="camera-view"><video id="cameraVideo" autoplay playsinline muted></video></div><div class="camera-actions"><button class="capture" id="cameraCapture" type="button" aria-label="촬영"></button></div></div>
</div>
<input class="hidden" id="cameraFallback" type="file" accept="image/*" capture="environment">

<div class="modal image-modal hidden" id="imageModal">
  <div class="image-shell"><div class="image-tools"><button id="imageFit" type="button">맞춤</button><button id="imageMinus" type="button">−</button><button id="imagePercent" type="button">100%</button><button id="imagePlus" type="button">+</button><button class="image-close" id="imageClose" type="button" aria-label="사진 닫기">×</button></div><div class="image-stage" id="imageStage"><img id="imageView" alt="첨부 사진 확대보기"></div></div>
</div>
<div class="toast hidden" id="toast"></div>

<script src="/page-assets/voc.script-1.8f83c5f0ae5a.js"></script>
