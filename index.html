<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>협력사 이행수준평가</title>
</head>
<body>

  <h1>협력사 이행수준평가</h1>

  <div id="result">DB 연결 확인 중...</div>

  <script>
    const API =
      "https://partner-evaluation-api.i-pass-eval.workers.dev";

    async function test() {
      try {
        const response =
          await fetch(API + "/api/companies");

        const data =
          await response.json();

        document.getElementById("result").innerHTML =
          "<pre>" +
          JSON.stringify(data, null, 2) +
          "</pre>";

      } catch (error) {
        document.getElementById("result").textContent =
          "연결 실패: " + error.message;
      }
    }

    test();
  </script>

</body>
</html>
