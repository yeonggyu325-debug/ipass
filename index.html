<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    협력사 이행수준평가
  </title>

  <style>

    body {
      font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;

      background: #f4f6f8;

      margin: 0;

      padding: 40px;

      color: #1f2937;
    }

    .card {
      max-width: 800px;

      margin: auto;

      background: white;

      border:
        1px solid #ddd;

      border-radius: 12px;

      padding: 24px;
    }

    h1 {
      margin-top: 0;
    }

    .success {
      color: #15803d;
    }

    .error {
      color: #b91c1c;
    }

    pre {
      background: #f7f7f7;

      padding: 16px;

      border-radius: 8px;

      overflow: auto;
    }

  </style>

</head>

<body>

<div class="card">

  <h1>
    협력사 이행수준평가
  </h1>

  <p id="status">
    API 연결 확인 중...
  </p>

  <pre id="result"></pre>

</div>


<script>

async function start() {

  const status =
    document.getElementById(
      "status"
    );

  const result =
    document.getElementById(
      "result"
    );


  try {

    const response =
      await fetch(
        "/api/companies"
      );


    const text =
      await response.text();


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status +
        "\n" +
        text
      );

    }


    const data =
      JSON.parse(text);


    status.className =
      "success";


    status.textContent =
      "API + D1 연결 성공";


    result.textContent =
      JSON.stringify(
        data,
        null,
        2
      );

  }

  catch (error) {

    status.className =
      "error";


    status.textContent =
      "연결 실패";


    result.textContent =
      error.message;

  }

}


start();

</script>

</body>
</html>
