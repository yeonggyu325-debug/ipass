name: Complete Committee Phase 2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/complete-committee-phase2.mjs'
      - '.github/workflows/complete-committee-phase2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply committee data integrity patch
        run: node scripts/complete-committee-phase2.mjs
      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js public/committee.html
          git commit -m "fix: harden committee attendance data integrity"
          git push origin HEAD:main
