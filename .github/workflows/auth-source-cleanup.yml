name: Auth Source Cleanup

on:
  push:
    branches: [main]
    paths:
      - 'scripts/auth-source-cleanup.mjs'
      - '.github/workflows/auth-source-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clean legacy authentication from sources
        run: node scripts/auth-source-cleanup.mjs
      - name: Commit cleaned sources
        run: |
          if git diff --quiet; then
            echo "No cleanup changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/committee.html public/evaluation-management.html public/evaluation-cycle.html public/evaluation-submit.html src/worker-v20.js
          git commit -m "refactor: complete shared authentication source migration"
          git push origin HEAD:main
