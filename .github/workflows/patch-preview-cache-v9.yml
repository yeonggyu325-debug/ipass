name: Patch Preview Cache V9

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump preview cache version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/worker.js')
          s = p.read_text()
          for name in ['resource-preview-v2.css','resource-preview-v3.css','resource-preview-v2.js','resource-preview-v3.js']:
              s = s.replace(f'/{name}?v=8', f'/{name}?v=9')
          p.write_text(s)
          PY
      - name: Commit cache bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker.js
          if git diff --cached --quiet; then
            echo "No cache changes needed"
            exit 0
          fi
          git commit -m "fix: activate pointer anchored preview zoom runtime"
          git push
