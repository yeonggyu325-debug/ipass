name: Fix Committee Routing

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-committee-routing.mjs'
      - '.github/workflows/fix-committee-routing.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply routing fix
        run: node scripts/fix-committee-routing.mjs
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker-v20.js
          git commit -m "fix: stabilize committee routing and shared assets"
          git push origin HEAD:main
