name: Stabilization CI

on:
  push:
    branches:
      - stabilize/enterprise-v3
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stabilize-enterprise-v3
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IPASS_ORIGIN: https://ipass.i-pass-eval.workers.dev
      IPASS_ADMIN_EMAIL: ${{ secrets.IPASS_ADMIN_EMAIL }}
      IPASS_ADMIN_PASSWORD: ${{ secrets.IPASS_ADMIN_PASSWORD }}
      IPASS_PARTNER_EMAIL: ${{ secrets.IPASS_PARTNER_EMAIL }}
      IPASS_PARTNER_PASSWORD: ${{ secrets.IPASS_PARTNER_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full verification
        run: npm run verify:all

      - name: Build Worker dry run
        run: npm run check

      - name: Authenticated production smoke
        if: env.IPASS_ADMIN_EMAIL != '' && env.IPASS_ADMIN_PASSWORD != '' && env.IPASS_PARTNER_EMAIL != '' && env.IPASS_PARTNER_PASSWORD != ''
        run: npm run smoke:authenticated

      - name: Report skipped authenticated smoke
        if: env.IPASS_ADMIN_EMAIL == '' || env.IPASS_ADMIN_PASSWORD == '' || env.IPASS_PARTNER_EMAIL == '' || env.IPASS_PARTNER_PASSWORD == ''
        run: echo "Authenticated smoke skipped because one or more IPASS_* test account secrets are not configured."
